<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데이트 동선</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%20shape-rendering%3D%27crispEdges%27%3E%3Crect%20width%3D%2716%27%20height%3D%2716%27%20rx%3D%273%27%20fill%3D%27%238f6bff%27%2F%3E%3Cpath%20d%3D%27M6%202h4v1h1v1h1v4h-1v1h-1v2H9v2H7v-2H6V9H5V8H4V4h1V3h1z%27%20fill%3D%27%23fff%27%2F%3E%3Cpath%20d%3D%27M7%205h2v2H7z%27%20fill%3D%27%238f6bff%27%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="하루 데이트 코스를 받아 동네 지도를 그리고, 두 사람이 걸어가는 모습과 하루 영수증을 보여 주는 메이커">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">

<style>
/* 레이아웃: 지도 앱 화면처럼. 위 경로 요약 · 왼쪽 큰 지도(자동 생성) · 오른쪽 코스 목록 · 아래 하루 영수증 */
:root {
  --bg: #e4e6e1;
  --land: #eef0ea;
  --road: #ffffff;
  --block: #e1e4dc;
  --park: #cfe3c0;
  --water: #b9d5e8;
  --ink: #1f2420;
  --muted: #6b716a;
  --accent: #e2533a;
}
.poster { width: min(1100px, 100%); background: #fff; color: var(--ink); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 22px 50px -20px rgba(31,36,32,.35); }
.poster.capturing { border-radius: 0; box-shadow: none; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 28px; padding: 20px 24px 16px; border-bottom: 1px solid rgba(31,36,32,.1); }
.top .t { flex: 1 1 320px; min-width: 0; }
.top small { font-size: 13px; font-weight: 700; color: var(--muted); }
.top h1 { margin: 4px 0 0; font-size: 27px; font-weight: 800; letter-spacing: -.045em; text-wrap: balance; }
.top p { margin: 6px 0 0; font-size: 14px; color: #4a5049; line-height: 1.6; }
.sum { display: flex; gap: 22px; }
.sum div small { display: block; font-family: var(--ui-font); letter-spacing: 0; font-size: 11.5px; color: var(--muted); }
.sum b { font-size: 22px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.sum b span { font-size: 13px; font-weight: 600; margin-left: 2px; }
.who { display: flex; gap: 12px; margin-top: 8px; font-size: 12.5px; font-weight: 700; }
.who span { display: inline-flex; align-items: center; gap: 6px; }
.who i { width: 11px; height: 11px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--c); }

.main { display: grid; grid-template-columns: 1fr; }
.mapbox { position: relative; background: var(--land); }
.map { display: block; width: 100%; height: auto; }
.map .lbl { font-family: var(--ui-font); font-size: 21px; font-weight: 800; fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; letter-spacing: -.02em; }
.map .road-name { font-family: var(--ui-font); font-size: 15px; fill: #9aa098; letter-spacing: .05em; }
/* 지도 위 장소 카드: 두 사람이 도착하면 그 자리에 무엇을 했는지가 뜬다 */
.bubble { position: absolute; z-index: 3; width: 270px; background: #fff; color: var(--ink); border: 1.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 10px 12px 11px; font-size: 13.5px; line-height: 1.5; transition: opacity .45s ease, transform .45s ease; }
.bubble.hide { opacity: 0; transform: translateY(6px); pointer-events: none; }
.bubble .bh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.bubble .bh .no { flex: none; width: 22px; height: 22px; display: grid; place-items: center; background: var(--ink); color: #fff; font: 400 12px "Galmuri11", var(--mono); align-self: center; }
.bubble .bh b { font-size: 15.5px; font-weight: 800; letter-spacing: -.02em; }
.bubble .bh time { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.bubble .ac { display: grid; grid-template-columns: 12px 1fr; gap: 6px; }
.bubble .ac i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-top: 6px; }
.bubble .q { margin-top: 7px; padding: 6px 10px; background: #f2f3ef; font-weight: 700; }
.bubble .q small { display: block; font-size: 11px; font-weight: 700; color: var(--c); }
.mapctl { position: absolute; left: 14px; bottom: 14px; z-index: 4; display: flex; gap: 8px; align-items: center; }
.mapctl .play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
.seg { display: inline-flex; background: #fff; border-radius: 999px; box-shadow: 0 2px 8px rgba(0,0,0,.12); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 11px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--muted); min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.capturing .mapctl, .capturing .bubble { display: none; }
.scale { position: absolute; right: 14px; bottom: 14px; z-index: 2; font-family: var(--mono); font-size: 12px; color: var(--muted); background: rgba(255,255,255,.85); padding: 3px 7px; border-radius: 4px; }
.scale i { display: block; width: 66px; height: 4px; border: 1.5px solid var(--muted); border-top: 0; margin-bottom: 2px; }

.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); border-top: 1px solid rgba(31,36,32,.1); }
.list h3 { grid-column: 1 / -1; margin: 0; padding: 14px 18px 0; font-size: 14px; }
.capturing .list { max-height: none; }
.stop { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 14px 18px; border-bottom: 1px solid rgba(31,36,32,.08); border-right: 1px solid rgba(31,36,32,.08); transition: background .3s; }
.stop .num { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--ink); display: grid; place-items: center; }
.stop .num span { transform: rotate(45deg); color: #fff; font-size: 11px; font-weight: 800; }
.stop.on { background: #f6f7f3; }
.stop.on .num { background: var(--accent); }
.stop .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.stop .hd b { font-size: 15px; letter-spacing: -.02em; }
.stop .hd time { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.stop .hd .kd { font-size: 11px; color: var(--muted); }
.stop .acts { margin-top: 5px; display: grid; gap: 3px; font-size: 13px; line-height: 1.55; }
.stop .acts span { display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
.stop .acts i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-top: 6px; }
.stop .line { margin-top: 6px; font-size: 13px; font-weight: 600; padding: 6px 10px; background: #f2f3ef; border-radius: 10px; }
.stop .walk { margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.stop .walk b { color: var(--accent); }

/* 영수증 */
.rc-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; padding: 26px 28px 30px; border-top: 1px solid rgba(31,36,32,.1); background: #f6f7f3; align-items: start; }
.ending small { font-size: 13px; font-weight: 700; color: var(--accent); }
.ending h2 { margin: 4px 0 8px; font-size: 22px; font-weight: 800; letter-spacing: -.035em; text-wrap: balance; }
.ending p { margin: 0; font-size: 14.5px; line-height: 1.8; max-width: 60ch; }
.receipt { background: #fff; padding: 18px 18px 16px; font-family: var(--mono); font-size: 12px; color: #222; position: relative; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
.receipt::after { content: ""; position: absolute; left: 0; right: 0; bottom: -8px; height: 8px; background: radial-gradient(circle at 6px 0, transparent 5px, #fff 5.5px) -6px 0 / 12px 8px repeat-x; }
.receipt h4 { margin: 0 0 2px; text-align: center; font-size: 13px; letter-spacing: .12em; }
.receipt .c { text-align: center; color: #777; font-size: 12px; margin-bottom: 10px; }
.receipt .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 2px 0; }
.receipt .row span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.receipt .row small { color: #888; margin-left: 4px; }
.receipt hr { border: 0; border-top: 1px dashed #bbb; margin: 8px 0; }
.receipt .tot { font-weight: 600; font-size: 13px; }
.receipt .bar { display: flex; height: 8px; margin: 6px 0 2px; }
.receipt .bar i { display: block; height: 100%; }
.receipt .bc { margin-top: 10px; height: 30px; background: repeating-linear-gradient(90deg, #222 0 2px, transparent 2px 4px, #222 4px 5px, transparent 5px 8px, #222 8px 10px, transparent 10px 11px); }
.foot { padding: 12px 24px 16px; font-size: 11px; color: var(--muted); border-top: 1px solid rgba(31,36,32,.1); }

@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; }
  .list { border-left: 0; border-top: 1px solid rgba(31,36,32,.1); max-height: none; }
  .rc-wrap { grid-template-columns: 1fr; padding: 20px 16px 26px; }
  .top { padding: 16px; }
  .top h1 { font-size: 23px; }
  .sum { gap: 16px; }
  .sum b { font-size: 18px; }
  .bubble { width: 220px; font-size: 12.5px; padding: 8px 10px; } .bubble .bh b { font-size: 14px; }
}

/* ───────── 파스텔 Y2K 동네 지도(게임 월드맵 같은): 연보라·하늘 그라데이션 · 굵은 남색 외곽선 · 스티커 같은 핀 · 반짝이 ───────── */
:root { --land: #eef3ff; --block: #e4deff; --park: #c8f3dc; --water: #b5e2ff; --road: #ffffff; --ink: #2e2f6e; --muted: #6d6fa3; --accent: #ff5fa8; --navy: #2e2f6e; }
body[data-mode="view"] { background: radial-gradient(circle at 10% 20%, #fff 0 1.5px, transparent 2px) 0 0 / 46px 46px, radial-gradient(circle at 60% 70%, rgba(255,255,255,.8) 0 1px, transparent 1.5px) 0 0 / 31px 31px, linear-gradient(160deg, #e6dcff 0%, #d6ecff 48%, #ffe2f1 100%) fixed; }
.poster { border-radius: 26px; border: 2.5px solid var(--navy); box-shadow: 6px 6px 0 var(--navy); background: #fffdfb; }
.poster.capturing { box-shadow: none; }
.top { background: linear-gradient(120deg, #cdb8ff 0%, #b9dcff 55%, #ffc6e4 100%); border-bottom: 2.5px solid var(--navy); position: relative; }
.top::after { content: "✦"; position: absolute; right: 20px; top: 10px; font-size: 22px; color: #fff; text-shadow: 0 0 8px rgba(255,255,255,.9); }
.top small { color: var(--navy); background: #fff; border: 2px solid var(--navy); border-radius: 999px; padding: 2px 10px; font-weight: 800; }
.top h1 { margin-top: 10px; font-weight: 900; color: var(--navy); text-shadow: 2px 2px 0 #fff; }
.top p { color: #3d3f7a; font-weight: 500; }
.sum { gap: 10px; }
.sum > div { background: #fff; border: 2px solid var(--navy); border-radius: 16px; padding: 6px 12px; box-shadow: 3px 3px 0 var(--navy); }
.sum div small { color: var(--muted); font-weight: 700; }
.sum b { color: var(--navy); }
.who span { background: #fff; border: 2px solid var(--navy); border-radius: 999px; padding: 2px 10px 2px 6px; }
.mapbox { border-bottom: 2.5px solid var(--navy); }
.map .lbl { fill: var(--navy); font-weight: 900; stroke-width: 7px; }
.map .road-name { fill: #9b9dd0; font-weight: 700; }
.mapctl .play { background: linear-gradient(180deg, #ff8cc3, #ff5fa8); border: 2px solid var(--navy); box-shadow: 3px 3px 0 var(--navy); }
.seg { border: 2px solid var(--navy); box-shadow: 3px 3px 0 var(--navy); }
.seg button[aria-pressed="true"] { background: var(--navy); }
.scale { border: 2px solid var(--navy); border-radius: 999px; color: var(--navy); }
.bubble { border: 2.5px solid var(--navy); border-radius: 18px; box-shadow: 5px 5px 0 var(--navy); background: #fff; }
.bubble .bh .no { border-radius: 50%; background: linear-gradient(180deg, #ff8cc3, #ff5fa8); border: 2px solid var(--navy); }
.bubble .q { border-radius: 12px; background: linear-gradient(90deg, #ffe6f3, #e6f2ff); border: 1.5px dashed #b9b4ef; }
.list { background: linear-gradient(135deg, #f3edff, #e8f4ff 55%, #fff0f8); }
.list h3 { color: var(--navy); font-weight: 900; }
.stop { background: #fff; border: 2px solid var(--navy); border-radius: 18px; margin: 10px; box-shadow: 3px 3px 0 var(--navy); }
.stop .num { background: linear-gradient(180deg, #a99bff, #7c6cf0); border: 2px solid var(--navy); }
.stop.on .num { background: linear-gradient(180deg, #ff8cc3, #ff5fa8); }
.stop .line { border-radius: 12px; background: #f4f0ff; }
.rc-wrap { background: linear-gradient(120deg, #e6dcff 0%, #d6ecff 50%, #ffe2f1 100%); border-top: 2.5px solid var(--navy); }
.ending small { color: var(--accent); }
.ending h2 { color: var(--navy); }
.receipt { border: 2px solid var(--navy); box-shadow: 4px 4px 0 var(--navy); }
.foot { border-top: 2.5px solid var(--navy); background: #fff; color: var(--muted); }
@media (max-width: 640px) { .sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); width: 100%; gap: 6px; } .sum > div { padding: 5px 8px; border-radius: 12px; box-shadow: 2px 2px 0 var(--navy); } .sum b { font-size: 16px; white-space: nowrap; } .sum div small { font-size: 10.5px; } .stop { margin: 6px 10px; } }

/* 바깥: 파스텔 스티커 — 흰 메뉴 줄 · 남색 굵은 외곽선 · 분홍 버튼 · 도트 글씨 */
body[data-mode] header.bar { background: #fff; border-bottom: 2.5px solid #2e2f6e; color: #2e2f6e; }
body[data-mode] .brand, body[data-mode] .bar-title { color: #2e2f6e; }
body[data-mode] .tabs button { border-radius: 999px; color: #2e2f6e; }
body[data-mode] .tabs button[aria-selected="true"] { background: #2e2f6e; color: #fff; }
body[data-mode] .actions { background: #fff; border: 2.5px solid #2e2f6e; border-radius: 999px; box-shadow: 4px 4px 0 #2e2f6e; }
body[data-mode] .actions .btn { border-radius: 999px; border: 2px solid #2e2f6e; background: #fff; box-shadow: none; color: #2e2f6e; }
body[data-mode] .actions .btn.primary { background: linear-gradient(180deg, #ff8cc3, #ff5fa8); color: #fff; }
body[data-mode] .shared-note { background: #fff; color: #2e2f6e; border: 2.5px solid #2e2f6e; border-radius: 16px; box-shadow: 3px 3px 0 #2e2f6e; }
.top h1, .top small, .sum b, .sum div small, .list h3, .stop .hd b, .bubble .bh b, .ending h2, .ending small, .receipt h4, .map .lbl, .who span { font-family: "Galmuri11", var(--ui-font) !important; font-weight: 400 !important; letter-spacing: 0 !important; }
.map .lbl { stroke-width: 6px; }
.stop .walk b { color: #c4206e; } .receipt .row small { font-size: 11px; }

/* 바탕은 단색·그라데이션만 */
body[data-mode="view"] { background: linear-gradient(160deg, #e6dcff 0%, #d6ecff 50%, #ffe2f1 100%) fixed; }

/* 만들기 화면 툴 색 */
body { --e-main:#d43f88;--e-dark:#9c2a62;--e-ink:#2e2350;--e-win:#fbf8ff;--e-s1:#efe8ff;--e-s2:#b9a8f0;--e-bg1:#e6dcff;--e-bg2:#ffe2f1; }

/* 좁은 화면: 장소 카드는 지도 아래 띠로 */
.bubble.docked { position: relative; left: auto; top: auto; width: auto; margin: 10px 12px 4px; box-shadow: 3px 3px 0 var(--ink); }

/* 영수증 줄: 긴 품목·이름도 잘리지 않게 */
.receipt .row span:first-child { white-space: normal; overflow: visible; text-overflow: clip; word-break: keep-all; min-width: 0; }
.receipt .row small { display: inline-block; }
</style>
</head>
<body data-mode="view" data-noframe>
<header class="bar">
  <a class="brand" href="../">귀환의 블로그</a>
  <span class="bar-title">데이트 동선</span>
  <span class="bar-spacer"></span>
  <div class="tabs" role="tablist"><button data-mode="view" role="tab">보기</button><button data-mode="edit" role="tab">만들기</button></div>
</header>
<main class="stage only-view">
  <p class="shared-note" id="shared-note" hidden>공유받은 데이트 코스예요. 만들기에서 고치면 내 브라우저에만 저장돼요.</p>
  <article class="poster" id="poster"></article>
  <nav class="actions">
    <button class="btn primary" id="btn-png">이미지 저장</button>
    <button class="btn" id="btn-link">링크 복사</button>
    <button class="btn" id="btn-replay">처음부터 걷기</button>
  </nav>
</main>
<main class="editor only-edit" id="editor"></main>

(() => {

  for (let y = 40 + R() * 30; y < H - 20; y += 95 + R() * 55) ys.push(Math.round(y));
  const main = { x: xs[Math.floor(xs.length / 2)], y: ys[Math.floor(ys.length / 2)] };
  /* 장소: 왼쪽 아래에서 오른쪽 위로 굽이치며 교차로에 붙임 */
  const n = L.length;
  const pts = L.map((p, i) => {
    const fx = n > 1 ? i / (n - 1) : 0.5;
    const tx = 90 + fx * (W - 180);
    const ty = H * 0.5 + Math.sin(fx * Math.PI * 1.6 + R() * 0.8) * H * 0.28 + (R() - .5) * 60;
    const x = xs.reduce((a, b) => (Math.abs(b - tx) < Math.abs(a - tx) ? b : a));
    const y = ys.reduce((a, b) => (Math.abs(b - ty) < Math.abs(a - ty) ? b : a));
    return { x, y };
  });
  /* 같은 교차로 겹침 피하기 */
  pts.forEach((p, i) => { for (let j = 0; j < i; j++) if (pts[j].x === p.x && pts[j].y === p.y) { const k = xs.indexOf(p.x); p.x = xs[Math.min(xs.length - 1, k + 1)]; } });
  /* 경로: 가로 먼저, 그다음 세로 (도로 위로) */

  const legLen = legs.map(l => Math.abs(l[1][0] - l[0][0]) + Math.abs(l[2][1] - l[1][1]));
  /* 공원 · 강 */
  const parks = L.map((p, i) => (p.kind === 'park' ? pts[i] : null)).filter(Boolean);
  const riverIdx = L.findIndex(p => p.kind === 'river');

      ${p.line ? `<div class="line">${esc(S[p.who].name)} · ${esc(p.line)}</div>` : ''}${walk}</div></div>`;
  }).join('');
  const rows = L.filter(p => p.cost > 0).map(p => `<div class="row"><span>${esc(p.item || p.name)}<small>${p.payer === 'split' ? '반반' : esc(S[p.payer].name)}</small></span><span>${won(p.cost)}</span></div>`).join('');
  const pa = total ? Math.round(paid.a / total * 100) : 50;
  return `
  <header class="top">
    <div class="t"><small>${esc(S.date || '')}</small><h1>${br(S.title || '이름 없는 하루')}</h1>${S.sub ? `<p>${br(S.sub)}</p>` : ''}
      <div class="who"><span style="--c:${esc(S.a.color)}"><i></i>${esc(S.a.name)}</span><span style="--c:${esc(S.b.color)}"><i></i>${esc(S.b.name)}</span></div></div>
    <div class="sum"><div><small>함께 걸은 거리</small><b>${(dist / 1000).toFixed(1)}<span>km</span></b></div><div><small>걸음</small><b>${steps.toLocaleString('ko-KR')}</b></div><div><small>함께한 시간</small><b>${Math.floor(span / 60)}<span>시간</span> ${span % 60}<span>분</span></b></div></div>
  </header>
  <div class="main">
    <div class="mapbox">${mapSVG(S, L, M)}<div class="bubble hide" id="bubble"></div>
      <div class="mapctl"><button class="play" id="d-play" aria-label="걷기 재생"><svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor" aria-hidden="true"><path d="M3.5 2v11L13 7.5z"/></svg></button><span class="seg" id="d-speed"><button data-s="1" aria-pressed="true">1배</button><button data-s="2">2배</button><button data-s="4">4배</button></span></div>
      <span class="scale"><i></i>${Math.round(66 * MPX * (W / 1000))}m</span></div>
    
  </div>
  <div class="list"><h3>코스 기록</h3>${list}</div>
  <section class="rc-wrap">
    <div class="ending"><small>오늘의 결말</small><h2>${br(S.end.title || '마무리 없음')}</h2>${S.end.body ? `<p>${br(S.end.body)}</p>` : ''}</div>
    <div class="receipt"><h4>하루 영수증</h4><div class="c">${esc(S.a.name)} · ${esc(S.b.name)} · ${esc(S.date || '')}</div>
      ${rows || '<div class="row"><span>쓴 돈 없음</span><span>0원</span></div>'}<hr>
      <div class="row tot"><span>합계</span><span>${won(total)}</span></div>
      <div class="bar"><i style="width:${pa}%;background:${esc(S.a.color)}"></i><i style="width:${100 - pa}%;background:${esc(S.b.color)}"></i></div>
      <div class="row"><span>${esc(S.a.name)} ${pa}%</span><span>${esc(S.b.name)} ${100 - pa}%</span></div><hr>
      <div class="row"><span>걸은 거리</span><span>${(dist / 1000).toFixed(2)}km</span></div>
      <div class="row"><span>손잡고 걸은 거리</span><span>${Math.round(holdM)}m</span></div>
      <div class="row"><span>가장 오래 머문 곳</span><span>${longest ? esc(longest.name) : '-'}</span></div>
      <div class="bc"></div></div>
  </section>
  <footer class="foot">데이트 동선 · 지도는 장소 이름으로 그린 가상의 동네예요. 거리와 걸음 수는 지도 위 길이로 계산했어요.</footer>`;
}

/* ── 걷기 연출 ── */
let A = { raf: 0, tok: 0, speed: 1, S: null, L: [], M: null };
function along(l, f) { const L1 = Math.abs(l[1][0] - l[0][0]), L2 = Math.abs(l[2][1] - l[1][1]), d = (L1 + L2) * f; return d <= L1 ? [l[0][0] + Math.sign(l[1][0] - l[0][0]) * d, l[0][1]] : [l[1][0], l[1][1] + Math.sign(l[2][1] - l[1][1]) * (d - L1)]; }
function place(x, y, hold) {
  const off = hold ? 0 : 6;
  $('#dotA').setAttribute('transform', `translate(${x - off} ${y - off})`);
  $('#dotB').setAttribute('transform', `translate(${x + off} ${y + off})`);
  const h = $('#heart'); h.setAttribute('transform', `translate(${x} ${y - 20})`); h.setAttribute('opacity', hold ? '1' : '0');
}
function showStop(i) {
  const { S, L, M } = A; const p = L[i]; const bub = $('#bubble'); const svg = $('#map'); if (!p || !bub || !svg) return;
  document.querySelectorAll('.stop').forEach(e => e.classList.toggle('on', Number(e.dataset.stop) === i));
  bub.innerHTML = `<div class="bh"><span class="no">${i + 1}</span><b>${esc(p.name)}</b><time>${esc(p.t)} · ${p.stay}분</time></div>
    <div class="ac" style="--c:${esc(S.a.color)}"><i></i><span>${esc(p.a)}</span></div><div class="ac" style="--c:${esc(S.b.color)}"><i></i><span>${esc(p.b)}</span></div>
    ${p.line ? `<div class="q" style="--c:${esc(S[p.who].color)}"><small>${esc(S[p.who].name)}</small>${esc(p.line)}</div>` : ''}`;
  /* 장소 옆에, 지도 밖으로 나가지 않게 */
  const box = svg.parentElement.getBoundingClientRect(), r = svg.getBoundingClientRect(), k = r.width / W, px = M.pts[i].x * k, py = M.pts[i].y * k;
  const bw = bub.offsetWidth || 270, bh = bub.offsetHeight || 140;
  let x = px - bw / 2, y = py - bh - 40; if (y < 8) y = py + 34; x = Math.max(8, Math.min(box.width - bw - 8, x)); y = Math.max(8, Math.min(r.height - bh - 8, y));
  /* 좁은 화면: 지도가 작아 카드가 조작 버튼을 가리니 지도 아래에 붙여 보여 준다 */
  const mb = svg.parentElement;
  if (box.width < 560) { if (bub.parentElement === mb) mb.after(bub); bub.style.left = ''; bub.style.top = ''; bub.classList.add('docked'); }
  else { if (bub.parentElement !== mb) mb.append(bub); bub.classList.remove('docked'); bub.style.left = x + 'px'; bub.style.top = y + 'px'; }
  bub.classList.remove('hide');
}
const wait = (ms, tok) => new Promise(r => setTimeout(() => r(tok === A.tok), ms / A.speed));
async function walk() {
  const tok = ++A.tok; const { L, M } = A;
  setPlay(true);
  place(M.pts[0].x, M.pts[0].y, false); showStop(0);
  if (!(await wait(4500, tok))) return;
  for (let i = 0; i < M.legs.length; i++) {
    $('#bubble').classList.add('hide');
    const leg = M.legs[i], hold = L[i + 1].hold, dur = Math.max(2200, M.legLen[i] * 12);
    const t0 = performance.now();
    await new Promise(res => { const step = now => { if (tok !== A.tok) return res(); const f = Math.min(1, (now - t0) * A.speed / dur); const [x, y] = along(leg, f); place(x, y, hold); f < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); });
    if (tok !== A.tok) return;
    showStop(i + 1);
    if (!(await wait(4500, tok))) return;
  }
  setPlay(false);
}
function setPlay(on) { const b = $('#d-play'); if (b) b.innerHTML = on ? '<svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><rect x="3" y="2" width="3.4" height="11"/><rect x="8.6" y="2" width="3.4" height="11"/></svg>' : '<svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor"><path d="M3.5 2v11L13 7.5z"/></svg>'; A.playing = on; }
function render(S, { animate }) {
  A.tok++;
  const L = live(S), M = buildMap(S, L);
  Object.assign(A, { S, L, M });
  $('#poster').innerHTML = posterHTML(S, L, M);
  if (!L.length) return;
  const last = M.pts[M.pts.length - 1]; place(last.x, last.y, L[L.length - 1].hold);
  $('#d-play').onclick = () => (A.playing ? (A.tok++, setPlay(false)) : walk());
  document.querySelectorAll('#d-speed [data-s]').forEach(b => { b.setAttribute('aria-pressed', String(Number(b.dataset.s) === A.speed)); b.onclick = () => { A.speed = Number(b.dataset.s); document.querySelectorAll('#d-speed [data-s]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }; });
  setTimeout(walk, 600);
}
document.getElementById('btn-png').addEventListener('click', () => { A.tok++; setPlay(false); if (A.M) { const p = A.M.pts[A.M.pts.length - 1]; place(p.x, p.y, false); } }, true);

Core.app({
  key: '2inbun:date', what: '데이트 코스', sample, blank, normalize, schema, prompts, apply, progress, render,
  fileName: S => `데이트동선_${S.a.name}_${S.b.name}`,
});
})();
</script>
