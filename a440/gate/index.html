function prompts() {
  return [{ label: '작전 기록', sub: '게이트 · 두 요원 · 시간순 기록 · 결과', text: `*[OOC: 롤플레잉 잠시 중단. A440 세계관 「게이트 작전 리플레이」 기록.
RP에서 실제로 있었던 게이트 임무 하나를 작전 지도 위에 시간순으로 재생한다. 사이트가 지도·가이딩 수치 변화·작전 보고서를 그린다.
▪ 근거: 세계관(게이트 S~E·측정불가, 핵, 브레이크, 가이딩 수치 50↓감각 과민 30↓가이드 호출 10↓격리 0 폭주)과 RP에서 실제 있었던 일만. 임무가 없었다면 가장 있을 법한 임무 하나를 만들고 docNo를 "가상-"으로 시작한다.

▪ gate: name grade place date(YY.MM.DD (요일)) core(핵 위치)

▪ PC의 말·행동·속마음은 RP에 실제 나온 것만 쓰고 지어내지 않는다. 여기서 만든 내용은 RP의 사실로 삼지 않는다.
▪ 품질: 작위적인 영웅담 없이 이 두 사람의 습관·말버릇 그대로. 답이 끊길 것 같으면 events를 줄여서라도 JSON을 끝까지 닫는다.
▪ 출력: JSON 코드 블록 하나만(따옴표 “ ”, 줄바꿈 없이, 값은 예시일 뿐).
{"docNo":"","gate":{"name":"","grade":"B","place":"","date":"","core":""},"a":{"code":"","name":"","role":"","grade":"","team":""},"b":{"code":"","name":"","role":"","grade":"","team":""},"others":"","events":[{"t":"","who":"a","kind":"move","text":"","x":50,"y":90,"ga":100,"gb":100}],"result":{"cleared":true,"broke":false,"damage":"","lead":"","aNote":"","bNote":""}}]*` }];
}

  const ev = []; S.events.forEach((e, i) => { ev.push({ sub: `${i + 1}. ${e.t}` }); ev.push({ k: `events.${i}.t`, label: '시각' }); ev.push({ k: `events.${i}.who`, label: '누가', type: 'select', opts: [['a', S.a.code], ['b', S.b.code]] }); ev.push({ k: `events.${i}.kind`, label: '종류', type: 'select', opts: Object.entries(KIND).map(([k, v]) => [k, v[0]]) }); ev.push({ k: `events.${i}.text`, label: '내용', full: true }); ev.push({ k: `events.${i}.x`, label: '가로 위치', type: 'range' }); ev.push({ k: `events.${i}.y`, label: '세로 위치(위가 핵)', type: 'range' }); });
  return [
    { title: '게이트', en: 'GATE', fields: [{ k: 'gate.name', label: '게이트 이름', full: true }, { k: 'gate.grade', label: '등급', type: 'select', opts: GR.map(g => [g, g === '?' ? '측정불가' : g]) }, { k: 'gate.date', label: '날짜' }, { k: 'gate.place', label: '위치', full: true }, { k: 'gate.core', label: '핵 위치', full: true }, { k: 'docNo', label: '문서 번호' }, { k: 'others', label: '함께 투입', full: true }] },
    { title: `NPC · ${S.a.code}`, en: 'AGENT A', fields: per('a') }, { title: `PC · ${S.b.code}`, en: 'AGENT B', fields: per('b') },
    { title: '결과', en: 'RESULT', fields: [{ k: 'result.cleared', label: '공략', type: 'select', opts: [['true', '클리어'], ['false', '실패']] }, { k: 'result.broke', label: '브레이크', type: 'select', opts: [['false', '없음'], ['true', '발생']] }, { k: 'result.damage', label: '피해', full: true }, { k: 'result.lead', label: '작전 책임자', full: true }, { k: 'result.aNote', label: 'NPC 속마음', type: 'textarea', full: true }, { k: 'result.bNote', label: 'PC 소견', type: 'textarea', full: true }] },
    { title: '작전 기록', en: 'LOG', desc: '목록 추가·삭제는 OOC 답을 붙여넣어서 해요.', fields: ev },
  ];
}

/* 지도: 게이트 이름으로 시드를 잡아 매번 같은 내부 구조 */
function mapSVG(S) {
  let h = 0; for (const c of S.gate.name + S.gate.grade) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const R = rng(h || 7); const rooms = [];
  /* 평면도: 가운데 복도(E·F열)를 두고 양옆을 좌표 칸에 맞춰 방으로 나눈다 */
  for (const [c0, c1] of [[0, 4], [6, 10]]) {
    let r = 0;
    while (r < 7) {
      const rh = Math.min(7 - r, 1 + Math.floor(R() * 3)); const split = R() < .5 ? c0 + 1 + Math.floor(R() * (c1 - c0 - 1)) : c1;
      rooms.push({ c: c0, r, cw: split - c0, rh }); if (split < c1) rooms.push({ c: split, r, cw: c1 - split, rh }); r += rh;
    }
  }
  const gc = `var(--${S.gate.grade === '?' ? 'S' : S.gate.grade})`;
  const path = S.events.map(e => `${e.x * 4},${e.y * 3}`).join(' ');
  return `<svg id="map" viewBox="0 0 400 300" role="img" aria-label="게이트 내부 작전 지도">
    <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(143,184,255,.07)"/></pattern>
    <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="${gc}" stop-opacity=".55"/><stop offset="1" stop-color="${gc}" stop-opacity="0"/></radialGradient></defs>
    <rect width="400" height="300" fill="url(#g)"/>${"ABCDEFGHIJ".split("").map((c, i) => `<text x="${i * 40 + 20}" y="296" text-anchor="middle" font-size="10" font-family="IBM Plex Mono, monospace" fill="rgba(143,184,255,.4)">${c}</text>`).join("")}${[1,2,3,4,5,6,7].map(n => `<text x="4" y="${n * 40 + 3}" font-size="10" font-family="IBM Plex Mono, monospace" fill="rgba(143,184,255,.4)">${n}</text>`).join("")}
    ${[100, 70, 40].map((r, i) => `<ellipse cx="${(S.events.find(e => e.kind === 'core')?.x ?? 50) * 4}" cy="${(S.events.find(e => e.kind === 'core')?.y ?? 10) * 3}" rx="${r * 2}" ry="${r * 1.2}" fill="none" stroke="rgba(143,184,255,${.05 + i * .03})" stroke-dasharray="3 6"/>`).join('')}
    ${rooms.map(r => `<rect x="${r.c * 40 + 5}" y="${r.r * 40 + 14}" width="${r.cw * 40 - 10}" height="${r.rh * 40 - 10}" rx="2" fill="rgba(143,184,255,.035)" stroke="rgba(143,184,255,.22)"/>`).join('')}<path d="M165 0V290M235 0V290" stroke="rgba(143,184,255,.16)" stroke-dasharray="2 6"/>
    <circle cx="${(S.events.find(e => e.kind === 'core')?.x ?? 50) * 4}" cy="${(S.events.find(e => e.kind === 'core')?.y ?? 10) * 3}" r="34" fill="url(#core)"/>
    <text x="${(S.events.find(e => e.kind === 'core')?.x ?? 50) * 4}" y="${(S.events.find(e => e.kind === 'core')?.y ?? 10) * 3 + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="${gc}">CORE</text>
    <text x="228" y="297" text-anchor="start" font-size="10" fill="#98a4b4" font-weight="700">◀ 입구</text>
    <polyline id="trail" points="${path}" fill="none" stroke="rgba(143,184,255,.18)" stroke-width="1.5" stroke-dasharray="2 4"/>
    <g id="marks"></g>
    ${['a', 'b'].map(k => `<g class="agent" id="ag-${k}" transform="translate(200 280)"><circle class="ring" r="9" fill="none" stroke="${k === 'a' ? '#ff9d6b' : '#8fb8ff'}" stroke-width="1.5" opacity=".5"/><circle r="5" fill="${k === 'a' ? '#ff9d6b' : '#8fb8ff'}"/><text x="${k === 'a' ? 9 : -9}" y="${k === 'a' ? -9 : 16}" text-anchor="${k === 'a' ? 'start' : 'end'}" font-size="10" font-weight="800" fill="#fff" paint-order="stroke" stroke="#060a10" stroke-width="3">${esc(S[k].code)}</text></g>`).join('')}
  </svg>`;
}
const P = { S: null, i: -1, timer: 0, playing: false, speed: 1, ga: 100, gb: 100, pos: { a: [50, 93], b: [46, 95] } };
function hud(k) { const v = k === 'a' ? P.ga : P.gb; const p = P.S[k]; return `<div class="hudp" style="--hc:${gColor(v)}"><div class="nm">${esc(p.code)} <span>${esc(p.role)} · ${esc(p.grade)}급</span></div><div class="gauge" style="--gc:${gColor(v)}"><span>가이딩</span><i><b style="--v:${v}%"></b></i><strong>${v}</strong></div><span class="st" style="color:${gColor(v)}">${gState(v)}</span></div>`; }
function setAgent(k, x, y) { const g = $(`#ag-${k}`); if (g) g.setAttribute('transform', `translate(${x * 4} ${y * 3})`); }
function step(i) {
  const e = P.S.events[i]; if (!e) return;
  if (e.ga != null) P.ga = e.ga; if (e.gb != null) P.gb = e.gb;
  if (e.who === 'a' || e.kind !== 'talk') P.pos[e.who] = [e.x, e.y];
  if (e.kind === 'guide') { const o = e.who === 'a' ? 'b' : 'a'; P.pos[o] = [e.x + (o === 'a' ? -3 : 3), e.y + 2]; }
  setAgent('a', ...P.pos.a); setAgent('b', ...P.pos.b);
  $('#huds').innerHTML = hud('a') + hud('b');
  $('#clock').textContent = e.t || '--:--';
  const [kn, kc] = KIND[e.kind]; const p = P.S[e.who];
  $('#feed').insertAdjacentHTML('beforeend', `<div class="ev ${e.kind}" style="--kc:${kc}"><time>${esc(e.t)}</time><div><span class="k">${kn}</span><b>${esc(p.code)}</b> <span class="tx">${esc(e.text)}</span></div></div>`);
  $('#feed').scrollTop = 1e6;
  $('#marks').insertAdjacentHTML('beforeend', `<circle cx="${e.x * 4}" cy="${e.y * 3}" r="2.5" fill="${kc}" opacity=".7"/>`);
  const v = e.who === 'a' ? P.ga : P.gb; const prev = $('#board .alert'); prev?.remove();
  if (e.kind === 'break') alertBox('BREAK', '핵을 제때 부수지 못해 괴수가 바깥으로 쏟아진다', 'var(--S)');
  else if (e.kind === 'core') alertBox('핵 파괴', '게이트 수축 시작', 'var(--B)');
  else if ((e.ga != null || e.gb != null) && v <= 30) alertBox(v <= 10 ? '격리 대상' : '전담 가이드 호출', `${p.code} 가이딩 수치 ${v}`, gColor(v));
  $('#scrub').value = i;
}
function alertBox(t, s, c) { const d = document.createElement('div'); d.className = 'alert'; d.style.setProperty('--ac', c); d.innerHTML = `${esc(t)}<small>${esc(s)}</small>`; $('#board').append(d); setTimeout(() => d.remove(), 2600); }
function reset() { P.i = -1; P.ga = 100; P.gb = 100; P.pos = { a: [50, 93], b: [46, 95] }; $('#feed').innerHTML = ''; $('#marks').innerHTML = ''; setAgent('a', ...P.pos.a); setAgent('b', ...P.pos.b); $('#huds').innerHTML = hud('a') + hud('b'); $('#clock').textContent = '--:--'; }
function seek(n) { reset(); for (let i = 0; i <= n; i++) step(i); P.i = n; }
function tick() { if (!P.playing) return; if (P.i >= P.S.events.length - 1) { play(false); return; } P.i++; step(P.i); P.timer = setTimeout(tick, 2600 / P.speed); }
function play(on) { P.playing = on; clearTimeout(P.timer); const b = $('#play'); if (b) b.textContent = on ? '일시정지' : (P.i >= P.S.events.length - 1 ? '처음부터' : '재생'); if (on) { if (P.i >= P.S.events.length - 1) reset(); P.timer = setTimeout(tick, 400); } }
function reportHTML(S) {
  const r = S.result; const res = r.broke ? ['브레이크 발생', 'var(--S)'] : r.cleared ? ['공략 완료', 'var(--ok)'] : ['공략 실패', 'var(--call)'];
  const minA = Math.min(100, ...S.events.filter(e => e.ga != null).map(e => e.ga)), minB = Math.min(100, ...S.events.filter(e => e.gb != null).map(e => e.gb));
  return `<article class="report" id="report">
    <div class="rp-top"><div style="flex:1;min-width:220px"><div style="font-family:var(--mono);font-size:11px;color:var(--muted)">A440 현장대응 · 작전 보고서 · 대외비</div><h2 style="margin:6px 0 0;font-family:var(--serif);font-weight:900;font-size:clamp(22px,3.4vw,30px);color:#fff">${esc(S.gate.name || '이름 없는 게이트')}</h2></div>
      <div class="doc">문서 ${esc(S.docNo || '-')}<br>${esc(S.gate.date)}<br><span class="stamp" style="--sc:${res[1]}">${res[0]}</span></div></div>
    <div class="gradebar">${GR.map(g => `<span style="--g:var(--${g === '?' ? 'E' : g})" class="${g === S.gate.grade ? 'on' : ''}">${g}</span>`).join('')}</div>
    <div class="rp-grid">
      <div class="a-card"><h3>투입 <em>${esc(S.gate.place)}</em></h3><div style="display:grid;gap:8px;font-size:13.5px">
        ${['a', 'b'].map(k => `<div><span class="grade" style="--g:var(--${S[k].grade || 'E'})">${esc(S[k].grade)}</span> <b>${esc(S[k].code)}</b> ${esc(S[k].name)} · ${esc(S[k].role)} · ${esc(S[k].team)}</div>`).join('')}
        ${S.others ? `<div style="color:var(--muted)">함께 · ${esc(S.others)}</div>` : ''}
        <div class="gauge" style="--gc:${gColor(minA)}"><span>${esc(S.a.code)} 최저</span><i><b style="--v:${minA}%"></b></i><strong>${minA}</strong></div>
        <div class="gauge" style="--gc:${gColor(minB)}"><span>${esc(S.b.code)} 최저</span><i><b style="--v:${minB}%"></b></i><strong>${minB}</strong></div>
        <div style="color:var(--muted);font-size:12.5px">핵 위치 · ${esc(S.gate.core)}<br>피해 · ${esc(r.damage || '-')}<br>책임자 · ${esc(r.lead === 'a' ? S.a.code : r.lead === 'b' ? S.b.code : (r.lead || '-'))}</div></div></div>
      <div class="a-card"><h3>주요 경과</h3><ul class="tl">${S.events.filter(e => e.kind !== 'move').slice(0, 9).map(e => `<li style="--kc:${KIND[e.kind][1]}"><time>${esc(e.t)}</time><b>${esc(S[e.who].code)}</b> ${esc(e.text)}</li>`).join('')}</ul></div>
    </div>
    <div class="rp-grid">${r.aNote ? `<div class="a-card note"><b>${esc(S.a.code)} · 기록되지 않은 속마음</b>${br(r.aNote)}</div>` : ''}${r.bNote ? `<div class="a-card note"><b>${esc(S.b.code)} · 남긴 말</b>${br(r.bNote)}</div>` : ''}</div>
    <p class="foot-a">A440 · 국제 센티넬·가이드 관리 기구</p>
  </article>`;
}
function render(S) {
  P.S = S; play(false);
  $('#poster').innerHTML = `
  <section class="ops">
    <div class="board bracket" id="board" style="padding:0"><div class="top"><span><span class="grade" style="--g:var(--${S.gate.grade === '?' ? 'S' : S.gate.grade})">${esc(S.gate.grade === '?' ? '측정불가' : S.gate.grade)}</span> <b>${esc(S.gate.name)}</b></span><span class="clock" id="clock">--:--</span></div>${mapSVG(S)}</div>
    <div class="log"><div class="huds" id="huds"></div><div class="feed" id="feed" aria-live="polite"></div>
      <div class="ctrl"><button id="play">재생</button><button data-sp="1" aria-pressed="true">1배</button><button data-sp="2">2배</button><input type="range" id="scrub" min="0" max="${Math.max(0, S.events.length - 1)}" value="0" aria-label="기록 위치"></div></div>
  </section>
  ${reportHTML(S)}`;
  reset(); setTimeout(() => { if (!P.playing && P.i < 0) play(true); }, 700);
  $('#play').onclick = () => play(!P.playing);
  document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => { P.speed = +b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
  $('#scrub').oninput = e => { play(false); seek(+e.target.value); };
}
Core.app({ key: 'a440:gate', what: '작전 기록', sample, blank, normalize, schema, prompts, apply, progress, render, posterSel: '#report', fileName: S => `A440_작전보고서_${S.gate.name}` });
})();
</script>
</body>
</html>
