  if (P.seq[0] && P.seq[0].intro) ch.push({ t: 0, k: '', n: '전주', x: 'intro' });
  P.seq.forEach(q => { if (q.intro) return; if (q.pass === 0 && M[q.i].bar.first) { const si = M[q.i].bar.si; ch.push({ t: q.rel, k: 'ABCDEF'[si], n: S.sections[si].name || `${si + 1}절` }); } else if (q.pass === 1 && q.i === 0) ch.push({ t: q.rel, k: '', n: '반복' }); });
  mk.innerHTML = ch.map((c, i) => { const end = ch[i + 1] ? ch[i + 1].t : total; return `<button type="button" class="${c.k ? '' : 'nk'} ${c.x || ''}" style="--w:${(end - c.t).toFixed(2)}" data-t="${c.t}" title="${esc(c.n)}">${c.k ? `<b>${c.k}</b>` : ''}<span>${esc(c.n)}</span></button>`; }).join('');
  const jump = d => { if (BUSY) return; const ts = ch.map(c => c.t); let i = ts.filter(t => t <= POS + .05).length - 1;
    if (d < 0) i = POS - (ts[i] || 0) > 2 ? i : i - 1; else i += 1; i = Math.max(0, Math.min(ts.length - 1, i)); seekTo(ts[i]); };
  $('#pprev').onclick = () => jump(-1); $('#pnext').onclick = () => jump(1);
  mk.onclick = e => { const b = e.target.closest('button'); if (b) seekTo(+b.dataset.t); };
  const wv = $('#pwave'), at = e => { const r = wv.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * total; };
  wv.onpointerdown = e => { if (BUSY) return; wv.setPointerCapture(e.pointerId); const was = ON; if (ON) halt(); POS = at(e); showPos(P, M, S);
    wv.onpointermove = ev => { POS = at(ev); showPos(P, M, S); };
    wv.onpointerup = () => { wv.onpointermove = wv.onpointerup = null; if (was) play(S, M, POS); else setBtn(POS > 0 ? '이어서' : '연주'); }; };
  $('#sheet').onclick = e => { const h = e.target.closest('.bh'); if (!h || BUSY) return; const q = P.seq.find(q => !q.intro && q.pass === 0 && q.i === +h.dataset.i); if (q) { POS = q.rel; play(S, M, POS); } };
  const mb = $('#btn-mp3'); if (mb) mb.onclick = () => saveAudio(S, M);
}
document.addEventListener('keydown', e => { if (e.code !== 'Space' || /input|textarea|select|button/i.test(e.target.tagName) || document.body.dataset.mode !== 'view') return; e.preventDefault(); $('#playb')?.click(); });
Core.app({ key: 'a440:score', what: '악보', sample, blank, normalize, schema, prompts, apply, progress, render, posterSel: '#sheet', fileName: S => `악보_${S.title}` });
})();
