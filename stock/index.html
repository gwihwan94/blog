<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>호감 증권</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%20shape-rendering%3D%27crispEdges%27%3E%3Crect%20width%3D%2716%27%20height%3D%2716%27%20rx%3D%273%27%20fill%3D%27%230b0d10%27%2F%3E%3Cpath%20d%3D%27M3%2011h2v2H3zM7%207h2v6H7zM11%203h2v10h-2z%27%20fill%3D%27%23ff4d4f%27%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="RP 속 사건으로 호감도를 주가처럼 그려 주는 증권 화면 메이커">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<style>
/* 바깥: 2000년대 증권사 프로그램(HTS). 검은 창 · 빨강 상승 · 파랑 하락 · 노란 강조 */
:root { --bg: #05070a; --pan: #0e1217; --pan2: #141a21; --line: #262d36; --ink: #d7dde5; --sub: #8893a0; --up: #ff4d4f; --dn: #3d8bff; --hi: #f5d90a; --mono: "IBM Plex Mono", ui-monospace, monospace; }
body[data-mode] { background: var(--bg); color: var(--ink); }
body[data-mode] header.bar { background: #0b0e12; border-bottom: 1px solid var(--line); color: var(--ink); }
body[data-mode] .brand, body[data-mode] .bar-title { color: var(--ink); }
body[data-mode] .tabs button { color: var(--sub); }
body[data-mode] .tabs button[aria-selected="true"] { background: var(--hi); color: #111; }
body[data-mode] .actions { background: #0b0e12; border: 1px solid var(--line); }
body[data-mode] .actions .btn { color: var(--ink); }
body[data-mode] .actions .btn.primary { background: var(--hi); color: #111; }
body[data-mode] .shared-note, body[data-mode] .pc-note { background: var(--pan); color: var(--ink); border: 1px solid var(--line); }
body[data-mode="edit"] { background: #eef0f2; color: #111; }

.poster { width: min(1120px, 100%); background: var(--pan); border: 1px solid var(--line); font-family: "Pretendard Variable", Pretendard, sans-serif; color: var(--ink); }
.poster.capturing { border: 0; }
.wbar { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; background: linear-gradient(180deg, #1b222b, #11161c); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--sub); }
.wbar b { color: var(--ink); font-weight: 600; }
.wbar .sp { flex: 1; }
.wbar .tag { font: 600 11px var(--mono); padding: 1px 6px; border: 1px solid var(--line); color: var(--hi); }
.tick { overflow: hidden; white-space: nowrap; border-bottom: 1px solid var(--line); background: #090c10; font-size: 12.5px; height: 28px; display: flex; align-items: center; }
.tick-in { display: inline-flex; gap: 38px; padding-left: 100%; animation: tk 48s linear infinite; }
.tick-in span b { margin-right: 6px; }
@keyframes tk { to { transform: translateX(-100%); } }
.capturing .tick-in { animation: none; padding-left: 12px; }

.quote { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
.q-nm { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.q-nm h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.q-nm small { font: 500 12px var(--mono); color: var(--sub); }
.q-nm .mk { font-size: 11px; padding: 2px 6px; background: #1d2530; color: var(--sub); }
.q-px { display: flex; align-items: baseline; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
.q-px .px { font: 700 40px/1 var(--mono); letter-spacing: -.02em; }
.q-px .ch { font: 600 16px var(--mono); }
.q-px .lim { font-size: 12px; font-weight: 700; padding: 3px 7px; color: #fff; }
.up { color: var(--up); } .dn { color: var(--dn); } .fl { color: var(--ink); }
.lim.up { background: var(--up); } .lim.dn { background: var(--dn); }
.q-tb { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 18px; font-size: 12px; }
.q-tb span { color: var(--sub); } .q-tb b { font: 600 13px var(--mono); text-align: right; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 250px; }
.chart { padding: 10px 6px 6px 12px; border-right: 1px solid var(--line); min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--sub); padding: 0 6px 6px; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }
.cd { cursor: pointer; }
.cd rect.hit { fill: transparent; }
.cd:hover rect.hit, .cd.on rect.hit { fill: rgba(245,217,10,.08); }
.g-in { transform-box: fill-box; transform-origin: 50% 100%; animation: chIn .45s ease-out both; }
@keyframes chIn { from { opacity: 0; transform: scaleY(.2); } to { opacity: 1; transform: none; } }
.ma { stroke-dasharray: 2000; animation: evin 2.2s ease-out both; }
@keyframes evin { from { stroke-dashoffset: 2000; } to { stroke-dashoffset: 0; } }
.still .g-in, .still .ma { animation: none; }

.side { display: flex; flex-direction: column; min-width: 0; }
.ob h3, .op h3, .news h3, .det h3 { margin: 0; padding: 7px 12px; font-size: 12px; font-weight: 700; color: var(--sub); background: var(--pan2); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
.ob table { width: 100%; border-collapse: collapse; font: 500 12px var(--mono); }
.ob td { padding: 2.5px 10px; border-bottom: 1px solid #161c23; }
.ob td:nth-child(1) { text-align: left; color: var(--dn); } .ob td:nth-child(3) { text-align: right; color: var(--up); }
.ob td:nth-child(2) { text-align: center; font-weight: 600; }
.ob tr.ask td:nth-child(1) { background: rgba(61,139,255,.07); } .ob tr.bid td:nth-child(3) { background: rgba(255,77,79,.07); }
.ob tr.cur td:nth-child(2) { outline: 1px solid var(--hi); outline-offset: -1px; }
.det { border-top: 1px solid var(--line); flex: 1; }
.det .bd { padding: 10px 12px 12px; font-size: 12.5px; line-height: 1.6; }
.det .bd b { font: 600 13px var(--mono); }
.det .bd p { margin: 6px 0 0; color: var(--ink); }

.bot { display: grid; grid-template-columns: minmax(0, 1fr) 360px; border-top: 1px solid var(--line); }
.news { border-right: 1px solid var(--line); min-width: 0; }
.news ul { list-style: none; margin: 0; padding: 4px 0; }
.news li { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 10px; padding: 6px 12px; font-size: 13px; line-height: 1.5; border-bottom: 1px solid #161c23; cursor: pointer; }
.news li:hover, .news li.on { background: #121820; }
.news li time { font: 500 12px var(--mono); color: var(--sub); }
.news li em { font-style: normal; font: 600 12px var(--mono); white-space: nowrap; }
.news li .brk { color: var(--hi); font-weight: 700; margin-right: 4px; }
.op .bd { padding: 12px 14px 14px; }
.op .rt { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.op .rt b { font-size: 22px; font-weight: 800; }
.op .rt span { font: 600 13px var(--mono); color: var(--sub); }
.op .rt span strong { color: var(--ink); }
.op p { margin: 8px 0 0; font-size: 13px; line-height: 1.65; }
.op .by { margin-top: 10px; font-size: 11px; color: var(--sub); }
.foot { display: flex; justify-content: space-between; gap: 10px; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 11px; color: var(--sub); background: #0a0d11; }

@media (max-width: 820px) {
  .main, .bot { grid-template-columns: 1fr; }
  .chart, .news { border-right: 0; }
  .side { border-top: 1px solid var(--line); }
  .quote { grid-template-columns: 1fr; }
  .q-px .px { font-size: 32px; }
}
</style>

<body data-mode="view" data-noframe>
<header class="bar">

<main class="stage only-view">
  <p class="shared-note" id="shared-note" hidden>공유받은 차트예요. 만들기에서 고치면 내 브라우저에만 저장돼요.</p>
  <article class="poster" id="poster"></article>
  <nav class="actions">
    <button class="btn primary" id="btn-png">이미지 저장</button>
    <button class="btn" id="btn-link">링크 복사</button>
    <button class="btn" id="btn-replay">차트 다시 그리기</button>
  </nav>
</main>
<main class="editor only-edit" id="editor"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.8/dist/index.js"></script>
<script src="../assets/core.js"></script>
<script>
(() => {
const { esc, clamp, num, $ } = Core;
const MAX = 12;
const RATE = ['적극 매수', '매수', '보유', '매도', '적극 매도'];
const emptyDay = () => ({ d: '', s: 50, news: '' });
const blank = () => ({ v: 1, title: '', code: '', a: { name: 'NPC' }, b: { name: 'PC' }, days: Array.from({ length: MAX }, emptyDay), opinion: { rate: '보유', target: 50, note: '' } });
const sample = () => ({
  v: 1, title: 'NPC의 공녀 호감도', code: 'A0314',
  a: { name: 'NPC' }, b: { name: 'PC' },
  days: [
    { d: '3.14', s: 20, news: '황궁 무도회 첫 춤. 의례상 한 곡, 시장 반응 무덤덤' },
    { d: '4.02', s: 23, news: '황궁 서고에서 같은 책에 손을 뻗음. 소폭 상승' },
    { d: '4.19', s: 21, news: '공녀가 다른 공자와 춤을 춘 사실 확인. 약보합' },
    { d: '5.11', s: 27, news: '정략 약혼 발표. 당사자는 담담하다는 입장' },
    { d: '6.20', s: 35, news: '공녀가 먼저 말을 걺. 장중 상한가' },
    { d: '7.03', s: 31, news: '“우연입니다. 매번.” 해명에 차익 실현 매물' },
    { d: '8.15', s: 33, news: '서고 방문 시간이 공녀와 완전히 겹치는 것으로 드러남' },
    { d: '9.08', s: 24, news: '사절단 접대 소식을 남에게서 먼저 들음. 급락' },
    { d: '9.09', s: 30, news: '“제일 먼저 말하고 싶었어요.” 하루 만에 반등' },
    { d: '10.30', s: 39, news: '비 오는 정원, 망토 하나를 같이 씀. 상한가' },
    { d: '11.21', s: 37, news: '부치지 않은 편지를 태웠다는 첩보. 숨 고르기' },
    { d: '11.24', s: 44, news: '신년 연회 파트너로 먼저 청함. 52주 신고가' },
  ],
  opinion: { rate: '매수', target: 60, note: '서고 동선이 겹치는 한 우상향 흐름이 이어질 전망. 다만 말을 아끼는 습관이 단기 변동성 요인. 고백 공시가 나오면 목표가 상향 여지가 있음.' },
});
function normalize(s) {
  const b = blank(); s = s && typeof s === 'object' ? s : {};
  const o = { ...b, ...s, a: { ...b.a, ...(s.a || {}) }, b: { ...b.b, ...(s.b || {}) }, opinion: { ...b.opinion, ...(s.opinion || {}) } };
  o.days = Array.from({ length: MAX }, (_, i) => { const d = { ...emptyDay(), ...((s.days || [])[i] || {}) }; d.s = clamp(Math.round(num(d.s, 50)), 0, 100); return d; });
  if (!RATE.includes(o.opinion.rate)) o.opinion.rate = '보유';
  o.opinion.target = clamp(Math.round(num(o.opinion.target, 50)), 0, 100);
  return o;
}
function apply(S, o) {
  const got = [];
  for (const k of ['a', 'b']) if (o[k] && o[k].name) S[k].name = o[k].name;
  ['title', 'code'].forEach(k => { if (o[k]) { S[k] = o[k]; if (!got.includes('종목')) got.push('종목'); } });
  if (Array.isArray(o.days)) { S.days = Array.from({ length: MAX }, emptyDay); o.days.slice(0, MAX).forEach((d, i) => { if (d && typeof d === 'object') S.days[i] = { ...emptyDay(), ...d }; }); got.push('시세'); }
  if (o.opinion && typeof o.opinion === 'object') { S.opinion = { ...S.opinion, ...o.opinion }; got.push('투자의견'); }
  return got;
}
function prompts() {
  const p = `*[OOC: 롤플레잉 잠시 중단. 「호감 증권」 시세 기록.
NPC가 PC에게 느끼는 호감도를 주식으로 본다. 사이트가 값으로 캔들 차트·등락률·상한가를 그린다.
▪ title 종목명 16자(예: “NPC의 PC 호감도”), code 종목 코드 6자(영문+숫자)
▪ days: 첫 만남부터 지금까지 호감이 움직인 실제 날 4~12개, 시간순. d 날짜 표기(예: “3.14”), s 그날 장 마감 호감도 0~100, news 그날 일을 증권 뉴스 말투로 30자(“~함”, “급등”, “차익 실현 매물” 같은 증권 용어)
▪ 하루 30% 넘게 오르거나 떨어지면 상한가·하한가로 보이니, 정말 큰 사건에만 크게 움직인다.
▪ opinion: rate(적극 매수|매수|보유|매도|적극 매도) target 목표 호감도 0~100, note 애널리스트 리포트 말투 2문장 90자(전망과 변수)
▪ 근거: 설정과 RP에서 실제 있었던 일만. PC의 말·행동은 RP에 나온 것만 쓰고 지어내지 않는다. 여기서 만든 내용은 이후 RP의 사실로 삼지 않는다.
▪ 출력: 인사·설명 없이 JSON 코드 블록 하나만. 문자열 안 따옴표는 “ ”만. 값은 형식 예시일 뿐.
{"title":"","code":"","days":[{"d":"","s":50,"news":""}],"opinion":{"rate":"보유","target":50,"note":""}}]*`;
  return [{ label: '호감 증권 시세', sub: '날짜별 호감도 · 뉴스 · 투자의견', text: p }];
}
function progress(S) {
  const n = S.days.filter(d => d.d).length;
  return [{ label: `시세 ${n}일`, ok: n >= 2 }, { label: '종목', ok: !!S.title }, { label: '투자의견', ok: !!S.opinion.note }];
}
function schema(S) {
  const dd = [];
  S.days.forEach((d, i) => { dd.push({ sub: `${i + 1}일째` }, { k: `days.${i}.d`, label: '날짜', ph: '비우면 빠져요' }, { k: `days.${i}.s`, label: '호감도(종가)', type: 'range' }, { k: `days.${i}.news`, label: '뉴스', full: true }); });
  return [
    { title: '종목', en: 'TICKER', fields: [{ k: 'title', label: '종목명' }, { k: 'code', label: '종목 코드' }, { k: 'a.name', label: '마음을 가진 사람' }, { k: 'b.name', label: '상대' }] },
    { title: '시세', en: 'DAILY', desc: '호감도 1이 주가 1,000원이에요. 하루에 30% 넘게 오르면 상한가로 표시돼요.', fields: dd },
    { title: '투자의견', en: 'REPORT', fields: [{ k: 'opinion.rate', label: '의견', type: 'select', opts: RATE.map(r => [r, r]) }, { k: 'opinion.target', label: '목표 호감도', type: 'range' }, { k: 'opinion.note', label: '리포트', type: 'textarea', full: true }] },
  ];
}

/* ── 계산 ── */
const won = n => Math.round(n).toLocaleString('ko-KR');
const price = s => Math.max(100, s * 1000);
const hash = (t, i) => { let h = 2166136261 ^ i; for (const c of String(t)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return ((h >>> 0) % 1000) / 1000; };
const tickOf = p => p < 5000 ? 5 : p < 20000 ? 10 : p < 50000 ? 50 : 100;
function series(S) {
  const ds = S.days.filter(d => d.d);
  let prev = null;
  return ds.map((d, i) => {
    const c = price(d.s), o = prev == null ? Math.round(c * (0.96 + hash(d.d, 1) * .03)) : prev;
    const w = Math.max(c, o) * (0.006 + hash(d.news, 2) * .02), w2 = Math.min(c, o) * (0.006 + hash(d.news, 3) * .02);
    const h = Math.max(c, o) + w, l = Math.max(50, Math.min(c, o) - w2);
    const chg = prev == null ? 0 : (c - prev) / prev * 100;
    const vol = Math.round((Math.abs(chg) * 9000 + 20000 + hash(d.d, 4) * 40000));
    prev = c;
    return { ...d, i, o, c, h, l, chg, vol, lim: chg >= 29.5 ? 'up' : chg <= -29.5 ? 'dn' : '' };
  });
}
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : 'fl';
const arrow = v => v > 0 ? '▲' : v < 0 ? '▼' : '-';

function chartSVG(ser, still) {
  const W = 820, H = 300, VH = 70, L = 8, R = 70, T = 14;
  if (!ser.length) return `<svg viewBox="0 0 ${W} ${H + VH}"><text x="${W / 2}" y="${H / 2}" fill="#8893a0" font-size="14" text-anchor="middle">시세가 없어요. 만들기에서 날짜를 넣어 주세요.</text></svg>`;
  const hi = Math.max(...ser.map(s => s.h)), lo = Math.min(...ser.map(s => s.l)), pad = (hi - lo) * .12 || hi * .1;
  const top = hi + pad, bot = Math.max(0, lo - pad);
  const y = v => T + (top - v) / (top - bot) * (H - T - 20);
  const n = ser.length, cw = (W - L - R) / n, bw = Math.max(6, Math.min(26, cw * .55));
  const x = i => L + cw * i + cw / 2;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = bot + (top - bot) * k / 4, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#1d242d"/><text x="${W - R + 8}" y="${yy + 4}" fill="#8893a0" font-size="11" font-family="IBM Plex Mono">${won(v)}</text>`; }
  const maxV = Math.max(...ser.map(s => s.vol));
  const ma = ser.map((s, i) => { const w = ser.slice(Math.max(0, i - 4), i + 1); return w.reduce((a, b) => a + b.c, 0) / w.length; });
  const maP = ma.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const last = ser[n - 1];
  const cds = ser.map((s, i) => {
    const col = s.c > s.o ? '#ff4d4f' : s.c < s.o ? '#3d8bff' : '#d7dde5';
    const yt = y(Math.max(s.o, s.c)), yb = y(Math.min(s.o, s.c)), vh = s.vol / maxV * (VH - 18);
    const d = still ? '' : ` style="animation-delay:${i * 140}ms"`;
    return `<g class="cd" data-i="${i}"><rect class="hit" x="${x(i) - cw / 2}" y="0" width="${cw}" height="${H + VH}"/>
      <g class="g-in"${d}><line x1="${x(i)}" x2="${x(i)}" y1="${y(s.h)}" y2="${y(s.l)}" stroke="${col}" stroke-width="1.4"/><rect x="${x(i) - bw / 2}" y="${yt}" width="${bw}" height="${Math.max(1.5, yb - yt)}" fill="${col}"/></g>
      <rect class="g-in" x="${x(i) - bw / 2}" y="${H + VH - vh}" width="${bw}" height="${vh}" fill="${col}" opacity=".55"${d}/>
      <text x="${x(i)}" y="${H - 4}" fill="#8893a0" font-size="10.5" text-anchor="middle" font-family="IBM Plex Mono">${esc(s.d)}</text>
      ${s.lim ? `<text x="${x(i)}" y="${s.lim === 'up' ? y(s.h) - 7 : y(s.l) + 15}" fill="${col}" font-size="10.5" font-weight="700" text-anchor="middle">${s.lim === 'up' ? '상한가' : '하한가'}</text>` : ''}</g>`;
  }).join('');
  const peak = ser.reduce((a, b) => b.h > a.h ? b : a);
  return `<svg viewBox="0 0 ${W} ${H + VH}" role="img" aria-label="호감도 일봉 차트">
    ${g}<line x1="${L}" x2="${W - R}" y1="${H}" y2="${H}" stroke="#262d36"/>
    ${cds}
    <path class="ma" d="${maP}" fill="none" stroke="#f5d90a" stroke-width="1.5"/>
    <line x1="${L}" x2="${W - R}" y1="${y(last.c)}" y2="${y(last.c)}" stroke="${last.chg >= 0 ? '#ff4d4f' : '#3d8bff'}" stroke-dasharray="3 3" opacity=".7"/>
    <rect x="${W - R + 2}" y="${y(last.c) - 9}" width="${R - 4}" height="18" fill="${last.chg >= 0 ? '#ff4d4f' : '#3d8bff'}"/><text x="${W - R + 8}" y="${y(last.c) + 4}" fill="#fff" font-size="11" font-weight="600" font-family="IBM Plex Mono">${won(last.c)}</text>
    <text x="${x(peak.i)}" y="${Math.max(12, y(peak.h) - (peak.lim === 'up' ? 20 : 7))}" fill="#f5d90a" font-size="10.5" text-anchor="middle">최고 ${won(peak.h)}</text>
  </svg>`;
}
function bookHTML(c) {
  const t = tickOf(c); let r = '';
  for (let k = 5; k >= 1; k--) r += `<tr class="ask"><td>${won(800 + hash(c, k) * 9000)}</td><td class="up">${won(c + t * k)}</td><td></td></tr>`;
  r += `<tr class="cur"><td></td><td class="fl">${won(c)}</td><td></td></tr>`;
  for (let k = 1; k <= 5; k++) r += `<tr class="bid"><td></td><td class="dn">${won(c - t * k)}</td><td>${won(800 + hash(c, k + 9) * 9000)}</td></tr>`;
  return `<table aria-label="호가"><tbody>${r}</tbody></table>`;
}
function detHTML(s) {
  if (!s) return '<p>캔들이나 뉴스를 누르면 그날 시세가 나와요.</p>';
  return `<div><b>${esc(s.d)}</b> · 종가 <b>${won(s.c)}</b> <span class="${cls(s.chg)}">${arrow(s.chg)} ${Math.abs(s.chg).toFixed(2)}%</span></div>
    <div style="color:var(--sub);font:500 11.5px var(--mono);margin-top:2px">시 ${won(s.o)} · 고 ${won(s.h)} · 저 ${won(s.l)} · 거래량 ${won(s.vol)}</div>
    <p>${esc(s.news || '')}</p>`;
}
function posterHTML(S, ser, still) {
  const last = ser[ser.length - 1], prev = ser[ser.length - 2];
  const diff = last && prev ? last.c - prev.c : 0, chg = last ? last.chg : 0;
  const hi = ser.length ? Math.max(...ser.map(s => s.h)) : 0, lo = ser.length ? Math.min(...ser.map(s => s.l)) : 0;
  const news = ser.filter(s => s.news);
  const tk = news.map(s => `<span><b class="${cls(s.chg)}">${arrow(s.chg)} ${Math.abs(s.chg).toFixed(1)}%</b>${esc(s.news)}</span>`).join('');
  const rc = /매수/.test(S.opinion.rate) ? 'up' : /매도/.test(S.opinion.rate) ? 'dn' : 'fl';
  return `
  <div class="wbar"><b>[0314] 현재가</b><span>${esc(S.a.name)} → ${esc(S.b.name)}</span><span class="sp"></span><span class="tag">실시간</span><span>귀환증권 HTS</span></div>
  <div class="tick">${tk ? `<div class="tick-in">${tk}${tk}</div>` : ''}</div>
  <section class="quote">
    <div>
      <div class="q-nm"><h1>${esc(S.title || `${S.a.name}의 호감도`)}</h1><small>${esc(S.code || '000000')}</small><span class="mk">연애 코스닥</span></div>
      <div class="q-px"><span class="px ${cls(diff)}" id="px">${last ? won(last.c) : '-'}</span><span class="ch ${cls(diff)}">${arrow(diff)} ${won(Math.abs(diff))} (${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%)</span>${last && last.lim ? `<span class="lim ${last.lim}">${last.lim === 'up' ? '상한가' : '하한가'}</span>` : ''}</div>
    </div>
    <div class="q-tb">
      <span>시가</span><span>고가</span><span>저가</span>
      <b>${last ? won(last.o) : '-'}</b><b class="up">${last ? won(last.h) : '-'}</b><b class="dn">${last ? won(last.l) : '-'}</b>
      <span>거래량</span><span>최고가</span><span>최저가</span>
      <b>${last ? won(last.vol) : '-'}</b><b>${won(hi)}</b><b>${won(lo)}</b>
    </div>
  </section>
  <div class="main">
    <div class="chart ${still ? 'still' : ''}">
      <div class="legend"><span><i style="background:#f5d90a"></i>5일 이동평균</span><span><i style="background:#ff4d4f"></i>상승</span><span><i style="background:#3d8bff"></i>하락</span><span>호감도 1 = 1,000원</span></div>
      ${chartSVG(ser, still)}
    </div>
    <aside class="side">
      <div class="ob"><h3><span>매도잔량</span><span>호가</span><span>매수잔량</span></h3>${last ? bookHTML(last.c) : ''}</div>
      <div class="det"><h3>그날 시세</h3><div class="bd" id="det">${detHTML(last)}</div></div>
    </aside>
  </div>
  <div class="bot">
    <section class="news"><h3><span>종목 뉴스</span><span>${news.length}건</span></h3><ul>${news.slice().reverse().map(s => `<li data-i="${s.i}"><time>${esc(s.d)}</time><span>${Math.abs(s.chg) >= 15 ? '<span class="brk">[속보]</span>' : ''}${esc(s.news)}</span><em class="${cls(s.chg)}">${arrow(s.chg)} ${Math.abs(s.chg).toFixed(1)}%</em></li>`).join('')}</ul></section>
    <section class="op"><h3><span>투자의견</span><span>리서치센터</span></h3><div class="bd">
      <div class="rt"><b class="${rc}">${esc(S.opinion.rate)}</b><span>목표가 <strong>${won(price(S.opinion.target))}</strong>원</span>${last ? `<span>상승 여력 <strong class="${cls(price(S.opinion.target) - last.c)}">${((price(S.opinion.target) - last.c) / last.c * 100).toFixed(1)}%</strong></span>` : ''}</div>
      <p>${esc(S.opinion.note || '')}</p>
      <div class="by">귀환증권 리서치센터 · 이 리포트는 RP 속 사실만을 근거로 작성되었습니다.</div>
    </div></section>
  </div>
  <div class="foot"><span>${esc(S.a.name)}의 마음 · 상대 ${esc(S.b.name)}</span><span>${ser.length}거래일</span></div>`;
}
let cur = null;
function render(S, { animate }) {
  const ser = series(S); cur = ser;
  const el = $('#poster'); el.innerHTML = posterHTML(S, ser, !animate);
  const pick = i => { const s = ser[i]; $('#det').innerHTML = detHTML(s); el.querySelectorAll('.cd').forEach(c => c.classList.toggle('on', +c.dataset.i === i)); el.querySelectorAll('.news li').forEach(l => l.classList.toggle('on', +l.dataset.i === i)); };
  el.querySelectorAll('.cd').forEach(c => c.addEventListener('click', () => pick(+c.dataset.i)));
  el.querySelectorAll('.news li').forEach(l => l.addEventListener('click', () => pick(+l.dataset.i)));
  /* 현재가 숫자가 첫날 값에서 올라간다 */
  const px = $('#px'); if (animate && px && ser.length > 1) {
    const a = ser[0].c, b = ser[ser.length - 1].c, t0 = performance.now(), dur = ser.length * 140 + 400;
    const f = now => { const k = Math.min(1, (now - t0) / dur); px.textContent = won(a + (b - a) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f); setTimeout(() => { px.textContent = won(b); }, dur + 100);
  }
}
Core.app({ key: '2inbun:stock', what: '시세', sample, blank, normalize, schema, prompts, apply, progress, render, fileName: S => `호감증권_${S.a.name}` });
})();
</script>
</body>
