<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>호감 증권</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%20shape-rendering%3D%27crispEdges%27%3E%3Crect%20width%3D%2716%27%20height%3D%2716%27%20rx%3D%273%27%20fill%3D%27%230b0d10%27%2F%3E%3Cpath%20d%3D%27M3%2011h2v2H3zM7%207h2v6H7zM11%203h2v10h-2z%27%20fill%3D%27%23ff4d4f%27%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="RP 속 사건으로 호감도를 주가처럼 그려 주는 증권 화면 메이커">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<style>
/* 콘셉트: 요즘 증권 앱의 종목 상세 화면. 짙은 남색 바탕 · 둥근 카드 · 크고 굵은 숫자 · 빨강 상승 파랑 하락 · 금색 강조 */
:root { --bg: #090b0f; --card: #13161c; --card2: #191d25; --line: #232933; --ink: #eef1f6; --sub: #8c95a4; --up: #ff5a5f; --dn: #4a8dff; --gold: #ffcf4a; --upbg: rgba(255,90,95,.13); --dnbg: rgba(74,141,255,.13); }
body[data-mode="view"] { background: radial-gradient(1200px 600px at 50% -10%, #1a2030 0%, var(--bg) 60%) fixed, var(--bg); color: var(--ink); }
body[data-mode] header.bar { background: rgba(9,11,15,.85); border-bottom: 1px solid var(--line); color: var(--ink); backdrop-filter: blur(8px); }
body[data-mode] .brand, body[data-mode] .bar-title { color: var(--ink); }
body[data-mode] .tabs button { color: var(--sub); }
body[data-mode] .tabs button[aria-selected="true"] { background: var(--gold); color: #111; }
body[data-mode] .actions { background: #161a21; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
body[data-mode] .actions .btn { color: var(--ink); }
body[data-mode] .actions .btn.primary { background: var(--gold); color: #111; }
body[data-mode="view"] .shared-note, body[data-mode="view"] .pc-note { background: var(--card); color: var(--sub); border: 1px solid var(--line); border-radius: 999px; }
body[data-mode="edit"] { background: #eef0f2; color: #111; }

.poster { width: min(1120px, 100%); background: var(--bg); color: var(--ink); border-radius: 24px; padding: 18px; display: grid; gap: 14px; font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; font-variant-numeric: tabular-nums; border: 1px solid #1b2029; }
.poster.capturing { border-radius: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; min-width: 0; }
.up { color: var(--up); } .dn { color: var(--dn); } .fl { color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.pill.up { background: var(--upbg); } .pill.dn { background: var(--dnbg); } .pill.fl { background: #20252e; }

/* 뉴스 띠 */
.tick { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 6px 0 14px; overflow: hidden; }
.tick .live { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--gold); letter-spacing: .04em; }
.tick .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px rgba(255,207,74,.18); }
.tick .rail { flex: 1; min-width: 0; overflow: hidden; }
.tick-in { display: flex; gap: 26px; white-space: nowrap; overflow: hidden; font-size: 13px; color: #c9cfd9; }
.tick-in span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tick-in span:first-child { flex: none; max-width: 60%; }
.tick-in b { margin-right: 6px; font-weight: 700; }
@keyframes tk { to { transform: translateX(-50%); } }
.capturing .tick-in { animation: none; }

/* 종목 머리 */
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 22px 24px; }
.who { display: flex; align-items: center; gap: 14px; }
.av { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 22px; font-weight: 800; color: #fff; background: linear-gradient(140deg, #ff8a5c, #ff4d6d); flex: none; overflow: hidden; }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av.ph-slot::after { content: "사진"; }
.who h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.who small { display: block; margin-top: 3px; font-size: 13px; color: var(--sub); }
.who small b { color: #c9cfd9; font-weight: 600; }
.px-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.px { font-size: 54px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.px em { font-style: normal; font-size: 22px; font-weight: 700; margin-left: 4px; color: var(--sub); }
.lim { padding: 5px 10px; border-radius: 8px; font-size: 13px; font-weight: 800; color: #fff; }
.lim.up { background: var(--up); } .lim.dn { background: var(--dn); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(92px, auto)); gap: 10px 26px; }
.stats div span { display: block; font-size: 12px; color: var(--sub); margin-bottom: 3px; }
.stats div b { font-size: 16px; font-weight: 700; }

/* 가운데 */
.mid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; }
.chart { padding: 16px 16px 10px; position: relative; }
.c-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: #0e1116; border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 7px; font-size: 13px; font-weight: 700; color: var(--sub); }
.seg button[aria-pressed="true"] { background: #262c37; color: var(--ink); }
.seg button:focus-visible { outline: 2px solid var(--gold); }
.lg { display: flex; gap: 14px; font-size: 12px; color: var(--sub); flex-wrap: wrap; }
.lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.c-in { transform-box: fill-box; transform-origin: 50% 100%; animation: chIn .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes chIn { from { opacity: 0; transform: scaleY(.15); } to { opacity: 1; transform: none; } }
.ln { stroke-dasharray: 3000; animation: evin 1.8s ease-out both; }
@keyframes evin { from { stroke-dashoffset: 3000; } to { stroke-dashoffset: 0; } }
.still .c-in, .still .ln { animation: none; }
.tip { position: absolute; pointer-events: none; min-width: 190px; max-width: 250px; padding: 10px 12px; background: rgba(25,29,37,.96); border: 1px solid #2d3441; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.45); font-size: 12.5px; line-height: 1.5; opacity: 0; transition: opacity .12s; }
.tip.on { opacity: 1; }
.tip .t1 { display: flex; justify-content: space-between; gap: 10px; color: var(--sub); }
.tip .t2 { font-size: 18px; font-weight: 800; margin: 2px 0 4px; }
.tip p { margin: 0; color: #d9dee7; }

/* 오른쪽: 투자의견 게이지 · 호가 */
.rcol { display: grid; gap: 14px; align-content: start; }
.op { padding: 16px 18px 18px; }
.k { font-size: 13px; font-weight: 700; color: var(--sub); display: flex; justify-content: space-between; }
.gauge { display: block; width: 100%; max-width: 280px; height: auto; margin: 6px auto 0; }
.rate { text-align: center; margin-top: -8px; }
.rate b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.rate span { font-size: 13px; color: var(--sub); }
.rate span strong { color: var(--ink); font-weight: 700; }
.op p { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; line-height: 1.7; color: #cfd5de; }
.op .by { margin-top: 8px; font-size: 11.5px; color: var(--sub); }
.ob { padding: 14px 14px 10px; }
.ob .rows { display: grid; gap: 3px; margin-top: 10px; }
.ob .r { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 24px; font-size: 12.5px; font-weight: 600; }
.ob .r .q { position: relative; z-index: 1; padding: 0 8px; color: var(--sub); }
.ob .r .q:last-child { text-align: right; }
.ob .r .p { position: relative; z-index: 1; padding: 0 6px; }
.ob .bar { position: absolute; top: 2px; bottom: 2px; border-radius: 5px; }
.ob .ask .bar { right: 50%; margin-right: 34px; background: var(--dnbg); }
.ob .bid .bar { left: 50%; margin-left: 34px; background: var(--upbg); }
.ob .cur { background: #1f2430; border-radius: 6px; }
.ob .cur .p { color: var(--gold); }

/* 뉴스 */
.low { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
.news { padding: 16px 18px 10px; }
.news ol { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 26px; }
.news li { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); font-size: 13.5px; line-height: 1.45; cursor: default; }
.news li:nth-child(-n+2) { border-top: 0; }
.news li time { font-size: 12.5px; color: var(--sub); font-weight: 600; }
.news li .brk { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 5px; background: rgba(255,207,74,.14); color: var(--gold); font-size: 11.5px; font-weight: 800; vertical-align: 1px; }
.news li .pill { font-size: 12.5px; padding: 3px 8px; }
.news li.hl { background: linear-gradient(90deg, rgba(255,207,74,.07), transparent); }
.foot { display: flex; justify-content: space-between; gap: 10px; padding: 0 6px; font-size: 11.5px; color: #5f6876; }

@media (max-width: 900px) {
  .mid { grid-template-columns: 1fr; }
  .low { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .poster { padding: 10px; border-radius: 16px; gap: 10px; }
  .head { grid-template-columns: 1fr; padding: 18px; gap: 16px; }
  .px { font-size: 40px; }
  .stats { grid-template-columns: repeat(3, 1fr); gap: 10px 12px; }
  .rcol { grid-template-columns: 1fr; }
  .news ol { grid-template-columns: 1fr; }
  .news li:nth-child(2) { border-top: 1px solid var(--line); }
}
</style>
</head>
<body data-mode="view" data-noframe>
<header class="bar">
  <a class="brand" href="../">귀환의 블로그</a>
  <span class="bar-title">호감 증권</span>
  <span class="bar-spacer"></span>
  <div class="tabs" role="tablist"><button data-mode="view" role="tab">보기</button><button data-mode="edit" role="tab">만들기</button></div>
</header>
<main class="stage only-view">
  <p class="shared-note" id="shared-note" hidden>공유받은 차트예요. 만들기에서 고치면 내 브라우저에만 저장돼요.</p>
  <article class="poster" id="poster"></article>
  <nav class="actions">
    <button class="btn primary" id="btn-png">이미지 저장</button>
    <button class="btn" id="btn-link">링크 복사</button>
    <button class="btn" id="btn-replay">차트 다시 그리기</button>
  </nav>
</main>
<main class="editor only-edit" id="editor"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.8/dist/index.js"></script>
<script src="../assets/core.js"></script>
<script>
(() => {
const { esc, clamp, num, $ } = Core;
const MAX = 12;
const RATE = ['적극 매수', '매수', '보유', '매도', '적극 매도'];
const emptyDay = () => ({ d: '', s: 50, news: '' });
const blank = () => ({ v: 1, title: '', code: '', a: { name: 'NPC' }, b: { name: 'PC' }, days: Array.from({ length: MAX }, emptyDay), opinion: { rate: '보유', target: 50, note: '' } });
const sample = () => ({
  v: 1, title: 'NPC의 공녀 호감도', code: 'A0314',
  a: { name: 'NPC' }, b: { name: 'PC' },
  days: [
    { d: '3.14', s: 20, news: '황궁 무도회 첫 춤. 의례상 한 곡, 시장 반응 무덤덤' },
    { d: '4.02', s: 23, news: '황궁 서고에서 같은 책에 손을 뻗음. 소폭 상승' },
    { d: '4.19', s: 21, news: '공녀가 다른 공자와 춤을 춘 사실 확인. 약보합' },
    { d: '5.11', s: 27, news: '정략 약혼 발표. 당사자는 담담하다는 입장' },
    { d: '6.20', s: 35, news: '공녀가 먼저 말을 걺. 장중 상한가' },
    { d: '7.03', s: 31, news: '“우연입니다. 매번.” 해명에 차익 실현 매물' },
    { d: '8.15', s: 33, news: '서고 방문 시간이 공녀와 완전히 겹치는 것으로 드러남' },
    { d: '9.08', s: 24, news: '사절단 접대 소식을 남에게서 먼저 들음. 급락' },
    { d: '9.09', s: 30, news: '“제일 먼저 말하고 싶었어요.” 하루 만에 반등' },
    { d: '10.30', s: 39, news: '비 오는 정원, 망토 하나를 같이 씀. 상한가' },
    { d: '11.21', s: 37, news: '부치지 않은 편지를 태웠다는 첩보. 숨 고르기' },
    { d: '11.24', s: 44, news: '신년 연회 파트너로 먼저 청함. 52주 신고가' },
  ],
  opinion: { rate: '매수', target: 60, note: '서고 동선이 겹치는 한 우상향 흐름이 이어질 전망. 다만 말을 아끼는 습관이 단기 변동성 요인. 고백 공시가 나오면 목표가 상향 여지가 있음.' },
});
function normalize(s) {
  const b = blank(); s = s && typeof s === 'object' ? s : {};
  const o = { ...b, ...s, a: { ...b.a, ...(s.a || {}) }, b: { ...b.b, ...(s.b || {}) }, opinion: { ...b.opinion, ...(s.opinion || {}) } };
  o.days = Array.from({ length: MAX }, (_, i) => { const d = { ...emptyDay(), ...((s.days || [])[i] || {}) }; d.s = clamp(Math.round(num(d.s, 50)), 0, 100); return d; });
  if (!RATE.includes(o.opinion.rate)) o.opinion.rate = '보유';
  o.opinion.target = clamp(Math.round(num(o.opinion.target, 50)), 0, 100);
  return o;
}
function apply(S, o) {
  const got = [];
  for (const k of ['a', 'b']) if (o[k] && o[k].name) S[k].name = o[k].name;
  ['title', 'code'].forEach(k => { if (o[k]) { S[k] = o[k]; if (!got.includes('종목')) got.push('종목'); } });
  if (Array.isArray(o.days)) { S.days = Array.from({ length: MAX }, emptyDay); o.days.slice(0, MAX).forEach((d, i) => { if (d && typeof d === 'object') S.days[i] = { ...emptyDay(), ...d }; }); got.push('시세'); }
  if (o.opinion && typeof o.opinion === 'object') { S.opinion = { ...S.opinion, ...o.opinion }; got.push('투자의견'); }
  return got;
}
function prompts() {
  const p = `*[OOC: 롤플레잉 잠시 중단. 「호감 증권」 시세 기록.
NPC가 PC에게 느끼는 호감도를 주식으로 본다. 사이트가 값으로 캔들 차트·등락률·상한가를 그린다.
▪ title 종목명 16자(예: “NPC의 PC 호감도”), code 종목 코드 6자(영문+숫자)
▪ days: 첫 만남부터 지금까지 호감이 움직인 실제 날 4~12개, 시간순. d 날짜 표기(예: “3.14”), s 그날 장 마감 호감도 0~100, news 그날 일을 증권 뉴스 말투로 30자(“~함”, “급등”, “차익 실현 매물” 같은 증권 용어)
▪ 하루 30% 넘게 오르거나 떨어지면 상한가·하한가로 보이니, 정말 큰 사건에만 크게 움직인다.
▪ opinion: rate(적극 매수|매수|보유|매도|적극 매도) target 목표 호감도 0~100, note 애널리스트 리포트 말투 2문장 90자(전망과 변수)
▪ 근거: 설정과 RP에서 실제 있었던 일만. PC의 말·행동은 RP에 나온 것만 쓰고 지어내지 않는다. 여기서 만든 내용은 이후 RP의 사실로 삼지 않는다.
▪ 출력: 인사·설명 없이 JSON 코드 블록 하나만. 문자열 안 따옴표는 “ ”만. 값은 형식 예시일 뿐.
{"title":"","code":"","days":[{"d":"","s":50,"news":""}],"opinion":{"rate":"보유","target":50,"note":""}}]*`;
  return [{ label: '호감 증권 시세', sub: '날짜별 호감도 · 뉴스 · 투자의견', text: p }];
}
function progress(S) {
  const n = S.days.filter(d => d.d).length;
  return [{ label: `시세 ${n}일`, ok: n >= 2 }, { label: '종목', ok: !!S.title }, { label: '투자의견', ok: !!S.opinion.note }];
}
function schema(S) {
  const dd = [];
  S.days.forEach((d, i) => { dd.push({ sub: `${i + 1}일째` }, { k: `days.${i}.d`, label: '날짜', ph: '비우면 빠져요' }, { k: `days.${i}.s`, label: '호감도(종가)', type: 'range' }, { k: `days.${i}.news`, label: '뉴스', full: true }); });
  return [
    { title: '종목', en: 'TICKER', fields: [{ k: 'title', label: '종목명' }, { k: 'code', label: '종목 코드' }, { k: 'a.name', label: '마음을 가진 사람' }, { k: 'b.name', label: '상대' }] },
    { title: '시세', en: 'DAILY', desc: '호감도 1이 주가 1,000원이에요. 하루에 30% 넘게 오르면 상한가로 표시돼요.', fields: dd },
    { title: '투자의견', en: 'REPORT', fields: [{ k: 'opinion.rate', label: '의견', type: 'select', opts: RATE.map(r => [r, r]) }, { k: 'opinion.target', label: '목표 호감도', type: 'range' }, { k: 'opinion.note', label: '리포트', type: 'textarea', full: true }] },
  ];
}

/* ── 계산 ── */
const won = n => Math.round(n).toLocaleString('ko-KR');
const price = s => Math.max(100, s * 1000);
const hash = (t, i) => { let h = 2166136261 ^ i; for (const c of String(t)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return ((h >>> 0) % 1000) / 1000; };
const tickOf = p => p < 5000 ? 5 : p < 20000 ? 10 : p < 50000 ? 50 : 100;
function series(S) {
  const ds = S.days.filter(d => d.d);
  let prev = null;
  return ds.map((d, i) => {
    const c = price(d.s), o = prev == null ? Math.round(c * (0.96 + hash(d.d, 1) * .03)) : prev;
    const h = Math.max(c, o) * (1.006 + hash(d.news, 2) * .02), l = Math.max(50, Math.min(c, o) * (0.994 - hash(d.news, 3) * .02));
    const chg = prev == null ? 0 : (c - prev) / prev * 100;
    const vol = Math.round(Math.abs(chg) * 9000 + 20000 + hash(d.d, 4) * 40000);

}
const cls = v => v > 0 ? 'up' : v < 0 ? 'dn' : 'fl';
const arrow = v => v > 0 ? '▲' : v < 0 ? '▼' : '';
const pct = v => `${v > 0 ? '+' : ''}${v.toFixed(2)}%`;
const UP = '#ff5a5f', DN = '#4a8dff', GOLD = '#ffcf4a';

let mode = 'candle', CW = 760;
function geo(ser) {
  const W = CW, H = CW < 600 ? 260 : 300, VH = CW < 600 ? 46 : 56, L = 4, R = 64, T = 26, B = 26;
  const hi = Math.max(...ser.map(s => s.h)), lo = Math.min(...ser.map(s => s.l)), pad = (hi - lo) * .1 || hi * .1;
  const top = hi + pad, bot = Math.max(0, lo - pad);
  const n = ser.length, cw = (W - L - R) / n;
  return { W, H, VH, L, R, T, B, top, bot, n, cw, bw: Math.max(6, Math.min(22, cw * .5)), x: i => L + cw * i + cw / 2, y: v => T + (top - v) / (top - bot) * (H - T - B) };
}
function chartSVG(ser, still) {
  if (!ser.length) return `<svg viewBox="0 0 ${CW} 300"><text x="${CW / 2}" y="150" fill="#8c95a4" font-size="14" text-anchor="middle">시세가 없어요. 만들기에서 날짜를 넣어 주세요.</text></svg>`;
  const G = geo(ser), { W, H, VH, L, R, x, y, bw } = G;
  const last = ser[ser.length - 1], first = ser[0], upAll = last.c >= first.c, lc = upAll ? UP : DN;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = G.bot + (G.top - G.bot) * k / 4, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#1e232c"/><text x="${W - R + 10}" y="${yy + 4}" fill="#6c7583" font-size="11">${won(v)}</text>`; }
  const pts = ser.map(s => [x(s.i), y(s.c)]);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area = `${line} L${pts[pts.length - 1][0].toFixed(1)} ${H - G.B} L${pts[0][0].toFixed(1)} ${H - G.B} Z`;
  const maxV = Math.max(...ser.map(s => s.vol));
  const dl = i => still ? '' : ` style="animation-delay:${i * 110}ms"`;
  const vols = ser.map(s => { const vh = s.vol / maxV * (VH - 10), col = s.c >= s.o ? UP : DN; return `<rect class="c-in" x="${x(s.i) - bw / 2}" y="${H + VH - vh}" width="${bw}" height="${vh}" rx="2" fill="${col}" opacity=".35"${dl(s.i)}/>`; }).join('');
  const cds = mode === 'candle' ? ser.map(s => {
    const col = s.c > s.o ? UP : s.c < s.o ? DN : '#c9cfd9', yt = y(Math.max(s.o, s.c)), yb = y(Math.min(s.o, s.c));
    return `<g class="c-in"${dl(s.i)}><line x1="${x(s.i)}" x2="${x(s.i)}" y1="${y(s.h)}" y2="${y(s.l)}" stroke="${col}" stroke-width="1.5" stroke-linecap="round"/><rect x="${x(s.i) - bw / 2}" y="${yt}" width="${bw}" height="${Math.max(2, yb - yt)}" rx="2.5" fill="${col}"/></g>`;
  }).join('') : '';
  const dots = mode === 'line' ? ser.map(s => `<circle cx="${x(s.i)}" cy="${y(s.c)}" r="3.5" fill="#0c0e12" stroke="${lc}" stroke-width="2"/>`).join('') : '';
  const lims = ser.filter(s => s.lim).map(s => { const up = s.lim === 'up', yy = up ? y(s.h) - 16 : y(s.l) + 16; return `<g><rect x="${x(s.i) - 22}" y="${yy - 10}" width="44" height="18" rx="9" fill="${up ? UP : DN}"/><text x="${x(s.i)}" y="${yy + 3}" fill="#fff" font-size="10.5" font-weight="800" text-anchor="middle">${up ? '상한가' : '하한가'}</text></g>`; }).join('');
  const labels = ser.map(s => (ser.length <= (CW < 600 ? 5 : 8) || s.i % (CW < 600 ? 3 : 2) === 0 || s.i === ser.length - 1) ? `<text x="${x(s.i)}" y="${H - 6}" fill="#6c7583" font-size="11" text-anchor="middle">${esc(s.d)}</text>` : '').join('');
  const yl = y(last.c);
  return `<svg viewBox="0 0 ${W} ${H + VH}" role="img" aria-label="호감도 차트" id="csvg">
    <defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lc}" stop-opacity="${mode === 'line' ? .32 : .14}"/><stop offset="1" stop-color="${lc}" stop-opacity="0"/></linearGradient></defs>
    ${g}
    <path d="${area}" fill="url(#ar)"/>

    ${cds}${dots}${lims}${labels}
    <line x1="${L}" x2="${W - R}" y1="${H}" y2="${H}" stroke="#1e232c"/>
    ${vols}
    <line x1="${L}" x2="${W - R}" y1="${yl}" y2="${yl}" stroke="${last.chg >= 0 ? UP : DN}" stroke-dasharray="2 4" opacity=".8"/>
    <rect x="${W - R + 4}" y="${yl - 11}" width="${R - 4}" height="22" rx="6" fill="${last.chg >= 0 ? UP : DN}"/><text x="${W - R / 2 + 2}" y="${yl + 4}" fill="#fff" font-size="11.5" font-weight="800" text-anchor="middle">${won(last.c)}</text>

function gaugeSVG(rate) {

  const cx = 130, cy = 120, r = 96, seg = Math.PI / 5;
  let s = '';
  for (let k = 0; k < 5; k++) {
    const a0 = Math.PI + k * seg + .03, a1 = Math.PI + (k + 1) * seg - .03;
    const p = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    const on = (4 - k) === i;
    s += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${cols[k] || '#8c95a4'}" stroke-width="${on ? 16 : 12}" fill="none" stroke-linecap="round" opacity="${on ? 1 : .35}"/>`;
  }
  /* 적극 매도(왼쪽) → 적극 매수(오른쪽) */
  const ang = Math.PI + (4 - i + .5) * seg;

    <text x="${cx - r}" y="${cy + 18}" fill="#6c7583" font-size="11" text-anchor="middle">매도</text><text x="${cx + r}" y="${cy + 18}" fill="#6c7583" font-size="11" text-anchor="middle">매수</text>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#eef1f6" stroke-width="3.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="7" fill="#eef1f6"/><circle cx="${cx}" cy="${cy}" r="3" fill="#13161c"/></svg>`;
}
function bookHTML(c) {
  const t = tickOf(c), qs = [];
  for (let k = 1; k <= 10; k++) qs.push(800 + hash(c, k) * 9000);
  const mx = Math.max(...qs);
  let r = '';
  for (let k = 5; k >= 1; k--) r += `<div class="r ask"><span class="bar" style="width:${(qs[k - 1] / mx * 40).toFixed(1)}%"></span><span class="q">${won(qs[k - 1])}</span><span class="p dn">${won(c + t * k)}</span><span class="q"></span></div>`;
  r += `<div class="r cur"><span class="q"></span><span class="p">${won(c)}</span><span class="q"></span></div>`;
  for (let k = 1; k <= 5; k++) r += `<div class="r bid"><span class="bar" style="width:${(qs[k + 4] / mx * 40).toFixed(1)}%"></span><span class="q"></span><span class="p up">${won(c - t * k)}</span><span class="q">${won(qs[k + 4])}</span></div>`;

function posterHTML(S, ser, still) {
  const last = ser[ser.length - 1], prev = ser[ser.length - 2];
  const diff = last && prev ? last.c - prev.c : 0, chg = last ? last.chg : 0;
  const hi = ser.length ? Math.max(...ser.map(s => s.h)) : 0, lo = ser.length ? Math.min(...ser.map(s => s.l)) : 0;
  const news = ser.filter(s => s.news);
  const tk = news.map(s => `<span><b class="${cls(s.chg)}">${arrow(s.chg)} ${Math.abs(s.chg).toFixed(1)}%</b>${esc(s.news)}</span>`).join('');
  const rc = /매수/.test(S.opinion.rate) ? 'up' : /매도/.test(S.opinion.rate) ? 'dn' : 'fl';
  const tgt = price(S.opinion.target), room = last ? (tgt - last.c) / last.c * 100 : 0;
  const nm = S.title || `${S.a.name}의 호감도`;
  return `
  <div class="card tick"><span class="live"><i></i>LIVE</span><div class="rail">${tk ? `<div class="tick-in">${news.slice(-2).reverse().map(x => `<span><b class="${cls(x.chg)}">${arrow(x.chg)} ${Math.abs(x.chg).toFixed(1)}%</b>${esc(x.news)}</span>`).join('')}</div>` : ''}</div></div>
  <section class="card head">

      <div class="px-row"><span class="px ${cls(diff)}"><span id="px">${last ? won(last.c) : '-'}</span><em>원</em></span>
        <span class="pill ${cls(diff)}">${arrow(diff)} ${won(Math.abs(diff))} · ${pct(chg)}</span>${last && last.lim ? `<span class="lim ${last.lim}">${last.lim === 'up' ? '상한가' : '하한가'}</span>` : ''}</div>
    </div>
    <div class="stats">
      <div><span>시가</span><b>${last ? won(last.o) : '-'}</b></div><div><span>고가</span><b class="up">${last ? won(last.h) : '-'}</b></div><div><span>저가</span><b class="dn">${last ? won(last.l) : '-'}</b></div>
      <div><span>거래량</span><b>${last ? won(last.vol) : '-'}</b></div><div><span>최고가</span><b>${won(hi)}</b></div><div><span>최저가</span><b>${won(lo)}</b></div>
    </div>

        <div class="lg"><span><i style="background:${UP}"></i>상승</span><span><i style="background:${DN}"></i>하락</span><span>호감도 1 = 1,000원 · ${ser.length}거래일</span></div></div>
      ${chartSVG(ser, still)}
    </section>
    <div class="rcol">
      <section class="card op"><div class="k"><span>투자의견</span><span>귀환증권 리서치</span></div>
        ${gaugeSVG(S.opinion.rate)}
        <div class="rate"><b class="${rc}">${esc(S.opinion.rate)}</b><span>목표가 <strong>${won(tgt)}원</strong>${last ? ` · 상승 여력 <strong class="${cls(room)}">${pct(room)}</strong>` : ''}</span></div>
        ${S.opinion.note ? `<p>${esc(S.opinion.note)}</p>` : ''}

    </div>

  <div class="low">

    <ol>${news.slice().reverse().map(s => `<li data-i="${s.i}"><time>${esc(s.d)}</time><span>${Math.abs(s.chg) >= 15 ? '<span class="brk">속보</span>' : ''}${esc(s.news)}</span><span class="pill ${cls(s.chg)}">${s.i ? `${arrow(s.chg)} ${Math.abs(s.chg).toFixed(1)}%` : '상장'}</span></li>`).join('')}</ol>

${last ? `<section class="card ob"><div class="k"><span>호가</span><span>매도 · 매수 잔량</span></div><div class="rows">${bookHTML(last.c)}</div></section>` : ''}
  </div>

let curS = null;
function render(S, { animate }) {

  const ser = series(S);
  const el = $('#poster'); el.innerHTML = posterHTML(S, ser, !animate);
  el.querySelectorAll('.seg [data-m]').forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; render(curS, { animate: true }); }));
  /* 차트 위에 마우스를 올리면 그날 시세와 뉴스 */
  const svg = $('#csvg'), tip = $('#tip'), xh = $('#xh'), hov = $('#hov');

    const G = geo(ser);

      const r = svg.getBoundingClientRect(), k = G.W / r.width, vx = (e.clientX - r.left) * k;
      const i = clamp(Math.floor((vx - G.L) / G.cw), 0, ser.length - 1), s = ser[i], X = G.x(i);

      const box = $('#chart').getBoundingClientRect(), px = X / k + (r.left - box.left);

    const a = ser[0].c, b = ser[ser.length - 1].c, t0 = performance.now(), dur = ser.length * 110 + 500;
    const f = now => { const k = Math.min(1, (now - t0) / dur); px.textContent = won(a + (b - a) * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f); setTimeout(() => { px.textContent = won(b); }, dur + 100);
  }
}
Core.app({ key: '2inbun:stock', what: '시세', sample, blank, normalize, schema, prompts, apply, progress, render, fileName: S => `호감증권_${S.a.name}` });
