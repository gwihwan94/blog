<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대전 화면</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%20shape-rendering%3D%27crispEdges%27%3E%3Crect%20width%3D%2716%27%20height%3D%2716%27%20rx%3D%273%27%20fill%3D%27%232a1257%27%2F%3E%3Cpath%20d%3D%27M9%201h3l-3%205h3l-6%209%202-7H5z%27%20fill%3D%27%23ffcf3a%27%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="두 사람이 실제로 부딪친 싸움을 토마스-킬만 갈등 대처 유형으로 읽어, 도트 격투게임 한 판으로 재생하는 메이커">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="../assets/y2k.css">
<style>
/* 콘셉트: 네온 밤거리 스테이지의 도트 대전 격투게임. 선수 선택(VS) → 라운드 → K.O./판정 → 결과 화면.
   320×180 저해상도 캔버스를 키워 도트를 살린다.
   그림: Martial Hero 1·2(LuizMelo), Action Hero(Printer Not Found), Warped City(ansimuz) — 모두 CC0. 선수 색으로 팔레트 스왑. */
:root {
  --bg: #121226; --panel: #1c1b3a; --edge: #3b3870; --gold: #ffcf3a; --hp: #ffcf3a; --hurt: #e8364f;
  --cyan: #4fe3ff; --txt: #f2f0ff; --dim: #c3bfee; --ink: #f2f0ff; --muted: #c3bfee; --accent: #ffcf3a;
  --px: "Galmuri11", "Galmuri9", "Pretendard Variable", monospace;
  --pxb: "Galmuri11 Bold", "Galmuri11", "Pretendard Variable", monospace;
  --arc: "Press Start 2P", "Galmuri11", monospace;
}
body { background: var(--bg); color: var(--txt); }
.stage { background: radial-gradient(ellipse 80% 50% at 50% 0%, #2a2160, transparent 70%), var(--bg); }
.poster { width: min(1040px, 100%); display: flex; flex-direction: column; gap: 26px; }
.pxbox { position: relative; background: var(--panel); box-shadow: 0 -4px 0 0 #0a0a18, 0 4px 0 0 #0a0a18, -4px 0 0 0 #0a0a18, 4px 0 0 0 #0a0a18, inset 0 0 0 3px var(--edge); }

.cab { display: flex; flex-direction: column; }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; box-shadow: 0 0 0 4px #0a0a18, 0 0 0 8px #2a2856, 0 30px 60px -20px rgba(0,0,0,.8); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px); z-index: 4; }

.hud { position: absolute; z-index: 5; left: 2.5%; right: 2.5%; top: 3.5%; display: grid; grid-template-columns: 1fr auto 1fr; gap: 2%; align-items: start; }
.pl { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; }
.pl.r { grid-template-columns: 1fr auto; }
.pl.r .face { order: 2; }
.face { width: clamp(48px, 10vw, 92px); aspect-ratio: 1; background: #0a0a18; box-shadow: 0 0 0 2px var(--c), 0 0 0 4px #0a0a18; overflow: hidden; }
.face img { width: 100%; height: 100%; display: block; image-rendering: pixelated; object-fit: cover; }
.face img.spr { object-fit: contain; }
.pl.r .face img.spr { transform: scaleX(-1); }
.pl .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.pl.r .info { align-items: flex-end; }
.bar-hp { position: relative; width: 100%; height: clamp(9px, 1.7vw, 16px); background: #2b0c18; box-shadow: 0 0 0 2px #0a0a18; }
.bar-hp b, .bar-hp i { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; }
.bar-hp b { background: var(--hurt); transition: width .9s steps(12) .45s; }
.bar-hp i { background: linear-gradient(180deg, #fff3a8 0 25%, var(--hp) 25% 70%, #e09a12 70%); transition: width .35s steps(8); }
.pl.r .bar-hp b, .pl.r .bar-hp i { left: auto; right: 0; }
.pl .nm { font-family: var(--pxb); font-size: clamp(13px, 1.9vw, 18px); color: #fff; text-shadow: 2px 2px 0 #0a0a18; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pl .ty { font-family: var(--px); font-size: clamp(11px, 1.15vw, 13px); color: #fff; background: color-mix(in srgb, var(--c) 55%, #0a0a18); padding: 1px 6px; align-self: flex-start; box-shadow: 0 0 0 2px #0a0a18; }
.pl.r .ty { align-self: flex-end; }
.mid { text-align: center; font-family: var(--arc); color: var(--gold); text-shadow: 2px 2px 0 #0a0a18; font-size: clamp(10px, 2vw, 20px); line-height: 1.2; padding-top: 2px; }
.mid small { display: block; margin: 6px auto 0; font-family: var(--pxb); font-size: clamp(11px, 1.3vw, 14px); color: #fff; background: rgba(10,10,24,.82); padding: 2px 6px; max-width: 22ch; }
.pips { display: flex; gap: 4px; justify-content: center; margin-top: 6px; }
.pips i { width: 8px; height: 8px; background: #0a0a18; box-shadow: 0 0 0 1px var(--dim); }
.pips i.on { background: var(--gold); }

#layer { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.call { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-family: var(--arc); font-size: clamp(18px, 5vw, 52px); color: var(--gold); text-shadow: 4px 4px 0 #0a0a18, -2px -2px 0 #7a1c3a; animation: callin .45s cubic-bezier(.2,.9,.3,1) both; }
.call small { display: block; margin-top: 12px; font-family: var(--pxb); font-size: clamp(11px, 2vw, 20px); color: #fff; text-shadow: 2px 2px 0 #0a0a18; }
.call.out { animation: callout .35s ease-in both; }
@keyframes callin { from { opacity: 0; transform: translateX(-12%); } }
@keyframes callout { to { opacity: 0; transform: translateX(12%); } }
.dim { position: absolute; inset: 0; background: rgba(8,6,24,.55); animation: fadein .3s ease both; }
@keyframes fadein { from { opacity: 0; } }
.cut { position: absolute; left: 0; right: 0; top: 30%; height: 34%; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4%; padding: 0 8%; background: linear-gradient(90deg, transparent, var(--c) 12%, var(--c) 88%, transparent); box-shadow: 0 -3px 0 #0a0a18, 0 3px 0 #0a0a18; animation: cutin .5s cubic-bezier(.2,.9,.3,1) both; }
.cut.r { grid-template-columns: 1fr auto; text-align: right; animation-name: cutinr; }
.cut.r .cf { order: 2; }
.cut .cf { height: 86%; aspect-ratio: 1; background: #0a0a18; box-shadow: 0 0 0 3px #0a0a18; overflow: hidden; }
.cut .cf img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: cover; display: block; }
.cut .cf img.spr { object-fit: contain; }
.cut b { display: block; font-family: var(--pxb); font-size: clamp(16px, 3.6vw, 38px); color: #fff; text-shadow: 3px 3px 0 #0a0a18; }
.cut small { display: block; margin-top: 6px; font-family: var(--px); font-size: clamp(9px, 1.5vw, 14px); color: #0a0a18; }
@keyframes cutin { from { opacity: 0; transform: translateX(-30%); } }
@keyframes cutinr { from { opacity: 0; transform: translateX(30%); } }
.pop { position: absolute; font-family: var(--arc); font-size: clamp(10px, 2vw, 18px); color: #fff; text-shadow: 2px 2px 0 #0a0a18; transform: translateX(-50%); animation: pop 1.1s ease-out both; white-space: nowrap; }
.pop.dmg { color: var(--gold); }
.pop.heal { color: #7dffb0; }
.pop.miss { font-family: var(--pxb); color: var(--cyan); }
@keyframes pop { 0% { opacity: 0; translate: 0 6px; } 15% { opacity: 1; translate: 0 0; } 75% { opacity: 1; } 100% { opacity: 0; translate: 0 -18px; } }

.vs { position: absolute; inset: 0; z-index: 8; display: grid; grid-template-columns: 1fr auto 1fr; background: #0d0b22; }
.vs::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 8px, transparent 8px 16px); }
.side { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 5% 5% 7%; overflow: hidden; }
.side::before { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, color-mix(in srgb, var(--c) 55%, #0d0b22), transparent 75%); }
.side > * { position: relative; }
.side.r { text-align: right; align-items: flex-end; }
.side .art { position: absolute; left: 50%; top: 6%; width: 58%; aspect-ratio: 1; transform: translateX(-50%); }
.side .art img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; display: block; }
.side.r .art img.spr { transform: scaleX(-1); }
.side .tagp { font-family: var(--arc); font-size: clamp(10px, 1.2vw, 12px); color: #fff; text-shadow: 1px 1px 0 #0a0a18; }
.side h2 { margin: 0; font-family: var(--pxb); font-size: clamp(18px, 3.6vw, 36px); line-height: 1.1; text-shadow: 3px 3px 0 #0a0a18; }
.side .ty { font-family: var(--pxb); font-size: clamp(12px, 1.5vw, 15px); background: var(--c); color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,.45); padding: 4px 9px; align-self: flex-start; }
.side.r .ty { align-self: flex-end; }
.side .st { display: grid; grid-template-columns: 4.5em 1fr 2em; gap: 6px; align-items: center; width: min(240px, 100%); font-family: var(--pxb); font-size: clamp(12px, 1.3vw, 14px); text-shadow: 1px 1px 0 #0a0a18; }
.side.r .st { grid-template-columns: 2em 1fr 4.5em; }
.side .st i { height: 8px; background: #0a0a18; position: relative; }
.side .st i::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: var(--w); background: var(--c); }
.side.r .st i::after { left: auto; right: 0; }
.vmid { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 1.5%; }
.vmid > b { font-family: var(--arc); font-size: clamp(22px, 5vw, 54px); color: var(--gold); text-shadow: 4px 4px 0 #7a1c3a; }
.tki { position: relative; width: clamp(80px, 12vw, 120px); aspect-ratio: 1; background: #0a0a18; box-shadow: 0 0 0 2px var(--edge); }
.tki::before { content: ""; position: absolute; inset: 0; background: linear-gradient(var(--edge) 0 0) 50% 0 / 1px 100% no-repeat, linear-gradient(var(--edge) 0 0) 0 50% / 100% 1px no-repeat; }
.tki i { position: absolute; width: 10px; height: 10px; background: var(--c); box-shadow: 0 0 0 2px #0a0a18; transform: translate(-50%, 50%); }
.tki span { position: absolute; font-family: var(--px); font-size: 11px; color: #e4e1ff; }
.tki-cap { font-family: var(--px); font-size: 11px; color: #e4e1ff; text-align: center; }
.start { border: 0; cursor: pointer; padding: 10px 16px; font-family: var(--arc); font-size: clamp(10px, 1.4vw, 13px); color: #0a0a18; background: var(--gold); box-shadow: 0 4px 0 #b07d00, 0 0 0 3px #0a0a18; transition: transform .12s; }
.start:hover { transform: translateY(-2px); }
.start:active { transform: translateY(2px); }
.stage-tag { position: absolute; left: 0; right: 0; bottom: 3%; text-align: center; font-family: var(--px); font-size: clamp(11px, 1.3vw, 13px); color: #e4e1ff; text-shadow: 1px 1px 0 #0a0a18; }

.talk { margin-top: 14px; min-height: 92px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; padding: 14px 18px; }
.talk .who { font-family: var(--pxb); font-size: 13px; color: #0a0a18; background: var(--c, var(--dim)); padding: 4px 10px; white-space: nowrap; display: inline-block; }
.talk .kd { display: block; margin-top: 6px; font-family: var(--px); font-size: 13px; color: #e4e1ff; text-align: center; }
.talk .tx { font-family: var(--px); font-size: clamp(16px, 1.9vw, 19px); line-height: 1.7; color: #fff; word-break: keep-all; min-height: 2.6em; }
.talk.idle .tx { color: #e4e1ff; }
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: 12px; }
.ctrl .grp { display: flex; gap: 8px; flex-wrap: wrap; }
.kbtn { position: relative; border: 0; cursor: pointer; min-height: 38px; padding: 8px 14px; font-family: var(--pxb); font-size: 12px; color: var(--txt); background: var(--panel); box-shadow: inset 0 0 0 2px var(--edge); display: inline-flex; align-items: center; }
.kbtn[aria-pressed="true"] { background: var(--gold); color: #0a0a18; box-shadow: inset 0 0 0 2px #0a0a18; }
.kbtn:hover { box-shadow: inset 0 0 0 2px var(--gold); }
.upl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-family: var(--px); font-size: 13px; color: var(--dim); }
.upl label { overflow: hidden; }
.upl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.card { position: relative; background: #141330; color: var(--txt); padding: 28px 30px 22px; box-shadow: 0 0 0 4px #0a0a18, 0 0 0 8px #2a2856; font-family: var(--px); }
.card.capturing { box-shadow: none; outline: 4px solid #2a2856; outline-offset: -4px; }
.card .ttl-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--arc); font-size: 11px; color: var(--dim); }
.card .ttl-bar b { color: var(--gold); font-weight: 400; }
.vsrow { margin-top: 18px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; }
.who-c { display: grid; grid-template-columns: 104px 1fr; gap: 14px; align-items: center; }
.who-c.r { grid-template-columns: 1fr 104px; text-align: right; }
.who-c.r .face { order: 2; }
.who-c .face { width: 104px; box-shadow: 0 0 0 3px var(--c), 0 0 0 6px #0a0a18; }
.who-c.r .face img.spr { transform: scaleX(-1); }
.who-c small { font-family: var(--arc); font-size: 10px; color: #fff; }
.who-c b { display: block; margin: 6px 0 4px; font-family: var(--pxb); font-size: clamp(17px, 2.6vw, 24px); }
.who-c span { font-size: 14px; color: #e4e1ff; }
.who-c em { font-style: normal; color: #fff; background: color-mix(in srgb, var(--c) 60%, #0a0a18); padding: 0 5px; }
.vsrow > .v { font-family: var(--arc); font-size: 18px; color: var(--gold); }
.card h2 { margin: 22px 0 6px; font-family: var(--pxb); font-size: clamp(19px, 3vw, 28px); text-wrap: balance; }
.card .trg { margin: 0; font-size: 16px; color: #ecebff; line-height: 1.75; }
.card .stg { margin-top: 4px; font-size: 13px; color: var(--dim); }
.rounds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.rd { padding: 12px 14px; background: #1c1b3a; box-shadow: inset 0 0 0 2px var(--edge); min-width: 0; }
.rd h4 { margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; font-family: var(--pxb); font-size: 16px; }
.rd h4 small { font-family: var(--arc); font-size: 10px; color: var(--gold); padding-top: 3px; }
.rd ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.rd li { display: grid; grid-template-columns: 8px 1fr; gap: 8px; font-size: 14.5px; line-height: 1.65; color: #fff; }
.rd li i { width: 8px; height: 8px; margin-top: 5px; background: var(--c); }
.rd li em { font-style: normal; font-size: 12px; color: #fff; background: color-mix(in srgb, var(--c) 60%, #0a0a18); padding: 0 5px; margin-right: 6px; }
.verdict { margin-top: 20px; display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; padding: 18px 20px; background: #0d0c24; box-shadow: inset 0 0 0 2px var(--edge); }
.verdict .tag { font-family: var(--arc); font-size: clamp(20px, 4vw, 34px); color: var(--gold); text-shadow: 3px 3px 0 #7a1c3a; white-space: nowrap; }
.verdict h3 { margin: 0 0 6px; font-family: var(--pxb); font-size: 17px; }
.verdict p { margin: 0; font-size: 16px; line-height: 1.75; color: #fff; }
.verdict .real { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--edge); font-size: 15px; color: #ecebff; line-height: 1.7; }
.verdict .real b { font-family: var(--pxb); color: var(--cyan); margin-right: 6px; }
.verdict .nums { margin-top: 8px; font-size: 13px; color: var(--dim); }
.card .foot { margin-top: 16px; display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: #b3afe0; line-height: 1.6; }

@media (max-width: 700px) {
  .screen { aspect-ratio: 4 / 3; }
  .mid small { display: none; }
  .vs { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; }
  .vmid { grid-column: 1 / -1; grid-row: 2; flex-direction: row; padding: 8px; gap: 10px; }
  .tki, .tki-cap, .stage-tag { display: none; }
  .vmid > b { font-size: 20px; }
  .side { padding: 4%; }
  .side .art { width: 80%; top: 4%; }
  .side .st { display: none; }
  .talk { grid-template-columns: 1fr; gap: 8px; padding: 12px 14px; }
  .talk .kd { display: inline; margin-left: 6px; }
  .card { padding: 20px 16px; }
  .vsrow { grid-template-columns: 1fr; }
  .vsrow > .v { text-align: center; }
  .who-c.r { grid-template-columns: 104px 1fr; text-align: left; }
  .who-c.r .face { order: 0; }
  .rounds { grid-template-columns: 1fr; }
  .verdict { grid-template-columns: 1fr; gap: 10px; }
  .card .foot { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { .call, .cut, .pop, .dim { animation: none !important; } }

/* Y2K 오락실: 보랏빛 그라데이션 판 · 크롬 테두리 화면 · 네온 글자 그림자 */
.pxbox { background: linear-gradient(170deg, #2a2266 0%, #1a1845 55%, #241443 100%); }
.screen { box-shadow: 0 0 0 3px #0a0a18, 0 0 0 7px #c9cbe0, 0 0 0 8px #6c6f8e, 0 0 0 11px #0a0a18, 0 0 40px rgba(124,92,255,.45), 0 30px 60px -20px rgba(0,0,0,.8); }
.rd { background: linear-gradient(160deg, #2a2266, #17163d); box-shadow: inset 0 0 0 2px var(--edge), 0 0 0 1px #000, 0 0 14px rgba(79,227,255,.12); }
.poster h2, .poster h3 { text-shadow: 2px 2px 0 #6c4bff, 3px 3px 0 #0a0a18; }

/* 바깥: 오락실 — 보랏빛 신스웨이브 바닥 그리드 · 별 · 네온 메뉴 줄 · 오락기 조작판 버튼 줄 */
body[data-mode="view"] { background: linear-gradient(transparent 62%, rgba(255,79,216,.0) 62%), repeating-linear-gradient(90deg, rgba(255,90,220,.18) 0 1px, transparent 1px 60px) 0 100% / 100% 38% no-repeat, repeating-linear-gradient(180deg, rgba(255,90,220,.18) 0 1px, transparent 1px 30px) 0 100% / 100% 38% no-repeat, radial-gradient(circle, rgba(255,255,255,.55) 1px, transparent 1.4px) 0 0 / 70px 70px, linear-gradient(180deg, #0b0820 0%, #1c0f3d 55%, #3a1257 100%) fixed; }
body[data-mode] header.bar { background: linear-gradient(180deg, #1a1040, #0b0820); border-bottom: 2px solid #ff4fd8; box-shadow: 0 0 14px rgba(255,79,216,.5); color: #fff; }
body[data-mode] .brand, body[data-mode] .bar-title { color: #fff; }
body[data-mode] .brand::before { background: #ffcf3a; box-shadow: none; }
body[data-mode] .tabs button { color: #c3bfee; }
body[data-mode] .tabs button[aria-selected="true"] { background: #ffcf3a; color: #1a1040; }
body[data-mode] .actions { background: #0b0820; border: 2px solid #4fe3ff; box-shadow: 0 0 16px rgba(79,227,255,.45), 4px 4px 0 #000; }
body[data-mode] .actions .btn { background: #1c1b3a; color: #fff; border-color: #4fe3ff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.4); }
body[data-mode] .actions .btn.primary { background: #ffcf3a; color: #1a1040; border-color: #ffcf3a; }
body[data-mode] .shared-note { background: #0b0820; color: #f2f0ff; border: 2px solid #ff4fd8; box-shadow: 0 0 12px rgba(255,79,216,.4); }
.fart, .fight-x { }
body[data-mode] .stage .btn:not(.actions .btn) { background: #1c1b3a; color: #f2f0ff; border: 1px solid #4fe3ff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.4); }
body[data-mode] .stage .btn[aria-pressed="true"] { background: #ffcf3a; color: #1a1040; border-color: #ffcf3a; }

function simulate(S) {

    if (m.kind === 'attack' || m.kind === 'special') {

      if (dodge[op]) { dmg = 0; res = 'miss'; } else if (guard[op]) { dmg = Math.round(dmg / 2); res = 'guard'; }
      hp[op] = Math.max(0, hp[op] - dmg); guard[op] = dodge[op] = false; if (hp[op] <= 0) ko = op;
    } else if (m.kind === 'guard') guard[me] = true;

    else if (m.kind === 'heal') { heal = Math.round(m.power * .6); hp.a = Math.min(100, hp.a + heal); hp.b = Math.min(100, hp.b + heal); }
    log.push({ ri, m, me, op, dmg, heal, res, hp: { ...hp } });
  }));
  const heals = { a: log.filter(x => x.m.kind === 'heal' && x.me === 'a').length, b: log.filter(x => x.m.kind === 'heal' && x.me === 'b').length };

  else if (Math.abs(hp.a - hp.b) <= 8 || (heals.a && heals.b)) result = { type: 'draw' };
  else result = { type: 'decision', win: hp.a > hp.b ? 'a' : 'b' };
  return { log, hp, result, heals };
}

      if (!(await wait(450, tok))) return;
      if (x.hp[x.op] <= 0) { await play(op, 'ko', 6); play(op, 'down', 1, true); }
      else { tween(me, me.home, 420, 'back', 12).then(() => play(me, 'idle', 8, true)); if (op.anim !== 'guard') tween(op, op.home, 420, 'run', 12).then(() => play(op, 'idle', 8, true)); }
    } else if (x.m.kind === 'guard') { play(me, 'guard', 1, true); pop(me, '버티기', 'miss'); }
    else if (x.m.kind === 'dodge') { await tween(me, me.home - me.face * 26, 300, 'back', 12); play(me, 'idle', 8, true); pop(me, '피함', 'miss'); }
    else if (x.m.kind === 'heal') {
      const mid = (A.home + B.home) / 2;
      await Promise.all([tween(A, mid - 34, 600, 'run', 10), tween(B, mid + 34, 600, 'run', 10)]); if (tok !== G.tok) return;
      [A, B].forEach(F => { play(F, 'idle', 8, true); pop(F, `+${x.heal}`, 'heal'); }); setHP(x.hp);
    }
    await talking;
    if (!(await wait(1500, tok))) return;
  }
  const r = sim.result; const w = r.win ? S[r.win] : null;
  if (!(await wait(400, tok))) return;
  if (!(await call(r.type === 'ko' ? 'K.O.' : r.type === 'draw' ? 'TIME' : 'JUDGE', 1300, tok))) return;
  if (w) { const WF = G.F[r.win]; tween(WF, WF.home, 400, 'run').then(() => play(WF, 'idle', 8, true)); }
  if (!(await call(w ? `${esc(w.name)} WIN<small>${r.type === 'ko' ? '케이오승' : '판정승'}</small>` : 'DRAW GAME<small>무승부</small>', 1800, tok))) return;
  const end = r.type === 'draw' ? S.endings.draw : S.endings[r.win];
  if (w && w.win) { await say(w, '승리 대사', w.win); if (end && (await wait(1600, tok))) say(null, '', end); }
  else if (end) say(null, '', end);
}

async function setup(S) {
  G.F = { a: mkF('a', S.a), b: mkF('b', S.b) };
  try { for (const s of BG) IMG_[s] = await loadImg(s); await prepF(G.F.a); await prepF(G.F.b); G.ready = true; } catch (e) { console.error(e); }
  if (!G.raf) G.raf = requestAnimationFrame(step);
  fillThumbs(S);
}
let APP = null;
function render(S, o) {
  G.tok++; G.S = S; G.sim = simulate(S); G.ready = false; G.tw = [];
  $('#poster').innerHTML = `
  <section class="cab">
    <div class="screen" id="screen"><canvas id="cv" width="${W}" height="${H}"></canvas><div class="scan"></div>${hudHTML(S)}<div id="layer"></div>${vsHTML(S)}</div>
    <div class="talk pxbox idle" id="talk"><span></span><div class="tx">${esc(S.trigger || '곧 두 사람의 싸움이 시작돼요.')}</div></div>
    <div class="ctrl">
      <div class="grp"><button class="kbtn" id="again">선수 선택으로</button><button class="kbtn" data-s="1">보통</button><button class="kbtn" data-s="2">빠르게</button></div>
      <div class="upl"><span>캐릭터 이미지 → 도트 초상화</span>
        <label class="kbtn">1P 올리기<input type="file" accept="image/*" data-up="a"></label><label class="kbtn">2P 올리기<input type="file" accept="image/*" data-up="b"></label>
        ${S.a.pic || S.b.pic ? '<button class="kbtn" id="unpic">초상화 지우기</button>' : ''}</div>
    </div>
  </section>
  ${cardHTML(S, G.sim)}`;
  setHP({ a: 100, b: 100 });
  $('#go').onclick = () => { clearTimeout(G.auto); fight(); };
  /* 처음 열면 누르지 않아도 한 판이 바로 재생된다 */
  clearTimeout(G.auto);
  if (!G.autoDone || (o && o.animate)) { G.autoDone = true; G.auto = setTimeout(() => { if (document.getElementById('go')) fight(); }, 2400); }
  $('#again').onclick = () => render(S);
  document.querySelectorAll('.ctrl [data-s]').forEach(b => { b.setAttribute('aria-pressed', String(Number(b.dataset.s) === G.speed)); b.onclick = () => { G.speed = Number(b.dataset.s); document.querySelectorAll('.ctrl [data-s]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }; });
  document.querySelectorAll('[data-up]').forEach(inp => inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try { const u = await pixelate(f); const st = APP ? APP.state : S; st[inp.dataset.up].pic = u; Core.store.set(KEY, st); render(st); Core.toast('도트 초상화로 바꿨어요'); } catch (e) { Core.toast('이미지를 읽지 못했어요'); }
  });
  const un = $('#unpic'); if (un) un.onclick = () => { const st = APP ? APP.state : S; st.a.pic = ''; st.b.pic = ''; Core.store.set(KEY, st); render(st); };
  setup(S);
}

APP = Core.app({
  key: KEY, what: '대전 기록', sample, blank, normalize, schema, prompts, apply, progress, render, posterSel: '#card',
  fileName: S => `대전_${S.a.name}_${S.b.name}`,
});
})();
</script>
