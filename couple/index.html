<style>
/* 콘셉트: 커플 앱(가상 앱 '우리 사이'). 복숭아빛 분홍 · 둥근 흰 카드 · 두 사람 프로필이 하트로 이어진 디데이 · 아래 탭 */
:root { --bg: #fff5f7; --pk: #ff6f91; --pk2: #ffb3c5; --pkbg: #ffe4ec; --ink: #3a2a33; --sub: #9a8790; --card: #fff; --line: #f3dde4; --mint: #4cc9a7; }
body[data-mode="view"] { background: linear-gradient(180deg, #fde8ee, #f4eefb) fixed; }
.tabs2 { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 12px; }
.tabs2 button { all: unset; cursor: pointer; padding: 7px 14px; border-radius: 999px; background: #fff; border: 1px solid #f0d6de; font: 700 13px "Pretendard Variable", sans-serif; color: #7a5e69; }
.tabs2 button[aria-pressed="true"] { background: var(--pk); color: #fff; border-color: var(--pk); }
.tabs2 button:focus-visible { outline: 2px solid #2f6bff; outline-offset: 2px; }
.wrapv { width: 100%; display: flex; flex-direction: column; align-items: center; }
.poster { width: 400px; max-width: 100%; padding: 11px; background: #1b1b1d; border-radius: 56px; box-shadow: inset 0 0 0 2px #3a3a3c, 0 30px 60px -24px rgba(120,40,70,.45); font-family: "Pretendard Variable", Pretendard, sans-serif; color: var(--ink); }
.scr { position: relative; min-height: 780px; border-radius: 46px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
.sb { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-weight: 600; font-size: 15.5px; position: relative; }
.sb .isl { position: absolute; left: 50%; top: 11px; width: 120px; height: 34px; margin-left: -60px; background: #000; border-radius: 20px; }
.sic { display: flex; gap: 6px; align-items: center; } .sic svg { height: 12px; width: auto; fill: currentColor; }
.top { display: flex; align-items: center; justify-content: space-between; padding: 4px 20px 8px; }
.top b { font-size: 19px; font-weight: 800; color: var(--pk); letter-spacing: -.02em; }
.top span { font-size: 12px; color: var(--sub); }
.body { flex: 1; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border-radius: 22px; padding: 16px; box-shadow: 0 6px 18px -10px rgba(200,80,120,.35); }
.card h3 { margin: 0 0 10px; font-size: 13px; font-weight: 800; color: var(--sub); display: flex; justify-content: space-between; align-items: center; }
.card h3 em { font-style: normal; color: var(--pk); }
.in { animation: fadeUp .45s ease-out both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* 홈 */
.hero { text-align: center; padding: 22px 16px 18px; background: linear-gradient(170deg, #ffd3df, #ffeef3 60%, #fff); }
.pair { display: flex; align-items: center; justify-content: center; gap: 14px; }
.pf { width: 78px; height: 78px; border-radius: 50%; background: #fff; border: 3px solid #fff; box-shadow: 0 6px 14px -6px rgba(200,80,120,.5); overflow: hidden; display: grid; place-items: center; color: var(--pk); font-weight: 800; font-size: 26px; }
.pf img { width: 100%; height: 100%; object-fit: cover; }
.who { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; } .who b { font-size: 13.5px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair { align-items: flex-start; } .pair .heart { margin-top: 24px; }
.heart { width: 30px; height: 30px; color: var(--pk); animation: beat 1.6s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } }
.capturing .who { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; } .who b { font-size: 13.5px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pair { align-items: flex-start; } .pair .heart { margin-top: 24px; }
.heart { animation: none; }
.names { display: flex; justify-content: center; gap: 70px; margin-top: 8px; font-size: 13.5px; font-weight: 700; }
.dday { margin-top: 12px; font-size: 44px; font-weight: 900; letter-spacing: -.03em; color: var(--pk); line-height: 1; }
.since { margin-top: 6px; font-size: 12.5px; color: var(--sub); }

.moods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mood { display: flex; align-items: center; gap: 10px; background: var(--pkbg); border-radius: 16px; padding: 10px 12px; }
.mood b { font-size: 26px; line-height: 1; }
.mood span { font-size: 12px; line-height: 1.35; } .mood small { display: block; color: var(--sub); font-size: 11px; font-weight: 700; }
.say { font-size: 15px; line-height: 1.55; font-weight: 600; }
.say small { display: block; margin-top: 8px; font-size: 11.5px; color: var(--sub); font-weight: 500; }
.story { font-size: 13.5px; line-height: 1.65; color: #5a4650; }
/* 질문 */
.q { display: flex; flex-direction: column; gap: 8px; }
.q .qt { font-size: 15px; font-weight: 800; line-height: 1.4; }
.q .qt small { display: block; font-size: 11.5px; color: var(--pk); font-weight: 800; margin-bottom: 3px; }
.ans { display: flex; gap: 8px; align-items: flex-start; }
.ans .mini { width: 28px; height: 28px; border-radius: 50%; background: var(--pkbg); color: var(--pk); display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; overflow: hidden; }
.ans .mini img { width: 100%; height: 100%; object-fit: cover; }
.ans p { margin: 0; flex: 1; padding: 9px 12px; background: #fbf5f7; border-radius: 4px 14px 14px 14px; font-size: 13.5px; line-height: 1.5; }
.ans.pc p { background: var(--pkbg); }
.ans.lock p { background: repeating-linear-gradient(0deg, #f6eef1, #f6eef1); color: var(--sub); display: flex; align-items: center; gap: 6px; font-size: 12.5px; }
/* 위치 */
.map { position: relative; height: 300px; border-radius: 20px; overflow: hidden; background: #eef3ea; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pinp { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; }
.pinp .pf { width: 46px; height: 46px; font-size: 16px; border-width: 3px; }
.pinp i { width: 0; height: 0; border: 7px solid transparent; border-top-color: #fff; margin-top: -2px; }
.pinp small { margin-top: 2px; padding: 2px 8px; border-radius: 999px; background: #fff; font-size: 11px; font-weight: 700; box-shadow: 0 2px 6px rgba(0,0,0,.12); white-space: nowrap; }
.dist { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: var(--pk); color: #fff; font-size: 13px; font-weight: 800; box-shadow: 0 6px 12px -6px rgba(200,80,120,.7); }
.lrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.lrow:first-child { border-top: 0; }
.lrow .mini { width: 32px; height: 32px; border-radius: 50%; background: var(--pkbg); color: var(--pk); display: grid; place-items: center; font-weight: 800; font-size: 12px; overflow: hidden; flex: none; }
.lrow .mini img { width: 100%; height: 100%; object-fit: cover; }
.lrow div { flex: 1; } .lrow small { display: block; color: var(--sub); font-size: 11.5px; }
.share { display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; font-weight: 700; }
.tg { width: 46px; height: 28px; border-radius: 999px; background: var(--mint); position: relative; }
.tg::after { content: ""; position: absolute; right: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; }
.tg.off { background: #d8d0d4; } .tg.off::after { right: auto; left: 3px; }
/* 기념일 */
.an { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.an:first-child { border-top: 0; }
.an .dd { min-width: 66px; text-align: center; padding: 6px 8px; border-radius: 12px; background: var(--pkbg); color: var(--pk); font-weight: 900; font-size: 14px; }
.an .dd.past { background: #f1edef; color: var(--sub); }
.an b { display: block; font-size: 14.5px; } .an small { color: var(--sub); font-size: 12px; }
.bk { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; }
.bk i { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--pk2); flex: none; display: grid; place-items: center; color: #fff; font-style: normal; font-size: 12px; font-weight: 900; }
.bk.done i { background: var(--pk); border-color: var(--pk); } .bk.done span { text-decoration: line-through; color: var(--sub); }
/* 앨범 */
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ph { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: linear-gradient(160deg, #ffd6e0, #e8dcff); display: flex; align-items: flex-end; padding: 6px; color: #fff; font-size: 10.5px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.35); position: relative; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph span { position: relative; z-index: 1; }
.ph::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, rgba(60,20,40,.55)); }
.ph.add { background: #fff; border: 2px dashed var(--pk2); color: var(--pk); text-shadow: none; justify-content: center; align-items: center; font-size: 22px; }
.ph.add::after { display: none; }
/* 아래 탭 */
.tb { display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 6px 6px; background: #fff; border-top: 1px solid var(--line); }
.tb span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: #bba9b1; }
.tb span.on { color: var(--pk); }
.tb svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.hb { height: 24px; display: grid; place-items: center; background: #fff; } .hb i { width: 134px; height: 5px; border-radius: 3px; background: #222; }
@media (max-width: 440px) { .poster { padding: 8px; border-radius: 46px; } .scr { border-radius: 38px; } .names { gap: 50px; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

<script>
(() => {
const { esc, clamp, num, $ } = Core;
const TABS = { home: '홈', q: '질문', loc: '위치', anniv: '기념일', album: '앨범' };
const N = { q: 6, an: 5, al: 6, bk: 5 };
const eQ = () => ({ q: '', a: '', b: '', date: '' }), eAn = () => ({ title: '', date: '' }), eAl = () => ({ cap: '', date: '' }), eBk = () => ({ text: '', done: false });
const P = (o) => ({ name: '', nick: '', mood: '🙂', moodText: '', place: '', when: '', ...o });
const blank = () => ({ v: 1, tab: 'home', rel: '', since: '', start: '', why: '', say: '', sayFrom: 'a', a: P({ name: 'NPC' }), b: P({ name: 'PC' }), dist: '', share: true, qs: Array.from({ length: N.q }, eQ), anniv: Array.from({ length: N.an }, eAn), album: Array.from({ length: N.al }, eAl), bucket: Array.from({ length: N.bk }, eBk) });
const sample = () => normalize({
  tab: 'home', rel: '약혼 발표 전 비밀 연애', since: '2026.03.14', start: '2026.10.31', sayFrom: 'a',
  why: '비 오는 정원에서 망토를 같이 쓴 다음 날, 공녀가 먼저 설치해서 초대 코드를 보냈다. 황태자는 사흘 동안 수락을 누르지 않았다.',
  say: '내일 연회, 늦지 마십시오. 첫 춤은 비워 두겠습니다.',
  a: P({ name: 'NPC', nick: '전하', mood: '😶', moodText: '서류가 많음', place: '황궁 집무실', when: '방금' }),
  b: P({ name: 'PC', nick: '공녀님', mood: '🥰', moodText: '내일 연회 기대', place: '공작가 저택', when: '12분 전' }),
  dist: '3.4km', share: true,
  qs: [
    { q: '상대에게 처음 반한 순간은?', a: '무도회에서 발을 밟고도 웃던 순간.', b: '', date: '11.21' },
    { q: '요즘 상대에게 가장 고마운 것은?', a: '먼저 말을 걸어 주는 것. 나는 그걸 못 하니까.', b: '서고에 매번 같은 시간에 와 주는 거요.', date: '11.18' },
    { q: '둘만 아는 장소가 있다면?', a: '정원 끝 회랑.', b: '황궁 서고 창가 자리!', date: '11.12' },
  ],
  anniv: [{ title: '처음 만난 날', date: '2026.03.14' }, { title: '커플 앱 시작', date: '2026.10.31' }, { title: '신년 연회', date: '2026.12.31' }, { title: '만난 지 300일', date: '' }],
  album: [{ cap: '서고 창가', date: '04.02' }, { cap: '비 오는 정원', date: '10.30' }, { cap: '군밤 반 봉지', date: '11.15' }, { cap: '첫 춤', date: '03.14' }],
  bucket: [{ text: '신분 숨기고 수도 구경', done: true }, { text: '같이 극장 가기', done: true }, { text: '연회에서 첫 춤과 마지막 춤', done: false }, { text: '서로 편지 한 통씩', done: false }],
});
const arr = (src, n, mk) => Array.from({ length: n }, (_, i) => ({ ...mk(), ...((Array.isArray(src) ? src : [])[i] || {}) }));
function normalize(s) {
  const b = blank(); s = s && typeof s === 'object' ? s : {};
  const o = { ...b, ...s, a: P({ ...b.a, ...(s.a || {}) }), b: P({ ...b.b, ...(s.b || {}) }) };
  if (!TABS[o.tab]) o.tab = 'home'; if (!['a', 'b'].includes(o.sayFrom)) o.sayFrom = 'a';
  o.qs = arr(s.qs, N.q, eQ); o.anniv = arr(s.anniv, N.an, eAn); o.album = arr(s.album, N.al, eAl); o.bucket = arr(s.bucket, N.bk, eBk).map(x => ({ ...x, done: x.done === true || x.done === 'true' }));
  o.share = o.share !== false && o.share !== 'false';
  return o;
}
function apply(S, o) {
  const got = []; const g = n => { if (!got.includes(n)) got.push(n); };
  ['rel', 'since', 'start', 'why', 'say', 'sayFrom', 'dist'].forEach(k => { if (o[k]) { S[k] = o[k]; g('관계'); } });
  if (o.share != null) S.share = !!o.share;
  for (const k of ['a', 'b']) if (o[k] && typeof o[k] === 'object') { Object.entries(o[k]).forEach(([kk, v]) => { if (v !== '' && v != null) S[k][kk] = v; }); g('프로필'); }
  const put = (key, n, mk, label) => { if (Array.isArray(o[key])) { S[key] = Array.from({ length: n }, mk); o[key].slice(0, n).forEach((x, i) => { if (x && typeof x === 'object') S[key][i] = { ...mk(), ...x }; }); g(label); } };
  put('qs', N.q, eQ, '커플 질문'); put('anniv', N.an, eAn, '기념일'); put('album', N.al, eAl, '앨범'); put('bucket', N.bk, eBk, '버킷리스트');
  return got;
}
function prompts() {
  const p = `*[OOC: 롤플레잉 잠시 중단. 「우리 사이」 커플 앱 기록.
NPC와 PC가 어느 날부터 같이 쓰기 시작한 커플 앱 화면을 만든다. 실제 관계가 연인이 아니어도 된다(썸, 계약, 비밀 연애, 친구인 척 등 RP 그대로).
▪ rel 둘의 관계 한 줄 14자, since 관계가 시작된 날 “2026.03.14”, start 커플 앱을 시작한 날, why 커플 앱을 어쩌다 쓰게 됐는지 80자(누가 먼저 깔았고 상대는 어땠는지)
▪ a(NPC)·b(PC): nick 앱에 저장한 상대 애칭, mood 오늘 기분 이모지 하나, moodText 기분 한 줄 12자, place 지금 위치 이름 12자, when 위치 갱신 “방금|12분 전”
▪ dist 둘 사이 거리 “3.4km”, share 위치 공유 켜 둠 true|false
▪ say 오늘의 한마디 40자, sayFrom 쓴 사람 a|b(PC면 RP에서 실제로 한 말만)
▪ qs 커플 질문 3~6개(최근 것부터): q 질문(커플 앱 말투), a NPC 답 50자(NPC 말투 그대로), b PC 답(RP에서 실제로 한 말로 답이 되는 경우만, 없으면 “” = 아직 안 답함), date “11.21”
▪ anniv 기념일 3~5개: title, date(모르면 “”) / album 사진 3~6개: cap 무슨 사진 12자, date / bucket 버킷리스트 3~5개: text 20자, done true|false
▪ 근거: 설정과 RP에서 실제 있었던 일만. PC의 말·행동은 RP에 나온 것만 쓰고 지어내지 않는다. 여기서 만든 내용은 이후 RP의 사실로 삼지 않는다.
▪ 출력: 인사·설명 없이 JSON 코드 블록 하나만. 문자열 안 따옴표는 “ ”만. 값은 형식 예시일 뿐.
{"rel":"","since":"","start":"","why":"","a":{"nick":"","mood":"🙂","moodText":"","place":"","when":""},"b":{"nick":"","mood":"🙂","moodText":"","place":"","when":""},"dist":"","share":true,"say":"","sayFrom":"a","qs":[{"q":"","a":"","b":"","date":""}],"anniv":[{"title":"","date":""}],"album":[{"cap":"","date":""}],"bucket":[{"text":"","done":false}]}]*`;
  return [{ label: '우리 사이', sub: '관계 · 질문 · 위치 · 기념일 · 앨범', text: p }];
}

const pd = d => { const m = String(d || '').match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };

};

}
