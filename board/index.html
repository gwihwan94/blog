<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@800&display=swap" rel="stylesheet">

<style>
/* 콘셉트: 형사 사무실 벽의 수사 보드. 코르크색 판(단색·그라데이션만) · 폴라로이드 · 포스트잇 · 색인 카드 · 영수증 · 빨간 실과 압정 · 타자기 글씨 서류철 */
:root { --wall: #23262b; --cork: #b58552; --cork2: #9c6d3f; --red: #c3161c; --ink: #1b1b1b; --paper: #fbf7ec; --note: #ffe27a; --mono: "Nanum Gothic Coding", ui-monospace, monospace; --pen: "Nanum Pen Script", cursive; }
body[data-mode="view"] { background: radial-gradient(900px 500px at 50% 0%, #343840, var(--wall) 70%) fixed, var(--wall); }
body[data-mode="view"] header.bar { background: #1a1c20; color: #e9e6df; border-bottom: 1px solid #000; }
body[data-mode="view"] .brand, body[data-mode="view"] .bar-title { color: #e9e6df; }
body[data-mode="view"] .tabs button { color: #a9a6a0; }
body[data-mode="view"] .tabs button[aria-selected="true"] { background: #e9e6df; color: #111; }
body[data-mode="view"] .pc-note, body[data-mode="view"] .shared-note { background: #2c2f35; color: #d6d3cc; border: 1px solid #44474e; }
.viewer { width: 1040px; max-width: 100%; }
#wrap { width: 100%; display: flex; justify-content: center; }
.poster { width: 1040px; flex: none; position: relative; padding: 22px; background: #2a1d12; border-radius: 10px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.7); font-family: "Pretendard Variable", Pretendard, sans-serif; color: var(--ink); }
.poster.capturing { border-radius: 0; }
#zoomer:has(.capturing) { zoom: 1 !important; }
/* 서류철 머리 */
.file { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; padding: 18px 22px 16px; margin-bottom: 18px; background: linear-gradient(180deg, #e7cf9a, #dcc086); border-radius: 4px 14px 4px 4px; box-shadow: 0 2px 0 #a88a52, 0 10px 18px rgba(0,0,0,.35); font-family: var(--mono); }
.file::before { content: "사건 기록"; position: absolute; top: -22px; left: 0; padding: 4px 16px 6px; background: #e7cf9a; border-radius: 8px 8px 0 0; font-size: 12px; font-weight: 700; color: #5a4520; }
.file .no { font-size: 12px; color: #6d5427; letter-spacing: .06em; }
.file h1 { margin: 4px 0 8px; font: 800 30px/1.15 "Nanum Myeongjo", serif; letter-spacing: -.01em; color: #2b2112; }
.file dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; margin: 0; font-size: 13px; color: #3a2c15; }
.file dt { color: #7b6031; } .file dd { margin: 0; }
.file .conf { text-align: right; }
.file .conf b { display: block; font: 800 42px/1 var(--mono); color: var(--red); }
.file .conf span { font-size: 12px; color: #6d5427; }
.file .bar { width: 160px; height: 8px; margin-top: 6px; background: rgba(0,0,0,.12); border-radius: 4px; overflow: hidden; }
.file .bar i { display: block; height: 100%; background: var(--red); border-radius: 4px; }
/* 코르크 판 */
.cork { position: relative; height: 700px; border-radius: 6px; background: radial-gradient(120% 90% at 50% 40%, #c7955f 0%, var(--cork) 45%, var(--cork2) 100%); box-shadow: inset 0 0 0 10px #6b4a2a, inset 0 0 0 12px #3d2815, inset 0 12px 40px rgba(0,0,0,.35); overflow: hidden; }
.cork svg.strings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.cork svg.labels { z-index: 4; }
.str { fill: none; stroke: var(--red); stroke-width: 2.2; stroke-linecap: round; filter: drop-shadow(0 2px 1px rgba(0,0,0,.35)); stroke-dasharray: 900; animation: evin 1.1s ease-out both; }
@keyframes evin { from { stroke-dashoffset: 900; } to { stroke-dashoffset: 0; } }
.lk { font: 700 11px var(--mono); fill: #fff; }
.lkb { fill: var(--red); }
/* 카드 공통 */
.cl { position: absolute; width: 176px; z-index: 2; perspective: 900px; cursor: pointer; animation: lay .5s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes lay { from { opacity: 0; transform: translateY(-26px) rotate(var(--r)) scale(1.06); } to { opacity: 1; transform: rotate(var(--r)); } }
.cl { transform: rotate(var(--r)); }
.cl .in { position: relative; transition: transform .6s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; }
.cl.flip .in { transform: rotateY(180deg); }
.cl .fr, .cl .bk { backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 8px 14px -6px rgba(0,0,0,.55), 0 1px 0 rgba(0,0,0,.15); }
.cl .bk { position: absolute; inset: 0; transform: rotateY(180deg); background: #1d1f24; color: #f3efe6; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; border-radius: 2px; }
.cl .bk small { font: 700 10.5px var(--mono); color: #ff8e8e; letter-spacing: .08em; }
.cl .bk p { margin: 0; font: 400 21px/1.15 var(--pen); overflow: hidden; }
.cl:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
.pin { position: absolute; top: -8px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a8a 0 2px, #d81e24 3px, #8e0d11 100%); box-shadow: 0 3px 3px rgba(0,0,0,.45); z-index: 4; }
.num { position: absolute; top: 6px; left: 8px; font: 700 10.5px var(--mono); color: rgba(0,0,0,.45); }
.fr { position: relative; }
.fr h4 { margin: 0 0 4px; font-size: 13.5px; font-weight: 800; line-height: 1.3; }
.fr p { margin: 0; font-size: 12px; line-height: 1.5; color: #333; }
.fr time { display: block; margin-top: 6px; font: 400 10.5px var(--mono); color: #7a7466; }
/* 종류별 */
.k-photo .fr { background: #fff; padding: 10px 10px 12px; }
.k-photo .ph { height: 112px; margin-bottom: 9px; background: linear-gradient(160deg, #6f7b86, #3c444d); display: grid; place-items: center; overflow: hidden; color: #dfe4e8; font-size: 11px; text-align: center; padding: 8px; }
.k-photo .ph img { width: 100%; height: 100%; object-fit: cover; }
.k-photo h4 { font: 400 22px/1 var(--pen); }
.k-note .fr { background: var(--note); padding: 18px 13px 14px; }
.k-note h4 { font: 400 24px/1 var(--pen); } .k-note p { font: 400 19px/1.15 var(--pen); color: #3b3311; }
.k-card .fr { background: var(--paper); padding: 22px 13px 12px; background-image: linear-gradient(var(--red), var(--red)); background-size: 100% 2px; background-position: 0 16px; background-repeat: no-repeat; }
.k-receipt .fr { background: #fff; padding: 14px 12px 18px; font-family: var(--mono); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), 94% 100%, 88% calc(100% - 6px), 82% 100%, 76% calc(100% - 6px), 70% 100%, 64% calc(100% - 6px), 58% 100%, 52% calc(100% - 6px), 46% 100%, 40% calc(100% - 6px), 34% 100%, 28% calc(100% - 6px), 22% 100%, 16% calc(100% - 6px), 10% 100%, 4% calc(100% - 6px), 0 100%); }
.k-receipt h4 { font: 700 12.5px var(--mono); text-align: center; border-bottom: 1px dashed #999; padding-bottom: 5px; }
.k-receipt p { font: 400 11.5px/1.5 var(--mono); }
.k-chat .fr { background: #eef1f5; padding: 12px 11px; border-radius: 10px; }
.k-chat h4 { font-size: 11.5px; color: #6b7280; font-weight: 700; }
.k-chat p { background: #fff; padding: 7px 9px; border-radius: 12px 12px 12px 4px; font-size: 12px; color: #111; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
/* 용의자 */
.sus { position: absolute; left: 50%; top: 50%; width: 200px; margin: -150px 0 0 -100px; z-index: 2; transform: rotate(-1.5deg); }
.sus .fr { background: #fff; padding: 12px 12px 14px; box-shadow: 0 14px 22px -8px rgba(0,0,0,.6); }
.sus .ph { height: 190px; background: linear-gradient(160deg, #8b939b, #4a5158); display: grid; place-items: center; overflow: hidden; }
.sus .ph img { width: 100%; height: 100%; object-fit: cover; }
.sus .ph svg { width: 92px; opacity: .7; }
.sus .cap { margin-top: 10px; text-align: center; }
.sus .cap small { display: block; font: 700 11px var(--mono); color: var(--red); letter-spacing: .2em; }
.sus .cap b { font: 400 30px/1 var(--pen); }
.sus .tape { position: absolute; top: -12px; left: 50%; width: 90px; height: 24px; margin-left: -45px; background: rgba(255,250,220,.75); transform: rotate(2deg); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.det { position: absolute; right: 26px; bottom: 26px; width: 116px; transform: rotate(4deg); z-index: 2; }
.det .fr { background: #fff; padding: 7px 7px 8px; box-shadow: 0 8px 12px -6px rgba(0,0,0,.5); }
.det .ph { height: 92px; background: linear-gradient(160deg, #a4adb5, #646c74); overflow: hidden; display: grid; place-items: center; }
.det .ph img { width: 100%; height: 100%; object-fit: cover; }
.det .ph svg { width: 54px; opacity: .7; }
.det .cap { margin-top: 5px; text-align: center; font: 400 18px/1 var(--pen); }
.det .cap small { display: block; font: 700 9.5px var(--mono); color: #555; letter-spacing: .12em; margin-bottom: 2px; }
.hint { position: absolute; left: 22px; bottom: 18px; z-index: 2; font: 400 20px var(--pen); color: rgba(40,22,8,.7); }
/* 결론 */
.verdict { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; margin-top: 18px; padding: 20px 24px; background: var(--paper); border-radius: 3px; box-shadow: 0 10px 18px rgba(0,0,0,.35); font-family: var(--mono); }
.verdict small { font-size: 11.5px; letter-spacing: .14em; color: #8a1014; font-weight: 700; }
.verdict h2 { margin: 6px 0 8px; font: 800 22px/1.35 "Nanum Myeongjo", serif; color: #1b1b1b; }
.verdict p { margin: 0; font-size: 13px; line-height: 1.6; color: #3d3a33; }
.stamp { padding: 10px 16px; border: 4px double var(--red); color: var(--red); font: 800 24px/1 var(--mono); letter-spacing: .12em; transform: rotate(-9deg); opacity: .88; mix-blend-mode: multiply; text-align: center; }
.stamp small { display: block; margin-top: 4px; font-size: 10px; letter-spacing: .06em; color: var(--red); }
.stamp.drop { animation: thud .4s cubic-bezier(.3,1.6,.5,1) both; animation-delay: 1.6s; }
@keyframes thud { from { opacity: 0; transform: rotate(-9deg) scale(1.8); } to { opacity: .88; transform: rotate(-9deg) scale(1); } }
.still .cl, .still .str, .still .stamp { animation: none !important; }
</style>
</head>
<body data-mode="view" data-noframe>
<header class="bar">
  <a class="brand" href="../">귀환의 블로그</a>
  <span class="bar-title">수사 보드</span>
  <span class="bar-spacer"></span>

</header>
<main class="stage only-view">
  <p class="shared-note" id="shared-note" hidden>공유받은 수사 보드예요. 만들기에서 고치면 내 브라우저에만 저장돼요.</p>
  <div class="viewer"><div id="wrap"><div id="zoomer"><article class="poster" id="poster"></article></div></div></div>

</main>
<main class="editor only-edit" id="editor"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.8/dist/index.js"></script>
<script src="../assets/core.js"></script>
<script>
(() => {
const { esc, clamp, num, $ } = Core;
const MAX = 8, MAXL = 5;
const KIND = { photo: '현장 사진', note: '포스트잇', card: '관찰 카드', receipt: '영수증·기록', chat: '메시지 캡처' };
const eClue = () => ({ kind: 'card', title: '', text: '', date: '', inner: '' });
const eLink = () => ({ a: 0, b: 0, why: '' });
const blank = () => ({ v: 1, no: '', title: '', charge: '', a: { name: 'NPC' }, b: { name: 'PC' }, clues: Array.from({ length: MAX }, eClue), links: Array.from({ length: MAXL }, eLink), verdict: { truth: '', conf: 50, note: '' } });
const sample = () => normalize({
  no: '2026-0314', title: '서고 시간 일치 사건', charge: '공녀를 좋아하면서 정략일 뿐이라고 둘러댄 혐의',
  clues: [
    { kind: 'photo', title: '무도회 첫 춤', text: '의례상 한 곡이라더니 두 곡째까지 손을 놓지 않음.', date: '3.14 무도회', inner: '한 곡만 추면 된다고 했는데, 음악이 끝나는 게 싫었다.' },
    { kind: 'receipt', title: '서고 출입 기록', text: '공녀 방문 시간과 열한 번 연속 일치. 본인은 “우연”이라 진술.', date: '4월~8월', inner: '시간표를 외운 건 나다. 우연이라고 말할 때마다 귀가 뜨거웠다.' },
    { kind: 'note', title: '부치지 않은 편지', text: '벽난로에서 타다 남은 종이 조각 발견. “공녀께”까지만 읽힘.', date: '8.15 밤', inner: '세 장을 썼다. 한 장도 보낼 용기가 없었다.' },
    { kind: 'card', title: '사절단 소식', text: '사절단 접대 소식을 남에게 먼저 듣고 하루 종일 말수가 줄어듦.', date: '9.08', inner: '왜 나한테 먼저 말하지 않았는지가 제일 아팠다.' },
    { kind: 'chat', title: '쪽지 한 줄', text: '“잘했습니다.” 꽃다발 카드에 적힌 말은 이게 전부.', date: '10.02', inner: '보고 싶었다고 쓰려다 지웠다.' },
    { kind: 'photo', title: '비 오는 정원', text: '망토가 하나뿐이라 함께 썼다는 정황. 시종은 근처에 있었음.', date: '10.30 비', inner: '시종을 부를 수 있었다. 부르지 않았다.' },
  ],
  links: [{ a: 2, b: 3, why: '숨긴 마음' }, { a: 4, b: 5, why: '말 대신 행동' }, { a: 1, b: 6, why: '손을 안 놓음' }],
  verdict: { truth: 'NPC는 처음 춤을 춘 날부터 PC를 좋아하고 있었다.', conf: 92, note: '모든 단서가 같은 방향을 가리킴. 다만 본인이 끝까지 자백하지 않아 확정은 보류.' },
});
function normalize(s) {
  const b = blank(); s = s && typeof s === 'object' ? s : {};
  const o = { ...b, ...s, a: { ...b.a, ...(s.a || {}) }, b: { ...b.b, ...(s.b || {}) }, verdict: { ...b.verdict, ...(s.verdict || {}) } };
  o.clues = Array.from({ length: MAX }, (_, i) => { const c = { ...eClue(), ...((s.clues || [])[i] || {}) }; if (!KIND[c.kind]) c.kind = 'card'; return c; });
  o.links = Array.from({ length: MAXL }, (_, i) => { const l = { ...eLink(), ...((s.links || [])[i] || {}) }; l.a = clamp(Math.round(num(l.a, 0)), 0, MAX); l.b = clamp(Math.round(num(l.b, 0)), 0, MAX); return l; });
  o.verdict.conf = clamp(Math.round(num(o.verdict.conf, 50)), 0, 100);
  return o;
}
function apply(S, o) {
  const got = [];
  ['no', 'title', 'charge'].forEach(k => { if (o[k]) { S[k] = o[k]; if (!got.includes('사건')) got.push('사건'); } });
  if (Array.isArray(o.clues)) { S.clues = Array.from({ length: MAX }, eClue); o.clues.slice(0, MAX).forEach((c, i) => { if (c) S.clues[i] = { ...eClue(), ...c }; }); got.push('단서'); }
  if (Array.isArray(o.links)) { S.links = Array.from({ length: MAXL }, eLink); o.links.slice(0, MAXL).forEach((l, i) => { if (l) S.links[i] = { ...eLink(), ...l }; }); got.push('연결'); }
  if (o.verdict && typeof o.verdict === 'object') { S.verdict = { ...S.verdict, ...o.verdict }; got.push('결론'); }
  return got;
}
function prompts() {
  const p = `*[OOC: 롤플레잉 잠시 중단. 「수사 보드」 기록.
PC가 형사가 되어 NPC의 숨긴 마음을 추리하는 수사 보드를 만든다. 단서 카드를 누르면 뒷면에 그때 NPC의 실제 속마음이 나온다.
▪ no 사건 번호 “2026-0314”, title 사건명 14자(“○○ 사건”), charge 혐의 30자(NPC가 숨기고 있는 마음을 수사 서류 말투로)
▪ clues 4~8개, RP에서 실제 있었던 NPC의 말·행동·물건만, 시간순: kind photo(장면)|note(포스트잇 메모)|card(관찰 카드)|receipt(기록·영수증)|chat(메시지), title 12자, text 겉으로 드러난 사실 45자(형사 수사 메모 말투, 건조하게), date 시점 10자, inner 그때 NPC의 실제 속마음 45자(NPC 1인칭, 말투 그대로)
▪ links 0~5개: 같은 마음을 가리키는 단서 쌍, a·b 단서 번호(1부터), why 연결 이유 8자
▪ verdict: truth 수사 결론, NPC의 진짜 마음 한 문장 40자 / conf 확신도 0~100(RP에서 드러난 만큼만) / note 수사 보고 60자(정황 정리, PC의 속마음은 쓰지 않음)
▪ 근거: 설정과 RP에서 실제 있었던 일만. PC의 말·행동은 RP에 나온 것만 쓰고 지어내지 않는다. 여기서 만든 내용은 이후 RP의 사실로 삼지 않는다.
▪ 품질: 뻔한 단서 대신 이 두 사람만의 물건·장소·말버릇. inner는 text와 어긋날수록 좋다(겉과 속).
▪ 출력: 인사·설명 없이 JSON 코드 블록 하나만. 문자열 안 따옴표는 “ ”만. 값은 형식 예시일 뿐.
{"no":"","title":"","charge":"","clues":[{"kind":"card","title":"","text":"","date":"","inner":""}],"links":[{"a":1,"b":2,"why":""}],"verdict":{"truth":"","conf":50,"note":""}}]*`;
  return [{ label: '수사 보드', sub: '단서 · 속마음 · 결론', text: p }];
}
function progress(S) {
  const n = S.clues.filter(c => c.title).length;
  return [{ label: '사건', ok: !!S.title }, { label: `단서 ${n}개`, ok: n >= 3 }, { label: '속마음', ok: S.clues.some(c => c.inner) }, { label: '결론', ok: !!S.verdict.truth }];
}
function schema(S) {
  const cl = [], lk = [];
  S.clues.forEach((c, i) => cl.push({ sub: `단서 ${i + 1}` }, { k: `clues.${i}.kind`, label: '종류', type: 'select', opts: Object.entries(KIND) }, { k: `clues.${i}.title`, label: '제목', ph: '비우면 빠져요' }, { k: `clues.${i}.date`, label: '시점' }, { k: `clues.${i}.text`, label: '겉으로 드러난 사실', full: true }, { k: `clues.${i}.inner`, label: '뒷면 · NPC의 속마음', full: true }));
  S.links.forEach((l, i) => lk.push({ sub: `실 ${i + 1}` }, { k: `links.${i}.a`, label: '단서 번호', num: true }, { k: `links.${i}.b`, label: '단서 번호', num: true }, { k: `links.${i}.why`, label: '이유' }));
  return [
    { title: '사건', en: 'CASE', desc: '용의자·형사 사진과 현장 사진 칸은 보기 화면에서 눌러 넣어요.', fields: [{ k: 'no', label: '사건 번호' }, { k: 'title', label: '사건명' }, { k: 'charge', label: '혐의', full: true }, { k: 'a.name', label: '용의자' }, { k: 'b.name', label: '담당 형사' }] },
    { title: '단서', en: 'CLUES', fields: cl },
    { title: '빨간 실', en: 'LINKS', desc: '모든 단서는 용의자와 실로 이어져요. 여기는 단서끼리 잇는 실이에요.', fields: lk },
    { title: '결론', en: 'VERDICT', fields: [{ k: 'verdict.truth', label: '수사 결론', full: true }, { k: 'verdict.conf', label: '확신도', type: 'range' }, { k: 'verdict.note', label: '수사 보고', type: 'textarea', full: true }] },
  ];
}
/* 판 위 자리(카드 왼쪽 위 기준, 판 996×700) · 기울기 */
const SLOT = [[40, 40, -4], [262, 26, 3], [598, 30, -2], [800, 64, 5], [36, 380, 3], [252, 446, -3], [600, 452, 4], [790, 330, -5]];
const ORDER = [0, 2, 1, 3, 4, 6, 5, 7];
const SIL = '<svg viewBox="0 0 70 80" aria-hidden="true"><circle cx="35" cy="28" r="15" fill="#e8ecef"/><path d="M6 80c2-18 14-28 29-28s27 10 29 28z" fill="#e8ecef"/></svg>';
function clueHTML(c, i, k, still) {
  const [x, y, r] = SLOT[k], pic = Core.photo('c' + i);
  const body = c.kind === 'photo' ? `<div class="ph" data-photo="c${i}">${pic ? `<img src="${pic}" alt="">` : esc(c.text)}</div><h4>${esc(c.title)}</h4>${pic ? `<p>${esc(c.text)}</p>` : ''}`
    : c.kind === 'receipt' ? `<h4>${esc(c.title)}</h4><p>${esc(c.text)}</p>`
    : c.kind === 'chat' ? `<h4>${esc(c.title)}</h4><p>${esc(c.text)}</p>`
    : `<h4>${esc(c.title)}</h4><p>${esc(c.text)}</p>`;
  return `<div class="cl k-${c.kind}" data-i="${i}" tabindex="0" role="button" aria-label="단서 ${i + 1} ${esc(c.title)}, 눌러서 속마음 보기" style="left:${x}px;top:${y}px;--r:${r}deg;${still ? '' : `animation-delay:${200 + k * 140}ms`}">
    <span class="pin"></span><div class="in"><div class="fr"><span class="num">#${i + 1}</span>${body}<time>${esc(c.date)}</time></div>
    <div class="bk"><small>${esc(c.title)} · 속마음</small><p>${esc(c.inner || '…')}</p></div></div></div>`;
}
function posterHTML(S, still) {
  const cs = S.clues.map((c, i) => ({ c, i })).filter(o => o.c.title);
  const pos = {}; cs.forEach((o, k) => { pos[o.i] = ORDER[k] ?? k; });
  const cx = 498, cy = 318;
  const pinOf = i => { const [x, y] = SLOT[pos[i]]; return [x + 88, y + 2]; };
  const sag = (a, b, d = 34) => `M${a[0]} ${a[1]} Q${(a[0] + b[0]) / 2} ${(a[1] + b[1]) / 2 + d} ${b[0]} ${b[1]}`;
  let labels = '';
  let strs = cs.map((o, k) => `<path class="str" d="${sag(pinOf(o.i), [cx, cy - 152], 26)}" style="${still ? '' : `animation-delay:${900 + k * 120}ms`}"/>`).join('');
  S.links.filter(l => l.a && l.b && pos[l.a - 1] != null && pos[l.b - 1] != null && l.a !== l.b).forEach((l, k) => {
    const A = pinOf(l.a - 1), B = pinOf(l.b - 1), mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2 + 40;
    strs += `<path class="str" d="${sag(A, B, 80)}" style="stroke-dasharray:6 5;${still ? '' : `animation-delay:${1500 + k * 150}ms`}"/>`;
    if (l.why) { const w = [...l.why].length * 11 + 14; labels += `<g><rect class="lkb" x="${mx - w / 2}" y="${my - 10}" width="${w}" height="20" rx="3"/><text class="lk" x="${mx}" y="${my + 4}" text-anchor="middle">${esc(l.why)}</text></g>`; }
  });
  const pa = Core.photo('a'), pb = Core.photo('b'), v = S.verdict, solved = v.conf >= 80;
  return `
  <header class="file">
    <div><div class="no">사건 번호 ${esc(S.no || '----')}</div><h1>${esc(S.title || '이름 없는 사건')}</h1>
      <dl><dt>용의자</dt><dd>${esc(S.a.name)}</dd><dt>담당 형사</dt><dd>${esc(S.b.name)}</dd><dt>혐의</dt><dd>${esc(S.charge || '')}</dd></dl></div>
    <div class="conf"><span>확신도</span><b>${v.conf}%</b><div class="bar"><i style="width:${v.conf}%"></i></div></div>
  </header>
  <div class="cork">
    <svg class="strings" viewBox="0 0 996 700" aria-hidden="true">${strs}</svg><svg class="strings labels" viewBox="0 0 996 700" aria-hidden="true">${labels}</svg>
    <div class="sus"><span class="tape"></span><div class="fr"><div class="ph" data-photo="a">${pa ? `<img src="${pa}" alt="${esc(S.a.name)}">` : SIL}</div><div class="cap"><small>용의자</small><b>${esc(S.a.name)}</b></div></div></div>
    ${cs.map((o, k) => clueHTML(o.c, o.i, pos[o.i], still)).join('')}
    <div class="det"><div class="fr"><div class="ph" data-photo="b">${pb ? `<img src="${pb}" alt="${esc(S.b.name)}">` : SIL}</div><div class="cap"><small>담당 형사</small>${esc(S.b.name)}</div></div></div>
    <div class="hint">카드를 누르면 뒷면에 속마음이 있어요</div>
  </div>
  <section class="verdict">
    <div><small>수사 결론</small><h2>${esc(v.truth || '아직 결론이 없습니다.')}</h2><p>${esc(v.note || '')}</p></div>
    <div class="stamp${still ? '' : ' drop'}">${solved ? '사건 해결' : '수사 중'}<small>${esc(S.no || '')}</small></div>
  </section>`;
}
function fit() { const w = $('#wrap'), z = $('#zoomer'); if (!w || !z) return; z.style.zoom = Math.min(1, (w.clientWidth - 4) / 1040); }
window.addEventListener('resize', Core.debounce(fit, 120));
let allFlip = false;
function render(S, { animate }) {
  const el = $('#poster'); el.innerHTML = posterHTML(S, !animate); el.classList.toggle('still', !animate); fit();
  el.querySelectorAll('.cl').forEach(c => {
    const t = () => c.classList.toggle('flip');
    c.addEventListener('click', e => { if (e.target.closest('[data-photo]')) return; t(); });
    c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t(); } });
    if (allFlip) c.classList.add('flip');
  });
}
$('#btn-flip').addEventListener('click', () => { allFlip = !allFlip; document.querySelectorAll('#poster .cl').forEach(c => c.classList.toggle('flip', allFlip)); $('#btn-flip').textContent = allFlip ? '앞면으로 되돌리기' : '속마음 전부 뒤집기'; });
Core.app({ key: '2inbun:board', what: '수사 보드', sample, blank, normalize, schema, prompts, apply, progress, render, fileName: S => `수사보드_${S.title || S.a.name}` });
})();
