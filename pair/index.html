<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페어틀 편집기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%3E%3Crect%20width%3D%2716%27%20height%3D%2716%27%20rx%3D%273%27%20fill%3D%27%23111%27%2F%3E%3Crect%20x%3D%273%27%20y%3D%273%27%20width%3D%274%27%20height%3D%2710%27%20rx%3D%271%27%20fill%3D%27%23e8e2d4%27%2F%3E%3Crect%20x%3D%279%27%20y%3D%273%27%20width%3D%274%27%20height%3D%2710%27%20rx%3D%271%27%20fill%3D%27%233b5bdb%27%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="프로그램 없이 웹에서 바로 만드는 페어틀 편집기. 블록을 쌓고, 글자를 바로 고치고, 그림을 끌어 넣어 PNG로 저장">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Noto+Serif+KR:wght@500;800&family=Nanum+Pen+Script&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="../assets/base.css">
<style>
/* 페어틀 편집기: 왼쪽(테마 · 블록 · 스티커) · 가운데(용지) · 오른쪽(디자인 · 고른 블록). 용지 위에서 바로 고친다. 움직임 없음 */
:root { --ui: #eeeef1; --ui2: #ffffff; --uil: #d6d6dd; --uit: #19191d; --uis: #55555e; --acc: #3b5bdb; }
body[data-mode="view"] { background: var(--ui); }
body[data-mode="view"] .stage { max-width: none; padding: 0; }
body[data-mode="view"] .pc-note { display: none; }
.actions[hidden] { display: none !important; }
.app { display: grid; grid-template-columns: 270px minmax(0, 1fr) 290px; grid-template-rows: auto minmax(0, 1fr); position: fixed; left: 0; right: 0; bottom: 0; top: var(--barh, 46px); z-index: 5; background: var(--ui); font: 500 13.5px "Pretendard Variable", sans-serif; color: var(--uit); }
body[data-mode="view"] { overflow: hidden; }
.toast, .toast.on { top: auto; bottom: 22px; transition: none; transform: translate(-50%, 0); }
#wrap { min-height: 0; overscroll-behavior: contain; }
.side { min-height: 0; overscroll-behavior: contain; }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--ui2); border-bottom: 1px solid var(--uil); flex-wrap: wrap; }
.top .nm { font-weight: 800; margin-right: 6px; }
.top .sp { flex: 1; }
.ib { all: unset; box-sizing: border-box; cursor: pointer; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--uil); background: #fff; display: inline-flex; align-items: center; gap: 6px; font: 700 13px "Pretendard Variable", sans-serif; color: var(--uit); }
.ib:hover { border-color: #b9b9c2; }
.ib:disabled { opacity: .4; cursor: default; }
.ib.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
.ib:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.zoomv { min-width: 48px; text-align: center; font-weight: 800; color: var(--uit); }
.side { background: var(--ui2); border-right: 1px solid var(--uil); overflow: auto; }
.side.r { border-right: 0; border-left: 1px solid var(--uil); }
.stabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--uil); position: sticky; top: 0; background: var(--ui2); z-index: 2; }
.stabs button { all: unset; cursor: pointer; text-align: center; padding: 12px 0; font-weight: 800; font-size: 14px; color: var(--uis); border-bottom: 2px solid transparent; }
.stabs button[aria-pressed="true"] { color: var(--uit); border-bottom-color: var(--uit); }
.pane { padding: 14px; display: grid; gap: 10px; }
.pane h5 { margin: 10px 0 0; font-size: 13px; font-weight: 800; color: var(--uit); letter-spacing: 0; }
.tile { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; padding: 9px 10px; border: 1px solid var(--uil); border-radius: 10px; background: #fff; }
.tile:hover { border-color: var(--acc); }
.tile i { width: 34px; height: 34px; border-radius: 8px; background: var(--ui); display: grid; place-items: center; font-style: normal; font-size: 15px; }
.tile b { display: block; font-size: 13.5px; } .tile small { color: var(--uis); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid2 .tile { grid-template-columns: 1fr; text-align: center; justify-items: center; gap: 4px; padding: 10px 6px; }
.fld { display: grid; gap: 5px; }
.fld label { font-size: 13px; color: var(--uit); font-weight: 600; }
.fld input[type=range] { width: 100%; }
.cols { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 600; }
.cols input[type=color] { width: 34px; height: 28px; border: 1px solid var(--uil); border-radius: 6px; padding: 0; background: #fff; }
.seg { display: inline-flex; border: 1px solid var(--uil); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 6px 11px; font-weight: 700; font-size: 13px; color: var(--uis); }
.seg button[aria-pressed="true"] { background: var(--uit); color: #fff; }
.note { font-size: 13px; color: var(--uis); line-height: 1.6; margin: 0; }
.canvas { overflow: auto; padding: 30px 24px 120px; display: flex; justify-content: safe center; align-items: flex-start; background: #e9e9ed; min-width: 0; }
#zoomer:has(.capturing) { zoom: 1 !important; }

/* ── 용지 ── */
.poster { --a: #8c1c13; --b: #24427a; --bg: #f6f5f2; --ink: #1c1c1f; --r: 14px; --gap: 14px; --bd: 1.5px solid rgba(0,0,0,.85); width: var(--w, 1000px); background: var(--bg); color: var(--ink); padding: 26px; display: flex; flex-direction: column; gap: var(--gap); position: relative; font: 400 13.5px/1.55 var(--font, "Pretendard Variable"), sans-serif; box-shadow: 0 16px 40px -20px rgba(0,0,0,.4); }
.poster.capturing { box-shadow: none; }
.poster.nob { --bd: 0 solid transparent; }
.f-serif { --font: "Noto Serif KR"; } .f-round { --font: "Gowun Dodum"; } .f-pen { --font: "Nanum Pen Script"; font-size: 18px; } .f-dot { --font: "Galmuri11"; }
.blk { position: relative; border-radius: var(--r); }
.blk.box { background: color-mix(in srgb, var(--bg) 70%, #fff); border: var(--bd); padding: 16px 18px; }
.blk:hover { outline: 1px dashed rgba(59,91,219,.6); outline-offset: 4px; }
.blk.sel { outline: 2px solid var(--acc); outline-offset: 4px; }
.capturing .blk { outline: none !important; }
.bctl { position: absolute; top: -14px; right: 10px; z-index: 6; display: none; gap: 3px; }
.blk:hover .bctl, .blk.sel .bctl { display: flex; }
.capturing .bctl { display: none !important; }
.bctl button { all: unset; cursor: pointer; width: 26px; height: 26px; border-radius: 7px; background: #222; color: #fff; font: 700 12px/26px "Pretendard Variable", sans-serif; text-align: center; }
.bctl button:hover { background: var(--acc); }
[data-e] { outline: none; border-radius: 3px; min-width: 8px; display: inline-block; }
[data-e]:empty::before { content: attr(data-ph); opacity: .35; }
[data-e]:hover { box-shadow: 0 0 0 1px rgba(59,91,219,.5); }
[data-e]:focus { box-shadow: 0 0 0 2px var(--acc); background: rgba(59,91,219,.06); }
.capturing [data-e] { box-shadow: none !important; background: none !important; }
.capturing [data-e]:empty::before { content: ""; }
.chipc { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); cursor: pointer; vertical-align: -4px; }
.pic { position: relative; overflow: hidden; background: color-mix(in srgb, var(--ink) 8%, var(--bg)); border-radius: calc(var(--r) * .7); display: grid; place-items: center; }
.pic img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; cursor: grab; }
.pic .ph { font-size: 12px; opacity: .45; text-align: center; padding: 8px; }
.pic img ~ .ph { display: none; }
.adj { position: absolute; left: 6px; bottom: 6px; z-index: 4; display: none; gap: 4px; }
.pic:hover .adj { display: flex; }
.capturing .adj { display: none !important; }
.adj button { all: unset; cursor: pointer; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font: 700 14px/24px sans-serif; text-align: center; }
.b-head { text-align: center; padding: 10px 0 4px; }
.b-head .t { font: 800 48px/1.05 "Archivo", var(--font, "Pretendard Variable"), sans-serif; letter-spacing: -.01em; }
.b-head .s { margin-top: 6px; opacity: .75; }
.b-head .d { margin-top: 10px; display: inline-flex; align-items: center; gap: 10px; font-size: 12px; opacity: .8; }
.b-head .d i { width: 10px; height: 10px; border-radius: 50%; }
.al-l { text-align: left; }
.b-people { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.pc { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: start; }
.pc .pic { height: 190px; }
.pc .nm { font-size: 22px; font-weight: 800; line-height: 1.15; }
.pc .en { font-size: 11px; letter-spacing: .16em; opacity: .6; text-transform: uppercase; }
.pc .mt { margin: 4px 0 8px; font-size: 12px; opacity: .75; }
.pc .kw { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.pc .kw span { padding: 2px 9px; border-radius: 999px; color: #fff; font-size: 11.5px; font-weight: 700; }
.pc .ft { display: grid; gap: 3px; font-size: 12.5px; margin-bottom: 8px; }
.pc .ft div::before { content: "□ "; opacity: .6; }
.pc .ok { display: grid; grid-template-columns: 30px 1fr; gap: 3px 8px; font-size: 12.5px; }
.pc .ok b { font-size: 11px; font-weight: 800; }
.pc .cc { margin-top: 8px; display: flex; gap: 6px; align-items: center; font-size: 11px; opacity: .85; }
.b-full { display: grid; gap: var(--gap); }
.b-full .pic { height: var(--h, 520px); }
.b-full .lab { position: absolute; top: 12px; z-index: 3; background: var(--ink); color: var(--bg); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.b-rel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; text-align: center; }
.b-rel .badge { padding: 8px 20px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 800; }
.poster { --at: color-mix(in srgb, var(--a) 55%, var(--ink)); --bt: color-mix(in srgb, var(--b) 55%, var(--ink)); }
.b-rel .side1 { color: var(--at); } .b-rel .side2 { color: var(--bt); }
.b-rel small { display: block; font-size: 11.5px; opacity: .7; color: var(--ink); }
.b-rel .call { grid-column: 1 / -1; display: flex; justify-content: center; gap: 16px; font-size: 12.5px; flex-wrap: wrap; }
.b-rel .call span { padding: 3px 12px; border: 1px solid currentColor; border-radius: 999px; }
.b-qa { display: grid; gap: 10px; }
.b-qa .q { font-weight: 800; }
.b-qa .an { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.b-qa .an div { padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--c) 10%, transparent); border-left: 3px solid var(--c); }
.b-tl { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
.b-tl div { border-top: 3px solid var(--ink); padding-top: 8px; }
.b-tl em { display: block; font-style: normal; font-weight: 800; font-size: 12px; }
.b-talk { display: grid; gap: 6px; }
.b-talk div { max-width: 70%; padding: 8px 14px; border-radius: 16px; background: color-mix(in srgb, var(--a) 12%, var(--bg)); }
.b-talk div.r { justify-self: end; background: color-mix(in srgb, var(--b) 12%, var(--bg)); }
.b-talk div small { display: block; font-size: 10.5px; font-weight: 800; opacity: .7; }
.lbl { font-size: 11px; font-weight: 800; letter-spacing: .14em; opacity: .55; margin-bottom: 6px; text-transform: uppercase; }
.b-song { display: flex; align-items: center; gap: 14px; }
.b-song .cv { width: 64px; height: 64px; border-radius: 10px; flex: none; }
.b-song b { font-size: 16px; } .b-song .ctl { margin-left: auto; letter-spacing: .3em; opacity: .7; }
.b-stats { display: grid; gap: 8px; }
.b-stats .r { display: grid; grid-template-columns: 1fr 90px 1fr; gap: 10px; align-items: center; font-size: 12.5px; }
.b-stats em { font-style: normal; text-align: center; font-weight: 700; }
.b-stats i { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 10%, transparent); position: relative; overflow: hidden; }
.b-stats i u { position: absolute; top: 0; bottom: 0; }
.b-stats i:first-child u { right: 0; background: color-mix(in srgb, var(--a) 85%, var(--ink)); } .b-stats i:last-child u { left: 0; background: color-mix(in srgb, var(--b) 85%, var(--ink)); }
.b-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.b-tags span { padding: 5px 14px; border-radius: 999px; border: var(--bd); font-weight: 700; font-size: 12.5px; }
.b-line hr { border: 0; border-top: 1.5px solid currentColor; opacity: .5; margin: 4px 0; }
.b-img .pic { height: var(--h, 320px); }
.b-text { white-space: pre-wrap; }
.stl { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.stk { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: move; user-select: none; white-space: nowrap; }
.stk .x { position: absolute; top: -10px; right: -10px; width: 18px; height: 18px; border-radius: 50%; background: #111; color: #fff; font: 700 11px/18px sans-serif; text-align: center; cursor: pointer; display: none; }
.stk:hover .x { display: block; } .capturing .stk .x { display: none !important; }
.stk.text { font: 800 22px var(--font, "Pretendard Variable"), sans-serif; background: var(--bg); padding: 4px 12px; border: 2px solid var(--ink); }
.stk.pen { font: 400 32px "Nanum Pen Script", cursive; color: var(--a); }
.stk.bubble { background: #fff; border: 2px solid var(--ink); border-radius: 18px; padding: 8px 14px; font-weight: 600; font-size: 15px; }
.stk.icon { font-size: 44px; line-height: 1; }
/* ── 편집기 도구 ── */
.top { position: relative; }
.slots { display: inline-flex; gap: 4px; }
.ib .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); display: inline-block; }
.slotm { position: absolute; z-index: 40; width: 196px; display: grid; gap: 4px; padding: 10px; background: #fff; border: 1px solid var(--uil); border-radius: 10px; box-shadow: 0 12px 28px -10px rgba(0,0,0,.3); }
.slotm small { color: var(--uis); font-size: 11.5px; margin-bottom: 4px; }
.slotm button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 7px; font-weight: 700; font-size: 12.5px; }
.slotm button:hover, .slotm button:focus-visible { background: var(--ui); }
.slotm [data-sl="clear"] { color: #c0392b; }
.kl { display: grid; gap: 7px; font-size: 12.5px; }
.kl div { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: baseline; }
.kl kbd { font: 700 11.5px "Pretendard Variable", sans-serif; padding: 2px 6px; border-radius: 5px; background: var(--ui); border: 1px solid var(--uil); white-space: nowrap; }
.kl span { color: var(--uis); }
.keys { position: fixed; inset: 0; z-index: 100; background: rgba(20,20,24,.35); display: grid; place-items: center; padding: 16px; }
.keysb { width: min(460px, 100%); max-height: 86vh; overflow: auto; background: #fff; border-radius: 14px; padding: 18px 20px; display: grid; gap: 12px; font: 500 13px "Pretendard Variable", sans-serif; color: var(--uit); }
.keysh { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
.keysh button { all: unset; cursor: pointer; width: 30px; height: 30px; text-align: center; border-radius: 8px; font-size: 18px; }
.keysh button:hover { background: var(--ui); }
.keys .kl { font-size: 13px; gap: 8px; } .keys .kl div { grid-template-columns: 170px 1fr; } .keys .kl kbd { font-size: 12px; justify-self: start; }
.ghost { position: fixed; z-index: 120; pointer-events: none; padding: 6px 12px; border-radius: 8px; background: #222; color: #fff; font: 700 12.5px "Pretendard Variable", sans-serif; opacity: .9; }
.ghost.ok { background: var(--acc); }
.dropline { position: fixed; z-index: 110; height: 4px; margin-top: -2px; background: var(--acc); border-radius: 4px; pointer-events: none; }
.grab { cursor: grab !important; }
.tile small { display: block; font-size: 10.5px; line-height: 1.35; }
.addi { all: unset; cursor: pointer; display: none; margin: 10px auto 0; padding: 4px 12px; border-radius: 999px; border: 1px dashed currentColor; font: 700 11.5px "Pretendard Variable", sans-serif; opacity: .65; text-align: center; width: max-content; }
.blk:hover > .addi, .blk.sel > .addi { display: block; }
.addi:hover { opacity: 1; }
.capturing .addi { display: none !important; }
.stk.on { outline: 2px solid var(--acc); outline-offset: 4px; }
.capturing .stk.on { outline: none; }
.stk.bubble { background: var(--bg); color: var(--ink); }
.seg button:disabled { opacity: .35; cursor: default; }
/* 테마 고르기 */
.thg { display: grid; gap: 10px; }
.thc { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 7px; padding: 7px; border: 1px solid var(--uil); border-radius: 12px; background: #fff; }
.thc:hover { border-color: #b9b9c2; }
.thc[aria-pressed="true"] { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.thc:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.thv { display: block; height: 170px; overflow: hidden; border-radius: 7px; background: var(--ui); pointer-events: none; }
.thv .poster { display: flex; box-shadow: none; }
.thv .bctl, .thv .addi, .thv .adj, .thv .stk .x, .thv .ph-x { display: none !important; }
.thv .blk, .thv .stk { outline: none !important; }
.thv [data-e] { box-shadow: none !important; }
.thn { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 0 3px 2px; }
.thn b { font-size: 14px; } .thn small { color: var(--uis); font-size: 12px; text-align: right; }

/* ── 테마: 배치부터 다르다 ── */
.blk { container-type: inline-size; }
@container (max-width: 620px) { .b-people { grid-template-columns: 1fr; } .b-qa .an { grid-template-columns: 1fr; } }
@container (max-width: 330px) { .b-full { grid-template-columns: 1fr !important; } }
@container (max-width: 460px) {
  .pc { grid-template-columns: 112px 1fr; gap: 10px; } .pc .pic { height: 148px; }
  .b-rel { grid-template-columns: 1fr; gap: 8px; } .b-tl { grid-auto-flow: row; }
  .b-stats .r { grid-template-columns: 1fr 66px 1fr; }
  .b-song .ctl { display: none; } .b-talk div { max-width: 88%; }
}
.lay { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
:where(.lay > div[class^="z-"], .lay > .pg) { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }

/* 신문: 제호 · 큰 사진 · 3단 기사 */
.th-news .z-mast { gap: 0; text-align: center; border-bottom: 3px double var(--ink); padding-bottom: 8px; }
.np-top { display: flex; justify-content: space-between; gap: 10px; padding: 6px 2px; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); font: 600 11.5px "Noto Serif KR", serif; letter-spacing: .06em; }
.th-news .b-head { padding: 14px 0 4px; }
.th-news .b-head .t { font: 800 80px/1 "Noto Serif KR", serif; letter-spacing: -.045em; }
.th-news .b-head .s { font: 500 15px "Noto Serif KR", serif; opacity: .85; }
.th-news .blk.box { background: transparent; border: 0; border-radius: 0; padding: 0; }
.th-news .pic, .th-news .pc .kw span, .th-news .b-tags span, .th-news .b-rel .badge, .th-news .b-song .cv, .th-news .b-qa .an div { border-radius: 0; }
.th-news .z-lead { gap: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--ink); }
.th-news .pc .nm { font-family: "Noto Serif KR", serif; font-size: 26px; }
.th-news .z-cols { display: block; columns: 3; column-gap: 30px; column-rule: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); }
.th-news .z-cols > .blk { break-inside: avoid; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); }
.th-news .lbl { font: 800 18px/1.25 "Noto Serif KR", serif; letter-spacing: -.01em; opacity: 1; padding-bottom: 6px; margin-bottom: 10px; border-bottom: 2px solid var(--ink); }

.th-news .b-text [data-e]::first-letter { float: left; font: 800 48px/.9 "Noto Serif KR", serif; margin: 4px 8px 0 0; }
.th-news .b-tl { grid-auto-flow: row; gap: 8px; } .th-news .b-tl div { border-top: 1px solid var(--ink); }

/* 다이어리: 펼친 공책 두 쪽 */

.th-note .pg.r { padding: 36px 36px 46px 30px; background: linear-gradient(90deg, rgba(0,0,0,.09), transparent 12%), repeating-linear-gradient(transparent 0 29px, color-mix(in srgb, var(--b) 15%, transparent) 29px 30px), var(--bg); border-radius: 0 6px 6px 0; }
.th-note .pn { position: absolute; bottom: 14px; font: 400 12px "Gowun Batang", "Noto Serif KR", serif; opacity: .5; } .th-note .pg.l .pn { left: 36px; } .th-note .pg.r .pn { right: 36px; }

.th-note .lbl { display: inline-block; font: 700 13px "Gowun Batang", "Noto Serif KR", serif; letter-spacing: .04em; opacity: 1; color: var(--at); border-bottom: 2px solid color-mix(in srgb, var(--a) 35%, transparent); padding-bottom: 2px; }
.th-note .pic { border: 7px solid #fff; border-bottom-width: 26px; border-radius: 2px; box-shadow: 0 5px 12px -5px rgba(0,0,0,.4); transform: rotate(-1.6deg); }

.th-note .blk[data-t="full"]::before, .th-note .blk[data-t="img"]::before, .th-note .blk[data-t="people"]::before { content: ""; position: absolute; z-index: 3; top: -8px; left: 50%; width: 92px; height: 22px; margin-left: -46px; transform: rotate(-3deg); background: color-mix(in srgb, var(--a) 26%, #fff); opacity: .9; }
.th-note .pg.r .blk::before { background: color-mix(in srgb, var(--b) 26%, #fff); transform: rotate(2deg); }
.th-note .b-full .pic { height: calc(var(--h, 520px) * .62); }
.th-note .b-song .lbl { display: table; margin-bottom: 4px !important; }
.th-note .b-text { font: 400 14.5px/30px "Gowun Batang", "Noto Serif KR", serif; }
.th-note .b-talk div { font-family: "Gowun Batang", "Noto Serif KR", serif; background: color-mix(in srgb, var(--a) 9%, #fff); border-radius: 4px 14px 14px 14px; }
.th-note .b-talk div.r { background: color-mix(in srgb, var(--b) 9%, #fff); border-radius: 14px 4px 14px 14px; }

/* 벤토: 크기가 다른 칸 격자 */

.th-soft .blk.box { background: rgba(255,255,255,.84); border: 0; border-radius: 26px; padding: 20px 22px; box-shadow: 0 16px 30px -24px color-mix(in srgb, var(--b) 70%, #000); }
.th-soft .lay > .blk.box:nth-child(3n+2) { background: color-mix(in srgb, var(--a) 9%, #fff); }
.th-soft .lay > .blk.box:nth-child(3n) { background: color-mix(in srgb, var(--b) 9%, #fff); }
.th-soft .b-head { padding: 22px 0 6px; }
.th-soft .b-head .t { font: 800 58px/1.05 "Gowun Dodum", sans-serif; letter-spacing: -.02em; }

.th-soft .pic { border-radius: 18px; }
.th-soft .b-talk div { border-radius: 20px; background: #fff; }
.th-soft .b-talk div.r { background: color-mix(in srgb, var(--b) 16%, #fff); }
.th-soft .b-full .pic { height: calc(var(--h, 520px) * .8); }

/* 영화 포스터: 큰 그림 · 제목 · 출연 · 크레딧 */
.th-night .z-hero { position: relative; margin: -26px -26px 0; }
.th-night .z-hero .blk.box { background: none; border: 0; padding: 0; border-radius: 0; }
.th-night .z-hero .pic { border-radius: 0; height: 560px; }
.th-night .z-hero .b-full { gap: 0; }
.th-night .z-hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: linear-gradient(transparent, var(--bg)); pointer-events: none; z-index: 2; }
.th-night .z-title { position: relative; z-index: 3; margin-top: -150px; }
.th-night .lay.nohero .z-title { margin-top: 20px; }
.th-night .b-head .t { font: 800 78px/1 "Archivo", var(--font, "Pretendard Variable"), sans-serif; letter-spacing: .02em; background: linear-gradient(90deg, color-mix(in srgb, var(--a) 50%, #fff), color-mix(in srgb, var(--b) 50%, #fff)); -webkit-background-clip: text; background-clip: text; color: transparent; caret-color: var(--ink); }

.th-night .z-cast .pc .nm { font: 800 26px "Archivo", "Pretendard Variable", sans-serif; letter-spacing: .06em; }
.th-night .z-body { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.th-night .z-body > .blk:is([data-t="qa"], [data-t="timeline"], [data-t="tags"], [data-t="line"]) { grid-column: 1 / -1; }
.th-night .blk.box { background: color-mix(in srgb, var(--bg) 92%, #fff); border: 1px solid color-mix(in srgb, var(--bg) 78%, #fff); }
.th-night .lbl { color: color-mix(in srgb, var(--a) 45%, #fff); opacity: 1; letter-spacing: .2em; }
.th-night .b-rel .side1 { color: color-mix(in srgb, var(--a) 50%, #fff); } .th-night .b-rel .side2 { color: color-mix(in srgb, var(--b) 50%, #fff); }
.th-night .b-rel .call span { color: var(--ink) !important; }
.th-night .pc .ok b[style] { color: color-mix(in srgb, var(--a) 50%, #fff) !important; }
.th-night .b-talk div { background: color-mix(in srgb, var(--a) 22%, var(--bg)); } .th-night .b-talk div.r { background: color-mix(in srgb, var(--b) 22%, var(--bg)); }
.mv-cr { text-align: center; padding: 22px 0 4px; border-top: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); font: 500 12px/1.9 "Archivo", "Pretendard Variable", sans-serif; letter-spacing: .14em; }
.mv-cr .who { display: flex; justify-content: center; gap: 36px; font-size: 18px; font-weight: 800; letter-spacing: .3em; }
.mv-cr .sm { opacity: .6; }
.mv-cr .dt { font: 800 30px "Archivo", sans-serif; letter-spacing: .24em; margin-top: 8px; }

/* 서류철: 폴더 · 신상 카드 · 클립 메모 */
.th-file { padding-top: 70px; background: linear-gradient(160deg, #474b53, #34373d); }
.th-file .lay { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; align-items: start; padding: 28px; background: #cfa95e; border-radius: 0 12px 12px 12px; box-shadow: 0 16px 32px -18px rgba(0,0,0,.5); }
.th-file .z-tab { position: absolute; left: 0; bottom: 100%; width: 58%; padding: 10px 24px 4px; background: #cfa95e; border-radius: 12px 12px 0 0; }
.th-file .z-tab .b-head { text-align: left; padding: 0; }
.th-file .z-tab .b-head .t { font: 400 30px/1.15 "Galmuri11", monospace; letter-spacing: 0; }
.th-file .z-tab .b-head .s { font-size: 12px; margin-top: 2px; }
.th-file .z-tab .b-head .d { margin-top: 4px; }
.th-file .lay::after { content: "대외비"; position: absolute; right: 18px; bottom: calc(100% + 10px); padding: 4px 12px; border: 3px solid var(--a); color: var(--a); font: 800 16px "Pretendard Variable", sans-serif; letter-spacing: .2em; transform: rotate(-6deg); }
.th-file .blk.box { background: var(--bg); border: 0; border-radius: 2px; box-shadow: 0 2px 0 rgba(0,0,0,.05), 0 10px 18px -12px rgba(0,0,0,.45); }
.th-file .z-memo > .blk.box:nth-child(odd) { transform: rotate(-.6deg); } .th-file .z-memo > .blk.box:nth-child(even) { transform: rotate(.5deg); }
.th-file .z-memo > .blk.box::before { content: ""; position: absolute; top: -14px; right: 30px; width: 12px; height: 36px; border: 2.5px solid #7d838d; border-radius: 7px; background: transparent; }
.th-file .z-id .pc { background: #fff; border: 1px solid #cfc6af; padding: 12px; }
.th-file .pic { border-radius: 0; background: #e4dccb; }
.th-file .lbl { font: 400 12px "Galmuri11", monospace; letter-spacing: .06em; opacity: .75; }
.th-file .b-text { font-size: 14px; }

/* 옛날 창: 바탕화면 · 창 여러 개 · 작업 표시줄 */
.th-win { padding-bottom: 0; }
.th-win .z-wall .b-head { text-align: left; padding: 6px 4px 0; }
.th-win .z-wall .b-head .t { font: 400 54px/1.1 "Galmuri11", monospace; letter-spacing: 0; }
.th-win .z-desk { display: block; columns: 2; column-gap: 24px; }

.th-win .xw { position: relative; border-radius: var(--r); padding: 16px 18px; }

.th-win :is(.blk, .xw).box { background: color-mix(in srgb, var(--bg) 20%, #fff); border: 2px solid var(--ink); border-radius: 6px; padding-top: 42px; box-shadow: 5px 5px 0 var(--ink); }
.th-win :is(.blk, .xw).box::before { content: attr(data-lab); position: absolute; left: 0; right: 0; top: 0; height: 26px; padding: 0 12px; background: color-mix(in srgb, var(--a) 78%, #000); color: #fff; font: 400 12px/26px "Galmuri11", monospace; border-bottom: 2px solid var(--ink); border-radius: 3px 3px 0 0; }
.th-win .z-desk > .box:nth-child(even)::before { background: color-mix(in srgb, var(--b) 78%, #000); }
.th-win :is(.blk, .xw).box::after { content: "─ □ ×"; position: absolute; right: 12px; top: 0; height: 26px; font: 400 12px/26px "Galmuri11", monospace; color: #fff; letter-spacing: .25em; }
.th-win .lbl { display: none; }
.th-win .pic { border-radius: 0; border: 2px solid var(--ink); }
.w-task { display: flex; align-items: center; gap: 8px; margin: 4px -26px 0; height: 40px; padding: 0 10px; background: color-mix(in srgb, var(--bg) 45%, #fff); border-top: 2px solid var(--ink); font: 400 12px "Galmuri11", monospace; }
.w-task span { padding: 3px 12px; border: 2px solid var(--ink); background: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.w-task .st { font-weight: 700; box-shadow: 2px 2px 0 var(--ink); }
.w-task .ck { margin-left: auto; box-shadow: inset 1px 1px 0 rgba(0,0,0,.25); }

/* ── 테마 전용 칸 ── */
/* 신문 */
.np-name { font: 800 30px/1.1 "Noto Serif KR", serif; letter-spacing: .3em; padding: 12px 0 2px; }
.th-news .b-head .t { font-size: 62px; }
.np-lead { display: grid; gap: 8px; }
.np-lead .by { font: 700 12px "Noto Serif KR", serif; letter-spacing: .1em; opacity: .75; }
.np-lead .tx { columns: 2; column-gap: 28px; column-rule: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); font: 400 14.5px/1.75 "Noto Serif KR", serif; white-space: pre-wrap; text-align: justify; }
.np-lead .tx [data-e]::first-letter { float: left; font: 800 52px/.9 "Noto Serif KR", serif; margin: 4px 8px 0 0; }
.np-brief { break-inside: avoid; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); }

.np-brief p::before { content: "■"; position: absolute; left: 0; font-size: 7px; top: 6px; }
.np-ad { break-inside: avoid; border: 3px double var(--ink); padding: 14px; text-align: center; font: 800 17px/1.4 "Noto Serif KR", serif; }
.np-ad small { display: block; font: 600 10.5px "Pretendard Variable", sans-serif; letter-spacing: .3em; opacity: .6; margin-bottom: 6px; }
/* 다이어리 */
.nt-date { font: 700 14px "Gowun Batang", "Noto Serif KR", serif; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; border-bottom: 1.5px solid color-mix(in srgb, var(--a) 40%, transparent); padding-bottom: 6px; }
.nt-date i { font-style: normal; opacity: .4; }
.nt-diary { font: 400 14.5px/30px "Gowun Batang", "Noto Serif KR", serif; white-space: pre-wrap; }
.nt-todo div { display: flex; gap: 10px; align-items: center; font: 400 14px/30px "Gowun Batang", "Noto Serif KR", serif; }
.nt-todo div i { width: 13px; height: 13px; border: 1.5px solid var(--ink); border-radius: 2px; flex: none; transform: translateY(1px); }
.nt-memo { align-self: flex-start; width: 190px; min-height: 110px; padding: 16px 16px; background: #fbeea6; transform: rotate(-2.5deg); box-shadow: 0 8px 14px -8px rgba(0,0,0,.4); font: 700 14px/1.6 "Gowun Batang", "Noto Serif KR", serif; }
/* 벤토 */
.xs { border-radius: 26px; padding: 20px 22px; background: rgba(255,255,255,.84); box-shadow: 0 16px 30px -24px color-mix(in srgb, var(--b) 70%, #000); grid-column: span 2; }
.xs-fav { grid-column: span 4; } .xs-tmi { grid-column: span 4; } .xs-match { text-align: center; }
.xs .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.xs .two b { display: block; margin-bottom: 6px; }
.xs .two div > span { display: block; padding: 6px 12px; margin-bottom: 6px; border-radius: 12px; background: color-mix(in srgb, var(--bg) 60%, #fff); font-size: 13px; }
.xs-match .big { font: 800 54px/1 "Gowun Dodum", sans-serif; color: var(--at); margin: 6px 0 10px; }
.xs-match .big small { font-size: 22px; }
.xs-match .bar { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 10%, transparent); overflow: hidden; margin-bottom: 10px; }
.xs-match .bar u { display: block; height: 100%; background: linear-gradient(90deg, var(--a), var(--b)); }
.xs-tmi p { margin: 0 0 8px; padding: 8px 12px; border-radius: 12px; background: color-mix(in srgb, var(--a) 8%, #fff); font-size: 13px; }
.xs-mood .kws { font: 800 22px/1.4 "Gowun Dodum", sans-serif; color: var(--bt); }
.xs-mood { order: 0; }
/* 영화 포스터 */
.mv-tag { text-align: center; font-size: 19px; font-weight: 600; letter-spacing: .12em; margin-bottom: 10px; }
.mv-meta { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 16px; font-size: 14.5px; letter-spacing: .08em; opacity: .9; }
.mv-meta b { padding: 2px 10px; border: 1.5px solid var(--ink); border-radius: 4px; font-weight: 800; }
.xn { border-radius: var(--r); padding: 16px 18px; background: color-mix(in srgb, var(--bg) 92%, #fff); border: 1px solid color-mix(in srgb, var(--bg) 78%, #fff); }
.xn-syn { grid-column: 1 / -1; font-size: 15px; line-height: 1.75; white-space: pre-wrap; }
.xn-rev { grid-column: 1 / -1; }
.xn-rev p { margin: 0 0 8px; display: flex; gap: 12px; align-items: baseline; }
.xn-rev em { font-style: normal; color: #f2c14e; letter-spacing: .1em; font-size: 12px; flex: none; }
/* 서류철 */
.fl-form { grid-column: 1 / -1; width: 100%; border-collapse: collapse; background: #fbf8ef; font-size: 13px; box-shadow: 0 8px 16px -12px rgba(0,0,0,.4); }
.fl-form th, .fl-form td { border: 1px solid #b9ae93; padding: 7px 10px; text-align: left; }
.fl-form th { background: #eee6d2; font: 400 11px "Galmuri11", monospace; white-space: nowrap; width: 1%; }
.xf { position: relative; background: #fbf8ef; padding: 16px 18px; border-radius: 2px; box-shadow: 0 2px 0 rgba(0,0,0,.05), 0 10px 18px -12px rgba(0,0,0,.45); }
.xf::before { content: ""; position: absolute; top: -14px; right: 30px; width: 12px; height: 36px; border: 2.5px solid #7d838d; border-radius: 7px; }
.xf-obs { background: repeating-linear-gradient(transparent 0 27px, rgba(80,110,160,.18) 27px 28px), #fbf8ef; transform: rotate(-.5deg); }
.xf-obs div { display: grid; grid-template-columns: 92px 1fr; gap: 8px; font-size: 13px; line-height: 28px; }
.xf-obs em { font: 400 11.5px/28px "Galmuri11", monospace; font-style: normal; opacity: .75; }
.xf-op { font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; transform: rotate(.4deg); }
.redact { margin-top: 10px; }
.redact [data-e] { background: var(--ink); color: var(--ink); padding: 0 4px; }
.redact [data-e]:focus, .redact [data-e]:empty { background: none; color: inherit; }
/* 옛날 창 */
.th-win .z-pc { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 18px; align-items: start; }
.w-icons { display: grid; gap: 16px; padding-top: 6px; }
.w-icons div { display: grid; justify-items: center; gap: 4px; text-align: center; font: 400 11px/1.3 "Galmuri11", monospace; word-break: break-all; }
.w-icons i { width: 34px; height: 40px; background: #fff; border: 2px solid var(--ink); position: relative; }
.w-icons i::after { content: ""; position: absolute; right: -2px; top: -2px; border: 6px solid; border-color: var(--bg) var(--bg) var(--ink) var(--ink); }
.w-bud div { display: grid; grid-template-columns: 12px 1fr; gap: 2px 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed color-mix(in srgb, var(--ink) 30%, transparent); }
.w-bud i { width: 10px; height: 10px; border-radius: 50%; background: #3cb043; border: 1px solid var(--ink); }
.w-bud small { grid-column: 2; font-size: 12px; opacity: .7; }
.w-log { font: 400 12px/1.8 "Galmuri11", monospace; }
.w-al { display: flex; gap: 12px; align-items: center; font-size: 14px; }
.w-al i { font-style: normal; width: 34px; height: 34px; flex: none; border-radius: 50%; background: #f2c14e; border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 800; }
.w-btn { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
.w-btn span { padding: 3px 18px; border: 2px solid var(--ink); background: #fff; box-shadow: 2px 2px 0 var(--ink); font: 400 12px "Galmuri11", monospace; }
/* 잡지 */
.mg-issue { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 4; color: #fff; font: 800 13px "Archivo", "Pretendard Variable", sans-serif; letter-spacing: .2em; }
.mg-lines { position: absolute; top: 60px; right: 34px; z-index: 4; display: grid; gap: 10px; max-width: 34%; text-align: right; color: #fff; font: 800 18px/1.25 "Pretendard Variable", sans-serif; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.lay.nocover .mg-issue, .lay.nocover .mg-lines { position: static; color: inherit; text-shadow: none; max-width: none; text-align: left; }
.mg-quote { font: 800 34px/1.25 "Pretendard Variable", sans-serif; letter-spacing: -.03em; padding: 18px 0; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--ink); }
.mg-quote small { display: block; font-size: 12px; letter-spacing: .3em; margin-top: 10px; font-weight: 600; }
.xm { break-inside: avoid; margin-bottom: 24px; border-top: 1px solid var(--ink); padding-top: 14px; }

document.addEventListener('pointerup', e => {

function pickColor(path) { const inp = document.createElement('input'); inp.type = 'color'; inp.value = get(S_(), path) || '#888888'; inp.oninput = () => { set(S_(), path, inp.value); paint(S_()); }; inp.onchange = () => rerender(); inp.click(); }
