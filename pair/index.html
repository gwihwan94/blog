<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페어틀 편집기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%3E%3Crect%20width%3D%2716%27%20height%3D%2716%27%20rx%3D%273%27%20fill%3D%27%23111%27%2F%3E%3Crect%20x%3D%273%27%20y%3D%273%27%20width%3D%274%27%20height%3D%2710%27%20rx%3D%271%27%20fill%3D%27%23e8e2d4%27%2F%3E%3Crect%20x%3D%279%27%20y%3D%273%27%20width%3D%274%27%20height%3D%2710%27%20rx%3D%271%27%20fill%3D%27%233b5bdb%27%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="프로그램 없이 웹에서 바로 만드는 페어틀 편집기. 블록을 쌓고, 글자를 바로 고치고, 그림을 끌어 넣어 PNG로 저장">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Noto+Serif+KR:wght@500;800&family=Nanum+Pen+Script&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="../assets/base.css">
<style>
/* 페어틀 편집기: 왼쪽(테마 · 블록 · 스티커) · 가운데(용지) · 오른쪽(디자인 · 고른 블록). 용지 위에서 바로 고친다. 움직임 없음 */
:root { --ui: #f3f3f5; --ui2: #ffffff; --uil: #dcdce2; --uit: #222226; --uis: #74747c; --acc: #3b5bdb; }
body[data-mode="view"] { background: var(--ui); }
body[data-mode="view"] .stage { max-width: none; padding: 0; }
body[data-mode="view"] .pc-note { display: none; }
.actions[hidden] { display: none !important; }
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr) 270px; grid-template-rows: auto 1fr; height: calc(100vh - 50px); height: calc(100dvh - 50px); font: 500 13px "Pretendard Variable", sans-serif; color: var(--uit); }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--ui2); border-bottom: 1px solid var(--uil); flex-wrap: wrap; }
.top .nm { font-weight: 800; margin-right: 6px; }
.top .sp { flex: 1; }
.ib { all: unset; box-sizing: border-box; cursor: pointer; height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--uil); background: #fff; display: inline-flex; align-items: center; gap: 6px; font: 700 12.5px "Pretendard Variable", sans-serif; color: var(--uit); }
.ib:hover { border-color: #b9b9c2; }
.ib:disabled { opacity: .4; cursor: default; }
.ib.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
.ib:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.zoomv { min-width: 44px; text-align: center; font-weight: 700; color: var(--uis); }
.side { background: var(--ui2); border-right: 1px solid var(--uil); overflow: auto; }
.side.r { border-right: 0; border-left: 1px solid var(--uil); }
.stabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--uil); position: sticky; top: 0; background: var(--ui2); z-index: 2; }
.stabs button { all: unset; cursor: pointer; text-align: center; padding: 10px 0; font-weight: 700; color: var(--uis); border-bottom: 2px solid transparent; }
.stabs button[aria-pressed="true"] { color: var(--uit); border-bottom-color: var(--uit); }
.pane { padding: 12px; display: grid; gap: 8px; }
.pane h5 { margin: 6px 0 0; font-size: 11.5px; color: var(--uis); letter-spacing: .04em; }
.tile { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; padding: 9px 10px; border: 1px solid var(--uil); border-radius: 10px; background: #fff; }
.tile:hover { border-color: var(--acc); }
.tile i { width: 34px; height: 34px; border-radius: 8px; background: var(--ui); display: grid; place-items: center; font-style: normal; font-size: 15px; }
.tile b { display: block; font-size: 13px; } .tile small { color: var(--uis); font-size: 11.5px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.grid2 .tile { grid-template-columns: 1fr; text-align: center; justify-items: center; gap: 4px; padding: 10px 6px; }
.fld { display: grid; gap: 5px; }
.fld label { font-size: 12px; color: var(--uis); font-weight: 600; }
.fld input[type=range] { width: 100%; }
.cols { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cols input[type=color] { width: 34px; height: 28px; border: 1px solid var(--uil); border-radius: 6px; padding: 0; background: #fff; }
.seg { display: inline-flex; border: 1px solid var(--uil); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 5px 10px; font-weight: 700; font-size: 12px; color: var(--uis); }
.seg button[aria-pressed="true"] { background: var(--uit); color: #fff; }
.note { font-size: 11.5px; color: var(--uis); line-height: 1.55; margin: 0; }
.canvas { overflow: auto; padding: 30px 24px 120px; display: flex; justify-content: safe center; align-items: flex-start; background: #e9e9ed; min-width: 0; }
#zoomer:has(.capturing) { zoom: 1 !important; }

/* ── 용지 ── */
.poster { --a: #8c1c13; --b: #24427a; --bg: #f6f5f2; --ink: #1c1c1f; --r: 14px; --gap: 14px; --bd: 1.5px solid rgba(0,0,0,.85); width: var(--w, 1000px); background: var(--bg); color: var(--ink); padding: 26px; display: flex; flex-direction: column; gap: var(--gap); position: relative; font: 400 13.5px/1.55 var(--font, "Pretendard Variable"), sans-serif; box-shadow: 0 16px 40px -20px rgba(0,0,0,.4); }
.poster.capturing { box-shadow: none; }
.poster.nob { --bd: 0 solid transparent; }
.f-serif { --font: "Noto Serif KR"; } .f-round { --font: "Gowun Dodum"; } .f-pen { --font: "Nanum Pen Script"; font-size: 18px; } .f-dot { --font: "Galmuri11"; }
.blk { position: relative; border-radius: var(--r); }
.blk.box { background: color-mix(in srgb, var(--bg) 70%, #fff); border: var(--bd); padding: 16px 18px; }
.blk:hover { outline: 1px dashed rgba(59,91,219,.6); outline-offset: 4px; }
.blk.sel { outline: 2px solid var(--acc); outline-offset: 4px; }
.capturing .blk { outline: none !important; }
.bctl { position: absolute; top: -14px; right: 10px; z-index: 6; display: none; gap: 3px; }
.blk:hover .bctl, .blk.sel .bctl { display: flex; }
.capturing .bctl { display: none !important; }
.bctl button { all: unset; cursor: pointer; width: 26px; height: 26px; border-radius: 7px; background: #222; color: #fff; font: 700 12px/26px "Pretendard Variable", sans-serif; text-align: center; }
.bctl button:hover { background: var(--acc); }
[data-e] { outline: none; border-radius: 3px; min-width: 8px; display: inline-block; }
[data-e]:empty::before { content: attr(data-ph); opacity: .35; }
[data-e]:hover { box-shadow: 0 0 0 1px rgba(59,91,219,.5); }
[data-e]:focus { box-shadow: 0 0 0 2px var(--acc); background: rgba(59,91,219,.06); }
.capturing [data-e] { box-shadow: none !important; background: none !important; }
.capturing [data-e]:empty::before { content: ""; }
.chipc { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); cursor: pointer; vertical-align: -4px; }
.pic { position: relative; overflow: hidden; background: color-mix(in srgb, var(--ink) 8%, var(--bg)); border-radius: calc(var(--r) * .7); display: grid; place-items: center; }
.pic img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; cursor: grab; }
.pic .ph { font-size: 12px; opacity: .45; text-align: center; padding: 8px; }
.pic img ~ .ph { display: none; }
.adj { position: absolute; left: 6px; bottom: 6px; z-index: 4; display: none; gap: 4px; }
.pic:hover .adj { display: flex; }
.capturing .adj { display: none !important; }
.adj button { all: unset; cursor: pointer; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font: 700 14px/24px sans-serif; text-align: center; }
.b-head { text-align: center; padding: 10px 0 4px; }
.b-head .t { font: 800 48px/1.05 "Archivo", var(--font, "Pretendard Variable"), sans-serif; letter-spacing: -.01em; }
.b-head .s { margin-top: 6px; opacity: .75; }
.b-head .d { margin-top: 10px; display: inline-flex; align-items: center; gap: 10px; font-size: 12px; opacity: .8; }
.b-head .d i { width: 10px; height: 10px; border-radius: 50%; }
.al-l { text-align: left; }
.b-people { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.pc { display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: start; }
.pc .pic { height: 190px; }
.pc .nm { font-size: 22px; font-weight: 800; line-height: 1.15; }
.pc .en { font-size: 11px; letter-spacing: .16em; opacity: .6; text-transform: uppercase; }
.pc .mt { margin: 4px 0 8px; font-size: 12px; opacity: .75; }
.pc .kw { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.pc .kw span { padding: 2px 9px; border-radius: 999px; color: #fff; font-size: 11.5px; font-weight: 700; }
.pc .ft { display: grid; gap: 3px; font-size: 12.5px; margin-bottom: 8px; }
.pc .ft div::before { content: "□ "; opacity: .6; }
.pc .ok { display: grid; grid-template-columns: 30px 1fr; gap: 3px 8px; font-size: 12.5px; }
.pc .ok b { font-size: 11px; font-weight: 800; }
.pc .cc { margin-top: 8px; display: flex; gap: 6px; align-items: center; font-size: 11px; opacity: .85; }
.b-full { display: grid; gap: var(--gap); }
.b-full .pic { height: var(--h, 520px); }
.b-full .lab { position: absolute; top: 12px; z-index: 3; background: var(--ink); color: var(--bg); padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.b-rel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; text-align: center; }
.b-rel .badge { padding: 8px 20px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 800; }
.b-rel .side1 { color: var(--a); } .b-rel .side2 { color: var(--b); }
.b-rel small { display: block; font-size: 11.5px; opacity: .7; color: var(--ink); }
.b-rel .call { grid-column: 1 / -1; display: flex; justify-content: center; gap: 16px; font-size: 12.5px; flex-wrap: wrap; }
.b-rel .call span { padding: 3px 12px; border: 1px solid currentColor; border-radius: 999px; }
.b-qa { display: grid; gap: 10px; }
.b-qa .q { font-weight: 800; }
.b-qa .an { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.b-qa .an div { padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--c) 10%, transparent); border-left: 3px solid var(--c); }
.b-tl { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; }
.b-tl div { border-top: 3px solid var(--ink); padding-top: 8px; }
.b-tl em { display: block; font-style: normal; font-weight: 800; font-size: 12px; }
.b-talk { display: grid; gap: 6px; }
.b-talk div { max-width: 70%; padding: 8px 14px; border-radius: 16px; background: color-mix(in srgb, var(--a) 12%, var(--bg)); }
.b-talk div.r { justify-self: end; background: color-mix(in srgb, var(--b) 12%, var(--bg)); }
.b-talk div small { display: block; font-size: 10.5px; font-weight: 800; opacity: .7; }
.lbl { font-size: 11px; font-weight: 800; letter-spacing: .14em; opacity: .55; margin-bottom: 6px; text-transform: uppercase; }
.b-song { display: flex; align-items: center; gap: 14px; }
.b-song .cv { width: 64px; height: 64px; border-radius: 10px; flex: none; }
.b-song b { font-size: 16px; } .b-song .ctl { margin-left: auto; letter-spacing: .3em; opacity: .7; }
.b-stats { display: grid; gap: 8px; }
.b-stats .r { display: grid; grid-template-columns: 1fr 90px 1fr; gap: 10px; align-items: center; font-size: 12.5px; }
.b-stats em { font-style: normal; text-align: center; font-weight: 700; }
.b-stats i { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 10%, transparent); position: relative; overflow: hidden; }
.b-stats i u { position: absolute; top: 0; bottom: 0; }
.b-stats i:first-child u { right: 0; background: var(--a); } .b-stats i:last-child u { left: 0; background: var(--b); }
.b-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.b-tags span { padding: 5px 14px; border-radius: 999px; border: var(--bd); font-weight: 700; font-size: 12.5px; }
.b-line hr { border: 0; border-top: 1.5px solid currentColor; opacity: .5; margin: 4px 0; }
.b-img .pic { height: var(--h, 320px); }
.b-text { white-space: pre-wrap; }
.stl { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.stk { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: move; user-select: none; white-space: nowrap; }
.stk .x { position: absolute; top: -10px; right: -10px; width: 18px; height: 18px; border-radius: 50%; background: #111; color: #fff; font: 700 11px/18px sans-serif; text-align: center; cursor: pointer; display: none; }
.stk:hover .x { display: block; } .capturing .stk .x { display: none !important; }
.stk.text { font: 800 22px var(--font, "Pretendard Variable"), sans-serif; background: var(--bg); padding: 4px 12px; border: 2px solid var(--ink); }
.stk.pen { font: 400 32px "Nanum Pen Script", cursive; color: var(--a); }
.stk.bubble { background: #fff; border: 2px solid var(--ink); border-radius: 18px; padding: 8px 14px; font-weight: 600; font-size: 15px; }
.stk.icon { font-size: 44px; line-height: 1; }
/* ── 편집기 도구 ── */
.top { position: relative; }
.slots { display: inline-flex; gap: 4px; }
.ib .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); display: inline-block; }
.slotm { position: absolute; z-index: 40; width: 196px; display: grid; gap: 4px; padding: 10px; background: #fff; border: 1px solid var(--uil); border-radius: 10px; box-shadow: 0 12px 28px -10px rgba(0,0,0,.3); }
.slotm small { color: var(--uis); font-size: 11.5px; margin-bottom: 4px; }
.slotm button { all: unset; cursor: pointer; padding: 7px 10px; border-radius: 7px; font-weight: 700; font-size: 12.5px; }
.slotm button:hover, .slotm button:focus-visible { background: var(--ui); }
.slotm [data-sl="clear"] { color: #c0392b; }
.kl { display: grid; gap: 5px; font-size: 11.5px; }
.kl div { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: baseline; }
.kl kbd { font: 700 10.5px "Pretendard Variable", sans-serif; padding: 2px 6px; border-radius: 5px; background: var(--ui); border: 1px solid var(--uil); white-space: nowrap; }
.kl span { color: var(--uis); }
.keys { position: fixed; inset: 0; z-index: 100; background: rgba(20,20,24,.35); display: grid; place-items: center; padding: 16px; }
.keysb { width: min(460px, 100%); max-height: 86vh; overflow: auto; background: #fff; border-radius: 14px; padding: 18px 20px; display: grid; gap: 12px; font: 500 13px "Pretendard Variable", sans-serif; color: var(--uit); }
.keysh { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
.keysh button { all: unset; cursor: pointer; width: 30px; height: 30px; text-align: center; border-radius: 8px; font-size: 18px; }
.keysh button:hover { background: var(--ui); }
.keys .kl { font-size: 13px; gap: 8px; } .keys .kl div { grid-template-columns: 170px 1fr; } .keys .kl kbd { font-size: 12px; justify-self: start; }
.ghost { position: fixed; z-index: 120; pointer-events: none; padding: 6px 12px; border-radius: 8px; background: #222; color: #fff; font: 700 12.5px "Pretendard Variable", sans-serif; opacity: .9; }
.ghost.ok { background: var(--acc); }
.dropline { position: fixed; z-index: 110; height: 4px; margin-top: -2px; background: var(--acc); border-radius: 4px; pointer-events: none; }
.grab { cursor: grab !important; }
.tile small { display: block; font-size: 10.5px; line-height: 1.35; }
.addi { all: unset; cursor: pointer; display: none; margin: 10px auto 0; padding: 4px 12px; border-radius: 999px; border: 1px dashed currentColor; font: 700 11.5px "Pretendard Variable", sans-serif; opacity: .65; text-align: center; width: max-content; }
.blk:hover > .addi, .blk.sel > .addi { display: block; }
.addi:hover { opacity: 1; }
.capturing .addi { display: none !important; }
.stk.on { outline: 2px solid var(--acc); outline-offset: 4px; }
.capturing .stk.on { outline: none; }
.stk.bubble { background: var(--bg); color: var(--ink); }
.seg button:disabled { opacity: .35; cursor: default; }
/* 테마 고르기 */
.thg { display: grid; gap: 10px; }
.thc { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 7px; padding: 7px; border: 1px solid var(--uil); border-radius: 12px; background: #fff; }
.thc:hover { border-color: #b9b9c2; }
.thc[aria-pressed="true"] { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.thc:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.thv { display: block; height: 150px; overflow: hidden; border-radius: 7px; background: var(--ui); pointer-events: none; }
.thv .poster { display: flex; box-shadow: none; }
.thv .bctl, .thv .addi, .thv .adj, .thv .stk .x, .thv .ph-x { display: none !important; }
.thv .blk, .thv .stk { outline: none !important; }
.thv [data-e] { box-shadow: none !important; }
.thn { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; padding: 0 3px 2px; }
.thn b { font-size: 13px; } .thn small { color: var(--uis); font-size: 11px; text-align: right; }

/* ── 테마 ── */
/* 신문 */
.th-news .blk.box { background: transparent; border: 0; border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink); border-radius: 0; padding: 16px 6px; }
.th-news .b-head { border-top: 6px solid var(--ink); border-bottom: 3px double var(--ink); padding: 18px 0 14px; }
.th-news .b-head .t { font: 800 64px/1 "Noto Serif KR", serif; letter-spacing: -.03em; }
.th-news .b-head .s { font-family: "Noto Serif KR", serif; font-size: 15px; opacity: .9; }
.th-news .lbl { font-family: "Noto Serif KR", serif; letter-spacing: .3em; opacity: .85; border-bottom: 1px solid var(--ink); padding-bottom: 5px; }
.th-news .pc .nm { font-family: "Noto Serif KR", serif; }
.th-news .pic, .th-news .b-qa .an div, .th-news .pc .kw span, .th-news .b-tags span, .th-news .b-rel .badge, .th-news .b-song .cv { border-radius: 0; }
.th-news .b-talk div { background: transparent; border-left: 3px solid var(--a); border-radius: 0; }
.th-news .b-talk div.r { border-left: 0; border-right: 3px solid var(--b); text-align: right; }
/* 다이어리 */
.th-note { background: linear-gradient(90deg, transparent 52px, color-mix(in srgb, var(--a) 30%, transparent) 52px 54px, transparent 54px), repeating-linear-gradient(transparent 0 27px, color-mix(in srgb, var(--b) 15%, transparent) 27px 28px), var(--bg); padding-left: 70px; }
.th-note .blk.box { background: #fff; border: 0; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 10px 18px -12px rgba(0,0,0,.3); }
.th-note .blk.box::before { content: ""; position: absolute; top: -10px; left: 50%; width: 96px; height: 22px; margin-left: -48px; transform: rotate(-2deg); background: color-mix(in srgb, var(--a) 28%, #fff); opacity: .85; }
.th-note .blk.box:nth-child(even)::before { transform: rotate(2.5deg); left: 24%; background: color-mix(in srgb, var(--b) 28%, #fff); }
.th-note .lbl { font: 400 24px/1 "Nanum Pen Script", cursive; letter-spacing: 0; text-transform: none; opacity: 1; color: var(--a); }
.th-note .b-head .t { font-family: "Gowun Dodum", sans-serif; }
.th-note .b-head .s { font: 400 22px "Nanum Pen Script", cursive; opacity: .85; }
/* 파스텔 */
.th-soft { background: linear-gradient(160deg, color-mix(in srgb, var(--a) 13%, var(--bg)), color-mix(in srgb, var(--b) 15%, var(--bg))); }
.th-soft .blk.box { background: rgba(255,255,255,.82); border: 0; border-radius: 24px; box-shadow: 0 14px 30px -22px color-mix(in srgb, var(--b) 60%, #000); }
.th-soft .b-head .t { font: 800 54px/1.05 "Gowun Dodum", sans-serif; letter-spacing: -.02em; }
.th-soft .lbl { display: inline-block; padding: 3px 12px; border-radius: 999px; background: color-mix(in srgb, var(--a) 14%, #fff); color: var(--a); opacity: 1; letter-spacing: .08em; }
.th-soft .pic { border-radius: 18px; }
.th-soft .b-talk div { border-radius: 20px; }
/* 밤 */
.th-night .blk.box { background: color-mix(in srgb, var(--bg) 90%, #fff); border: 1px solid color-mix(in srgb, var(--bg) 74%, #fff); }

  const z = e.target.closest('.adj [data-z]');
  if (z) { e.stopPropagation(); e.preventDefault(); const p = z.closest('.pic'), k = p.dataset.photo, m = META(k); m.z = clamp(+(m.z + (+z.dataset.z) * .1).toFixed(2), 1, 3); setMeta(k, m); p.querySelector('img').style.transform = `scale(${m.z})`; return; }
  const ai = e.target.closest('[data-addi]'); if (ai) { e.stopPropagation(); select(S_().blocks[+ai.closest('.blk').dataset.bi].id); listItem(ai.dataset.addi, 'add'); return; }
  const act = e.target.closest('.bctl [data-act]');
  if (act) { e.stopPropagation(); const i = +act.closest('.blk').dataset.bi, a = act.dataset.act; SEL = S_().blocks[i].id;
    if (a === 'up') moveSel(-1); if (a === 'down') moveSel(1); if (a === 'dup') dupSel(); if (a === 'del') delSel(); return; }
  const sx = e.target.closest('[data-sx]'); if (sx) { e.stopPropagation(); SSEL = +sx.dataset.sx; delSel(); return; }
  const c = e.target.closest('[data-c]'); if (c) { e.stopPropagation(); pickColor(c.dataset.c); return; }
  if (e.target.closest('[data-e]')) e.stopPropagation();
  if (e.target.closest('.stk')) return;
  const blk = e.target.closest('.blk');
  if (blk && !e.target.closest('[data-photo]')) { const id = S_().blocks[+blk.dataset.bi].id; if (SEL !== id) select(id); }
}, true);
document.addEventListener('click', e => {
  if (!ST) return; const S = S_(), q = s => e.target.closest(s);
  if (!q('.slotm') && !q('[data-t="slot"]')) $('.slotm')?.remove();
  if (q('.keys') && (q('[data-kx]') || !q('.keysb'))) { $('.keys').remove(); return; }
  if (q('#wrap') && !q('#poster') && (SEL || SSEL != null)) { SEL = null; SSEL = null; render(S); return; }
  if (q('#right [data-c]')) { pickColor(q('#right [data-c]').dataset.c); return; }
  const kb = q('[data-t="keys"]'); if (kb) { showKeys(); return; }
  const sl = q('.slotm [data-sl]');
  if (sl) { const n = sl.closest('.slotm').dataset.n, a = sl.dataset.sl; $('.slotm').remove();
    if (a === 'save') { try { localStorage.setItem('pairslot' + n, snap()); const d = new Date(); localStorage.setItem('pairslotT' + n, `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`); Core.toast(`칸${n}에 저장했어요`); } catch (err) { Core.toast('저장 공간이 모자라요'); } topbar(); }
    if (a === 'load') { let v = null; try { v = localStorage.getItem('pairslot' + n); } catch (err) {} if (v) { hist.push(snap()); load(JSON.parse(v)); SEL = null; rerender(); Core.toast(`칸${n}을 불러왔어요 · Ctrl+Z로 되돌리기`); } }
    if (a === 'clear') { try { localStorage.removeItem('pairslot' + n); localStorage.removeItem('pairslotT' + n); } catch (err) {} topbar(); Core.toast(`칸${n}을 비웠어요`); }
    return; }
  const tb = q('#top [data-t]');
  if (tb) { const t = tb.dataset.t;
    if (t === 'undo') undo(); if (t === 'redo') redo();
    if (t === 'zi') zoomBy(.1); if (t === 'zo') zoomBy(-.1);
    if (t === 'zf') { ZOOM = 0; applyZoom(); topbar(); }
    if (t === 'png') { SEL = null; SSEL = null; paint(S); $('#btn-png').click(); }
    if (t === 'slot') slotMenu(tb);
    if (t === 'exp') exportFile();
    return; }
  const tab = q('#left [data-tab]'); if (tab) { TAB = tab.dataset.tab; left(); return; }
  const th = q('#left [data-theme]'); if (th) { const k = th.dataset.theme; S.design = { ...S.design, ...THEMES[k].d, theme: k }; rerender(); left(); Core.toast(`${THEMES[k].nm} 테마로 바꿨어요 · AI로 채우기 OOC도 이 말투로 바뀌었어요`); return; }
  const fo = q('#right [data-font]'); if (fo) { S.design.font = fo.dataset.font; rerender(); return; }
  const bo = q('#right [data-border]'); if (bo) { S.design.border = bo.dataset.border === '1'; rerender(); return; }
  const b = S.blocks.find(x => x.id === SEL);
  if (b) { const bx = q('#right [data-bx]'), co = q('#right [data-cols]'), al = q('#right [data-al]'), tw = q('#right [data-tw]'), li = q('#right [data-li]');
    if (bx) { b.box = bx.dataset.bx === '1'; rerender(); }
    if (co) { b.cols = +co.dataset.cols; rerender(); }
    if (al) { b.al = al.dataset.al; rerender(); }
    if (li && LISTK[b.t]) listItem(b.t, li.dataset.li);
    if (tw) { const [i, w] = tw.dataset.tw.split('.'); S.talk[+i].who = w; rerender(); } }
});
/* 오른쪽 막대·색: 끄는 동안엔 용지만, 놓으면 저장 */
document.addEventListener('input', e => {

});
document.addEventListener('change', e => {

});
