<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>페어틀</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%3E%3Crect%20width%3D%2716%27%20height%3D%2716%27%20rx%3D%273%27%20fill%3D%27%23111%27%2F%3E%3Crect%20x%3D%273%27%20y%3D%273%27%20width%3D%274%27%20height%3D%2710%27%20rx%3D%271%27%20fill%3D%27%23e8e2d4%27%2F%3E%3Crect%20x%3D%279%27%20y%3D%273%27%20width%3D%274%27%20height%3D%2710%27%20rx%3D%271%27%20fill%3D%27%233b5bdb%27%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="NPC와 PC의 페어틀을 여러 형태로 만들어 주는 메이커">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@300;500;800&family=Noto+Serif+KR:wght@500;800&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<style>
/* 페어틀: 같은 내용으로 다섯 가지 틀. 캐릭터 그림은 칸을 눌러 넣는다. 움직임 없음.
   외관틀(가운데 전신 + 양옆 정보) · 정보틀(2×2 그림 + 색 견본 + 체크) · 포스터(큰 글자 + 기울인 사진) · 보고서(창 화면) · 스크랩북 */
:root { --a: #8c1c13; --b: #24427a; --ink: #18181a; --sub: #8a8a90; --ln: #d9d9de; }
body[data-mode="view"] { background: #e7e6e3; }
.tpls { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 12px; }
.tpls button { all: unset; cursor: pointer; padding: 8px 15px; border-radius: 999px; background: #fff; border: 1px solid #d3d1cc; font: 700 13px "Pretendard Variable", sans-serif; color: #333; }
.tpls button[aria-pressed="true"] { background: #18181a; color: #fff; border-color: #18181a; }
.tpls button:focus-visible { outline: 2px solid #2f6bff; outline-offset: 2px; }
.viewer { width: 100%; display: flex; flex-direction: column; align-items: center; }
#wrap { width: 100%; display: flex; justify-content: center; }
.poster { width: 1000px; flex: none; position: relative; overflow: hidden; font: 400 13px/1.5 "Pretendard Variable", Pretendard, sans-serif; color: var(--ink); box-shadow: 0 20px 50px -24px rgba(0,0,0,.4); }
.poster.capturing { box-shadow: none; }
#zoomer:has(.capturing) { zoom: 1 !important; }
/* 그림 칸 */
.pic { position: relative; overflow: hidden; background: #f1f1f3; display: grid; place-items: end center; }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.pic svg.sil { width: 56%; max-width: 200px; height: auto; }
.pic svg.sil.full { width: auto; height: 92%; max-width: none; }
.pic .ph-t { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-size: 11px; color: #a3a3aa; letter-spacing: .04em; }
.pic img ~ svg, .pic img ~ .ph-t { display: none; }
.chk { display: inline-block; width: 11px; height: 11px; border: 1.3px solid currentColor; border-radius: 2px; flex: none; position: relative; top: 1px; }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; flex: none; }

/* ── 1. 외관틀 ── */
.t-look { background: #e9e9ec; padding: 18px; display: grid; grid-template-columns: 236px minmax(0, 1fr) 236px; gap: 14px; }
.t-look .card { background: #fff; border: 1.5px solid #2a2a2e; border-radius: 16px; overflow: hidden; }
.t-look .col { display: grid; gap: 12px; align-content: start; }
.t-look .hd { display: flex; align-items: center; gap: 6px; padding: 12px 14px 4px; }
.t-look .hd b { margin-left: auto; font: 400 44px/0.8 "Archivo Black", sans-serif; }
.t-look .bust { height: 230px; margin: 4px 12px 12px; border-radius: 10px; }
.t-look ul { list-style: none; margin: 0; padding: 12px 14px; display: grid; gap: 6px; font-size: 12.5px; }
.t-look li { display: flex; gap: 7px; align-items: flex-start; }
.t-look .scn { height: 150px; margin: 10px 10px 0; border-radius: 10px; }
.t-look .scn + p { margin: 6px 12px 10px; text-align: center; font-size: 11.5px; color: var(--sub); }
.t-look .mid { position: relative; display: flex; flex-direction: column; }
.t-look .mid .full { flex: 1; min-height: 640px; background: #fff; }
.t-look .mid .top { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-size: 10.5px; color: var(--sub); letter-spacing: .12em; z-index: 2; }
.t-look .tag { position: absolute; z-index: 2; background: #1b1b1e; color: #fff; border-radius: 10px; padding: 6px 12px; text-align: center; font-size: 12px; font-weight: 700; line-height: 1.25; }
.t-look .tag small { display: block; font-size: 10px; font-weight: 500; opacity: .75; }
.t-look .tag::after { content: ""; position: absolute; bottom: -6px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #1b1b1e; }
.t-look .ta { left: 22px; top: 58px; } .t-look .tb { right: 22px; top: 52px; }
.t-look .pills { display: grid; gap: 6px; padding: 12px; border-top: 1.5px solid #2a2a2e; }
.t-look .pl { display: grid; grid-template-columns: 1fr 34px 1fr; gap: 6px; align-items: center; }
.t-look .pl span { border: 1px solid #c9c9cf; border-radius: 999px; padding: 4px 10px; font-size: 12px; text-align: center; min-height: 26px; }
.t-look .pl em { font-style: normal; text-align: center; font-size: 11px; color: var(--sub); font-weight: 700; }

/* ── 2. 정보틀 ── */
.t-info { background: #fff; padding: 30px 26px 26px; }
.t-info .h { text-align: center; }
.t-info .h small { display: block; font-size: 10.5px; color: var(--sub); letter-spacing: .2em; }
.t-info .h h1 { margin: 2px 0 10px; font: 800 26px "Archivo", "Pretendard Variable", sans-serif; letter-spacing: .5em; padding-left: .5em; text-transform: uppercase; }
.t-info .line { display: flex; align-items: center; gap: 10px; width: 440px; margin: 0 auto 22px; }
.t-info .line i { flex: 1; height: 1px; background: #bbb; }
.t-info .line span.p { padding: 3px 18px; border: 1px solid #c9c9cf; border-radius: 999px; font-size: 11px; color: #555; white-space: nowrap; }
.t-info .grid { display: grid; grid-template-columns: 170px 1fr 1fr 170px; gap: 12px; align-items: start; }
.t-info .pic { border: 1px solid #d5d5da; border-radius: 16px; }
.t-info .p1 { height: 250px; } .t-info .p2 { height: 380px; margin-top: 12px; }
.t-info .side { display: grid; gap: 7px; font-size: 11.5px; }
.t-info .sw { display: grid; grid-template-columns: 1fr 50px; gap: 6px; align-items: center; }
.t-info .sw span { border: 1px solid #d5d5da; border-radius: 6px; padding: 3px 8px; text-align: center; font-size: 10.5px; letter-spacing: .1em; }
.t-info .sw i { height: 22px; border-radius: 6px; border: 1px solid rgba(0,0,0,.1); }
.t-info .ck { display: flex; justify-content: flex-end; align-items: center; gap: 7px; color: #444; }
.t-info .R .ck { flex-direction: row-reverse; justify-content: flex-end; }
.t-info .R .sw { grid-template-columns: 50px 1fr; }
.t-info .R .sw i { order: -1; }
.t-info .i { border: 1px solid #d5d5da; border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: center; font-size: 11px; color: #555; margin: 8px 0; }
.t-info .i b { font: 400 22px/1 "Noto Serif KR", serif; }
.t-info .gap { height: 6px; }
.t-info .nmc { margin-top: 8px; border: 1px solid #d5d5da; border-radius: 12px; padding: 8px 12px; display: flex; justify-content: space-between; align-items: flex-end; }
.t-info .nmc b { font-size: 15px; } .t-info .nmc b small { display: block; font-size: 10px; color: var(--sub); font-weight: 500; letter-spacing: .08em; }
.t-info .nmc span { font-size: 10.5px; color: var(--sub); }
.t-info .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 520px; margin: 16px auto 0; }
.t-info .rw { display: grid; gap: 6px; }
.t-info .pr { display: grid; grid-template-columns: 60px 1fr; border: 1px solid #d5d5da; border-radius: 999px; overflow: hidden; font-size: 11px; }
.t-info .pr b { background: #f3f3f5; text-align: center; padding: 4px 0; font-weight: 600; }
.t-info .pr span { padding: 4px 10px; text-align: center; }
.t-info .rel { display: grid; grid-template-columns: 1fr 34px 1fr; gap: 8px; align-items: center; width: 520px; margin: 8px auto 0; }
.t-info .rel span { border: 1px solid #d5d5da; border-radius: 999px; padding: 6px 12px; text-align: center; font-size: 11px; line-height: 1.35; }
.t-info .rel em { font-style: normal; text-align: center; color: var(--sub); }
.t-info .foot { margin-top: 16px; text-align: center; font-size: 10px; color: #aaa; letter-spacing: .1em; }

/* ── 3. 포스터 ── */
.t-poster { background: #efeeea; height: 1240px; }
.t-poster .ghost { position: absolute; left: -20px; right: -20px; top: 300px; font: 400 300px/1 "Archivo Black", sans-serif; color: rgba(0,0,0,.05); white-space: nowrap; text-transform: uppercase; letter-spacing: -.02em; }
.t-poster .hdr { position: absolute; top: 34px; left: 0; right: 0; text-align: center; font: 500 13px "Archivo", sans-serif; letter-spacing: .14em; text-transform: uppercase; }
.t-poster .sq { position: absolute; width: 26px; height: 26px; background: #444; }
.t-poster .handle { position: absolute; top: 30px; right: 40px; border: 1.5px solid #222; padding: 3px 14px; font-size: 12px; font-weight: 700; }
.t-poster .card { position: absolute; background: #fff; padding: 10px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.t-poster .card .pic { width: 330px; height: 400px; }
.t-poster .c1 { left: 150px; top: 130px; transform: rotate(-6deg); z-index: 2; }
.t-poster .c2 { left: 470px; top: 210px; transform: rotate(5deg); z-index: 1; }
.t-poster .card .who { position: absolute; left: 12px; bottom: -32px; font: 800 14px "Archivo", sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.t-poster .title { position: absolute; left: 70px; top: 610px; z-index: 3; font: 400 172px/0.86 "Archivo Black", sans-serif; letter-spacing: -.04em; text-transform: uppercase; }
.t-poster .stk { position: absolute; z-index: 4; background: #fff; border: 1.5px solid #222; padding: 5px 12px; font: 500 16px "Noto Serif KR", serif; }
.t-poster .s1 { left: 560px; top: 700px; transform: rotate(-3deg); } .t-poster .s2 { left: 470px; top: 770px; transform: rotate(2deg); }
.t-poster .ov { position: absolute; z-index: 3; border: 2px solid #222; border-radius: 50%; padding: 8px 28px; font: 800 28px "Archivo", sans-serif; letter-spacing: .02em; background: rgba(239,238,234,.6); }
.t-poster .o1 { left: 40px; top: 130px; transform: rotate(-4deg); } .t-poster .o2 { left: 24px; top: 196px; transform: rotate(2deg); }
.t-poster svg.spark { position: absolute; right: 70px; top: 640px; width: 190px; height: 190px; z-index: 3; }
.t-poster .tc { position: absolute; left: 70px; top: 830px; z-index: 3; }
.t-poster .tc h5 { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; font: 800 15px "Archivo", sans-serif; letter-spacing: .04em; }
.t-poster .tc h5::before { content: ""; width: 54px; height: 3px; background: #222; }
.t-poster .chip { width: 170px; height: 58px; border-radius: 10px; margin-bottom: 10px; display: grid; place-items: center; color: #fff; font: 500 13px "Archivo", sans-serif; border: 2px solid rgba(0,0,0,.25); }
.t-poster .yr { position: absolute; right: 50px; top: 960px; z-index: 3; text-align: right; }
.t-poster .yr span { display: inline-block; margin-bottom: 4px; font: 800 14px "Archivo", sans-serif; letter-spacing: .04em; }
.t-poster .yr span::before { content: "[ "; } .t-poster .yr span::after { content: " ]"; }
.t-poster .yr b { display: block; font: 300 170px/0.85 "Archivo", sans-serif; letter-spacing: -.05em; color: #2a2a2a; }
.t-poster .ft { position: absolute; left: 70px; right: 50px; bottom: 34px; z-index: 3; display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; }
.t-poster .ft b { font: 800 22px "Noto Serif KR", serif; white-space: nowrap; }
.t-poster .ft p { margin: 0; max-width: 520px; font-size: 11.5px; color: #555; line-height: 1.55; }

/* ── 4. 보고서 ── */
.t-rep { background: #f4f4f6; padding: 18px; }
.t-rep .win { background: #fff; border: 1.5px solid #2b2b30; border-radius: 14px; overflow: hidden; }
.t-rep .tb { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1.5px solid #2b2b30; background: #f9f9fb; }
.t-rep .tb .ttl { flex: 1; text-align: center; }
.t-rep .tb .ttl span { display: inline-block; padding: 4px 26px; border: 1.5px solid #2b2b30; border-radius: 999px; font-weight: 800; font-size: 14px; letter-spacing: .1em; }
.t-rep .tb .dots { display: flex; gap: 6px; } .t-rep .tb .dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #2b2b30; }
.t-rep .tb .sr { width: 160px; height: 24px; border: 1.5px solid #2b2b30; border-radius: 999px; }
.t-rep .bd { display: grid; grid-template-columns: 250px 1fr 250px; gap: 14px; padding: 16px; align-items: start; }
.t-rep .pane { border: 1.5px solid #2b2b30; border-radius: 12px; overflow: hidden; }
.t-rep .pane h6 { margin: 0; padding: 6px 12px; border-bottom: 1.5px solid #2b2b30; font-size: 11px; letter-spacing: .14em; background: #f3f3f6; display: flex; justify-content: space-between; }
.t-rep .pane .pic { height: 260px; }
.t-rep .pane .nm { padding: 10px 12px; border-top: 1.5px solid #2b2b30; }
.t-rep .pane .nm b { font-size: 18px; } .t-rep .pane .nm small { display: block; color: var(--sub); font-size: 11px; }
.t-rep dl { margin: 0; padding: 8px 12px 12px; display: grid; grid-template-columns: 54px 1fr; gap: 5px 8px; font-size: 12px; }
.t-rep dt { color: var(--sub); }
.t-rep .cen { display: grid; gap: 14px; align-content: start; }
.t-rep .duo { height: 300px; }
.t-rep .bars { padding: 10px 14px 14px; display: grid; gap: 9px; }
.t-rep .br { display: grid; grid-template-columns: 1fr 70px 1fr; gap: 8px; align-items: center; font-size: 11.5px; }
.t-rep .br em { font-style: normal; text-align: center; font-weight: 700; }
.t-rep .br i { height: 10px; border: 1.3px solid #2b2b30; border-radius: 999px; position: relative; overflow: hidden; }
.t-rep .br i u { position: absolute; top: 0; bottom: 0; }
.t-rep .br i:first-child u { right: 0; } .t-rep .br i:last-child u { left: 0; }
.t-rep .arrows { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 12px 14px; font-size: 12.5px; }
.t-rep .arrows span { text-align: center; } .t-rep .arrows b { padding: 4px 14px; border-radius: 999px; background: #1b1b1e; color: #fff; font-size: 12px; }
.t-rep .qa { padding: 4px 14px 12px; }
.t-rep .qa div { padding: 8px 0; border-bottom: 1px dashed #c9c9cf; font-size: 12px; display: grid; gap: 3px; }
.t-rep .qa div:last-child { border-bottom: 0; }
.t-rep .kw { padding: 10px 12px 12px; display: flex; flex-wrap: wrap; gap: 5px; }
.t-rep .kw span { border: 1.3px solid #2b2b30; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; }
.t-rep .st { padding: 8px 14px; border-top: 1.5px solid #2b2b30; display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); background: #f9f9fb; }

/* ── 5. 스크랩북 ── */
.t-scrap { background: #f3ecdd; padding: 36px 40px 40px; }
.t-scrap h1 { margin: 0 0 4px; font: 400 64px/1 "Nanum Pen Script", cursive; text-align: center; }
.t-scrap .sub { text-align: center; font: 400 26px "Nanum Pen Script", cursive; color: #6a5b45; margin-bottom: 22px; }
.t-scrap .row { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.t-scrap .pol { background: #fff; padding: 12px 12px 16px; box-shadow: 0 10px 18px -10px rgba(60,40,10,.45); position: relative; }
.t-scrap .pol:nth-child(1) { transform: rotate(-2.5deg); } .t-scrap .pol:nth-child(2) { transform: rotate(2deg); }
.t-scrap .pol .pic { height: 360px; background: #ece6da; }
.t-scrap .pol .tape { position: absolute; top: -12px; left: 50%; width: 110px; height: 26px; margin-left: -55px; background: rgba(255,245,200,.85); transform: rotate(-3deg); z-index: 2; }
.t-scrap .pol .cap { margin-top: 10px; font: 400 30px/1 "Nanum Pen Script", cursive; display: flex; justify-content: space-between; align-items: baseline; }
.t-scrap .pol .cap small { font-size: 21px; color: #7a6a52; }
.t-scrap .pol ul { list-style: none; margin: 8px 0 0; padding: 0; font: 400 21px/1.3 "Nanum Pen Script", cursive; color: #3c3326; }
.t-scrap .notes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 34px; }
.t-scrap .note { padding: 16px 16px 18px; font: 400 21px/1.3 "Nanum Pen Script", cursive; box-shadow: 0 8px 14px -8px rgba(60,40,10,.4); }
.t-scrap .note:nth-child(1) { background: #fff3a8; transform: rotate(-1.5deg); }
.t-scrap .note:nth-child(2) { background: #ffd8e1; transform: rotate(1.2deg); }
.t-scrap .note:nth-child(3) { background: #d5ecff; transform: rotate(-.8deg); }
.t-scrap .note b { display: block; font-size: 25px; margin-bottom: 4px; }
.t-scrap .ticket { margin: 30px auto 0; width: 520px; display: grid; grid-template-columns: 1fr 120px; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 8px 14px -8px rgba(60,40,10,.4); }
.t-scrap .ticket div { padding: 14px 18px; }
.t-scrap .ticket div:last-child { border-left: 2px dashed #d8cfbe; background: var(--a); color: #fff; display: grid; place-items: center; text-align: center; font-weight: 800; font-size: 13px; }
.t-scrap .ticket small { display: block; font-size: 11px; letter-spacing: .2em; color: var(--sub); }
.t-scrap .ticket b { font-size: 17px; }
</style>
</head>
<body data-mode="view" data-noframe>
<header class="bar">
  <a class="brand" href="../">귀환의 블로그</a>
  <span class="bar-title">페어틀</span>
  <span class="bar-spacer"></span>
  <div class="tabs" role="tablist"><button data-mode="view" role="tab">보기</button><button data-mode="edit" role="tab">만들기</button></div>
</header>
<main class="stage only-view">
  <p class="shared-note" id="shared-note" hidden>공유받은 페어틀이에요. 만들기에서 고치면 내 브라우저에만 저장돼요.</p>
  <div class="viewer"><div class="tpls" id="tpls" role="group" aria-label="틀"></div><div id="wrap"><div id="zoomer"><article class="poster" id="poster"></article></div></div></div>
  <nav class="actions">
    <button class="btn primary" id="btn-png">이미지 저장</button>
    <button class="btn" id="btn-link">링크 복사</button>
  </nav>
</main>
<main class="editor only-edit" id="editor"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.6.8/dist/index.js"></script>
<script src="../assets/core.js"></script>
<script>
(() => {
const { esc, clamp, num, $ } = Core;
const TPL = { look: '외관틀', info: '정보틀', poster: '포스터', rep: '보고서', scrap: '스크랩북' };
const P = o => ({ name: '', en: '', sex: '', age: '', height: '', role: '', keys: '', feats: '', like: '', dislike: '', color: '#888888', hair: '#2a2a2a', eye: '#555555', outfit: '', quote: '', intro: '', ...o });
const eQA = () => ({ q: '', a: '', b: '' }), eSt = () => ({ k: '', a: 50, b: 50 });
const blank = () => ({ v: 2, tpl: 'look', title: '', sub: '', since: '', a: P({ name: 'NPC', color: '#8c1c13' }), b: P({ name: 'PC', color: '#24427a' }), rel: '', a2b: '', b2a: '', tags: '', first: '', now: '', stats: Array.from({ length: 4 }, eSt), qa: Array.from({ length: 3 }, eQA) });

  <div class="notes">${qa.map(q => `<div class="note"><b>${esc(q.q)}</b>${esc(S.a.name)}: ${esc(q.a || '')}<br>${esc(S.b.name)}: ${esc(q.b || '…')}</div>`).join('')}</div>
  <div class="ticket"><div><small>FIRST MEET</small><b>${esc(S.first || '')}</b><small style="margin-top:8px">NOW</small><b>${esc(S.now || '')}</b></div><div>${esc(S.rel || '')}</div></div>`;
}
const DRAW = { look, info, poster, rep, scrap };
function fit() { const w = $('#wrap'), z = $('#zoomer'); if (w && z) z.style.zoom = Math.min(1, (w.clientWidth - 4) / 1000); }
window.addEventListener('resize', Core.debounce(fit, 120));
function render(S) {
  const el = $('#poster'); el.className = 'poster t-' + S.tpl; el.style.setProperty('--a', S.a.color); el.style.setProperty('--b', S.b.color);
  el.innerHTML = DRAW[S.tpl](S); fit();
  $('#tpls').innerHTML = Object.entries(TPL).map(([k, v]) => `<button type="button" data-t="${k}" aria-pressed="${S.tpl === k}">${v}</button>`).join('');
}
document.addEventListener('click', e => { const b = e.target.closest('#tpls [data-t]'); if (!b) return; const S = ST.state; S.tpl = b.dataset.t; try { localStorage.setItem('2inbun:pair', JSON.stringify(S)); } catch (err) {} render(S); });
const ST = Core.app({ key: '2inbun:pair', what: '페어틀', sample, blank, normalize, schema, prompts, apply, progress, render, fileName: S => `페어틀_${S.a.name}_${S.b.name}` });
})();
</script>
