<style>
/* 콘셉트: PDF로 받은 실제 학교생활기록부. 짙은 회색 문서 뷰어 위 A4 한 장 · 가는 검은 표 · 칸 머리 연회색 · 학교장 직인 */
:root { --desk: #46494e; --ink: #111; --head: #f0f0f0; --line: #1a1a1a; --sub: #4a4a4a; --red: #c8102e; }
body[data-mode="view"] { background: var(--desk); }
body[data-mode="view"] header.bar { background: #2f3236; color: #eceef1; border-bottom: 1px solid #1f2124; }
body[data-mode="view"] .brand, body[data-mode="view"] .bar-title { color: #eceef1; }
body[data-mode="view"] .tabs button { color: #b8bcc2; }
body[data-mode="view"] .tabs button[aria-selected="true"] { background: #eceef1; color: #111; }
body[data-mode="view"] .pc-note, body[data-mode="view"] .shared-note { background: #3a3d42; color: #d6d9dd; border: 1px solid #55595f; }
.viewer { width: 820px; max-width: 100%; display: flex; flex-direction: column; align-items: center; gap: 0; }
.pdfbar { width: 100%; display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 14px; background: #323639; color: #e8eaed; font: 500 13px "Pretendard Variable", Pretendard, sans-serif; border-radius: 8px 8px 0 0; box-shadow: 0 1px 0 #1d1f22; }
.pdfbar .fn { display: inline-flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdfbar .fn svg { width: 16px; height: 16px; flex: none; }
.pdfbar .sp { flex: 1; }
.pdfbar .pg { padding: 3px 9px; background: #202124; border-radius: 4px; font-variant-numeric: tabular-nums; }
.pdfbar .zm { color: #bdc1c6; }
.paper-wrap { width: 100%; padding: 26px 0 30px; background: #525659; border-radius: 0 0 8px 8px; display: flex; justify-content: center; }
.poster { width: 794px; flex: none; background: #fff; color: var(--ink); padding: 52px 50px 36px; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 10px 26px rgba(0,0,0,.45); font: 400 12.3px/1.6 "Nanum Gothic", "Malgun Gothic", sans-serif; position: relative; }
.poster.capturing { box-shadow: none; }
#zoomer:has(.capturing) { zoom: 1 !important; }
.run { display: flex; justify-content: space-between; font-size: 10.5px; color: #777; border-bottom: 1px solid #bbb; padding-bottom: 5px; margin-bottom: 18px; }
.doc-h { display: grid; grid-template-columns: 92px minmax(0, 1fr) 92px; align-items: center; gap: 12px; margin-bottom: 14px; }
.doc-h h1 { margin: 0; text-align: center; font: 800 27px/1.2 "Nanum Myeongjo", serif; letter-spacing: .42em; padding-left: .42em; }
.doc-h h1 small { display: block; margin-top: 8px; font: 400 11px "Nanum Gothic", sans-serif; letter-spacing: .02em; padding: 0; color: var(--sub); }
.doc-h .photo { width: 92px; height: 118px; border: 1px solid var(--line); background: #f6f6f6; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; overflow: hidden; }
.doc-h .photo svg { width: 70px; height: auto; display: block; }
.cls { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
.cls th, .cls td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; font-size: 12px; }
.cls th { background: var(--head); font-weight: 700; }
h2 { margin: 22px 0 6px; font-size: 13.2px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
h2::before { content: ""; width: 4px; height: 13px; background: var(--ink); }
table.t { border-collapse: collapse; width: 100%; table-layout: fixed; }
.t th, .t td { border: 1px solid var(--line); padding: 4px 6px; vertical-align: middle; word-break: keep-all; overflow-wrap: anywhere; }
.t th { background: var(--head); font-weight: 700; text-align: center; font-size: 11.8px; line-height: 1.35; }
.t td.c { text-align: center; }
.att th { white-space: nowrap; padding: 3px 1px; font-size: 10.5px; letter-spacing: -.04em; }
.t td.txt { text-align: left; line-height: 1.75; padding: 6px 9px; text-align: justify; }
.sec { break-inside: avoid; }
.sec.in { animation: fadeUp .5s ease-out both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.doc-f { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; margin-top: 110px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 11px; color: var(--sub); }
.doc-f b { justify-self: center; color: var(--ink); font-size: 12px; font-weight: 700; }
.doc-f span:last-child { justify-self: end; }
.sign { position: absolute; right: 50px; bottom: 66px; display: flex; align-items: center; gap: 10px; font: 800 17px "Nanum Myeongjo", serif; letter-spacing: .2em; }
.seal { position: relative; width: 84px; height: 84px; margin-left: -12px; transform: rotate(-8deg); opacity: .86; mix-blend-mode: multiply; }
.seal svg { width: 100%; height: 100%; display: block; }
.seal.drop { animation: thud .38s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: 1.1s; }
@keyframes thud { from { opacity: 0; transform: rotate(-8deg) scale(1.9); } to { opacity: .86; transform: rotate(-8deg) scale(1); } }
h3 { margin: 10px 0 4px; font-size: 12px; font-weight: 700; }
.doc-h .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.note-p { margin: 4px 0 0; font-size: 10.8px; color: var(--sub); }
@media (max-width: 860px) {
  .pdfbar .zm { display: none; }
  .paper-wrap { padding: 12px 0 14px; }
}

<script>
(() => {
const { esc, clamp, num, $ } = Core;
/* 실제 학교생활기록부(고등학교) 항목 전부:
   1 인적·학적사항 2 출결상황 3 수상경력 4 자격증 및 인증 취득상황 5 학교폭력 조치상황 관리 6 진로희망사항
   7 창의적 체험활동상황(+봉사활동실적) 8 교과학습발달상황(일반 · 진로 선택 · 체육·예술) 9 독서활동상황 10 행동특성 및 종합의견 */
const AREA = ['자율·자치활동', '동아리활동', '진로활동'];
const N = { aw: 6, ce: 3, vol: 5, sub: 8, car: 3, art: 3, rd: 4 };
const eAtt = g => ({ gr: g, days: 0, ill: 0, un: 0, etc: 0, late: 0, early: 0, note: '' });
const eAw = () => ({ name: '', rank: '', date: '', org: '', who: '' });
const eCe = () => ({ kind: '자격증', name: '', no: '', date: '', org: '' });
const eHope = g => ({ gr: g, interest: '', hope: '', why: '' });
const eVol = () => ({ date: '', place: '', what: '', hours: 0 });
const eSub = () => ({ sem: 1, area: '', name: '', unit: 4, score: '', avg: '', ach: '', rank: '', note: '' });
const eCar = () => ({ sem: 1, area: '', name: '', unit: 2, score: '', avg: '', ach: '', dist: '', note: '' });
const eArt = () => ({ sem: 1, area: '', name: '', unit: 2, ach: '', note: '' });
const eRd = () => ({ area: '', books: '' });
const blank = () => ({
  v: 2, school: '', name: 'NPC', sex: '', grade: 2, cls: 1, no: 1, entered: '', bnote: '',
  att: [1, 2, 3].map(eAtt), awards: Array.from({ length: N.aw }, eAw), certs: Array.from({ length: N.ce }, eCe), violence: '',
  hope: [1, 2, 3].map(eHope), cca: AREA.map(a => ({ area: a, hours: 0, text: '' })), vol: Array.from({ length: N.vol }, eVol),
  subjects: Array.from({ length: N.sub }, eSub), career: Array.from({ length: N.car }, eCar), arts: Array.from({ length: N.art }, eArt),
  reading: Array.from({ length: N.rd }, eRd), behavior: '',
});
const sample = () => normalize({
  school: '한빛고등학교', name: 'NPC', sex: '남', grade: 2, cls: 3, no: 14, entered: '2025. 03. 02.',
  att: [{ gr: 1, days: 190, ill: 1 }, { gr: 2, days: 154, late: 3, note: '지각 3회는 모두 등굣길에 같은 반 학생을 기다리다 발생함.' }],
  awards: [
    { name: '교내 수학경시대회', rank: '우수상(2위)', date: '2026.05.20.', org: '한빛고등학교장', who: '2학년(212명)' },
    { name: '학급 모범상', rank: '', date: '2026.07.18.', org: '한빛고등학교장', who: '2학년 3반(29명)' },
  ],
  certs: [{ kind: '자격증', name: '컴퓨터활용능력 2급', no: '25-K9-01****', date: '2025.11.07.', org: '대한상공회의소' }],
  hope: [{ gr: 1, interest: '수학 문제 풀이, 사진 찍기', hope: '건축가', why: '오래 남는 공간을 만들고 싶음.' }, { gr: 2, interest: '건물 동선 관찰', hope: '건축가', why: '사람들이 자연스럽게 마주치는 공간을 설계하고 싶음.' }],
  cca: [
    { area: '자율·자치활동', hours: 28, text: '학급 부반장(2026.03.02.-2026.08.31.)으로서 학급 환경 미화를 맡음. 짝과 함께 교실 뒤 게시판을 꾸미며 역할을 나누고 일정을 조율하는 모습을 보임. 의견이 갈릴 때 자신의 생각을 끝까지 말하지 않고 상대에게 맞추는 경향이 있음.' },
    { area: '동아리활동', hours: 34, text: '(방송부)(34시간) 점심시간 교내 방송에서 선곡과 사연 소개를 담당함. 익명 사연 가운데 같은 반 학생의 사연을 소개하며 끝까지 차분하게 읽어 냄.' },
    { area: '진로활동', hours: 20, text: '학교 건물의 동선을 관찰한 탐구 보고서에서 2층 복도와 매점 사이 동선이 가장 자주 겹친다는 점을 분석하여 발표함.' },
  ],
  vol: [{ date: '2026.04.12.', place: '(학교)한빛고등학교', what: '교내 환경 정화 활동', hours: 4 }, { date: '2026.09.06.', place: '(개인)한빛구립도서관', what: '도서 정리 및 대출 보조', hours: 8 }],
  subjects: [
    { sem: 1, area: '국어', name: '문학', unit: 4, score: 91, avg: '72.4(15.2)', ach: 'A(212)', rank: 2, note: '시 감상 활동에서 화자가 끝내 말하지 못한 마음에 주목하여 “말하지 않은 것도 말한 것만큼 크다”는 감상문을 씀. 자신의 경험과 연결하는 부분에서 표현이 다소 조심스러웠음.' },
    { sem: 1, area: '수학', name: '수학Ⅰ', unit: 4, score: 98, avg: '61.8(21.3)', ach: 'A(212)', rank: 1, note: '수업 후 질문하러 온 같은 반 학생에게 지수함수 그래프를 직접 그려 가며 설명하는 모습이 자주 관찰됨. 설명이 길어져 쉬는 시간이 끝나는 줄 모르는 경우가 있었음.' },
    { sem: 1, area: '영어', name: '영어Ⅰ', unit: 4, score: 84, avg: '70.1(17.6)', ach: 'B(212)', rank: 3 },
    { sem: 1, area: '사회(역사/도덕포함)', name: '한국사', unit: 3, score: 88, avg: '74.5(13.9)', ach: 'A(212)', rank: 2 },
    { sem: 1, area: '과학', name: '물리학Ⅰ', unit: 3, score: 93, avg: '58.2(19.8)', ach: 'A(98)', rank: 1, note: '조별 실험에서 짝과 역할을 바꿔 가며 측정함. 결과 정리는 꼼꼼하나 발표는 짝에게 맡기려는 모습을 보여, 다음 실험에서는 직접 발표하도록 지도함.' },
  ],
  career: [{ sem: 1, area: '과학', name: '물리학Ⅱ', unit: 2, score: 95, avg: '71.3', ach: 'A(42)', dist: 'A(45.2) B(38.1) C(16.7)', note: '' }],
  arts: [{ sem: 1, area: '체육', name: '운동과 건강', unit: 2, ach: 'A', note: '농구 수업에서 같은 팀 학생에게 패스를 자주 연결하며 팀 플레이에 기여함.' }, { sem: 1, area: '예술', name: '음악', unit: 1, ach: 'A' }],
  reading: [{ area: '공통', books: '(1학기) 공간이 사람을 바꾼다(○○○), 말하지 못한 것들(○○○)' }, { area: '수학', books: '(1학기) 페르마의 마지막 정리(사이먼 싱)' }],
  behavior: '주변 사람의 기분을 세심하게 살피고 필요한 것을 먼저 챙기는 배려심이 돋보임. 친구가 결석한 날에는 수업 내용을 정리해 두었다가 다음 날 건네주는 등 책임감이 강함. 다만 자신의 감정을 표현하는 데 서툴러 오해를 사는 경우가 있음. 2학기 들어 특정 급우와의 관계에서 자신의 생각을 솔직하게 말하려 노력하는 모습이 관찰되어 앞으로의 성장이 기대됨.',
});
const arr = (src, n, mk) => Array.from({ length: n }, (_, i) => ({ ...mk(i), ...((Array.isArray(src) ? src : [])[i] || {}) }));
function normalize(s) {
  const b = blank(); s = s && typeof s === 'object' ? s : {};
  const o = { ...b, ...s };
  ['grade', 'cls', 'no'].forEach(k => o[k] = clamp(Math.round(num(o[k], b[k])), 1, 99));
  o.att = arr(s.att, 3, i => eAtt(i + 1)).map((a, i) => { ['days', 'ill', 'un', 'etc', 'late', 'early'].forEach(k => a[k] = clamp(Math.round(num(a[k], 0)), 0, 400)); a.gr = i + 1; return a; });
  o.awards = arr(s.awards, N.aw, eAw); o.certs = arr(s.certs, N.ce, eCe);
  o.hope = arr(s.hope, 3, i => eHope(i + 1)).map((h, i) => ({ ...h, gr: i + 1 }));
  o.cca = AREA.map((a, i) => { const c = { area: a, hours: 0, text: '', ...((s.cca || []).find(x => x && String(x.area || '')[0] === a[0]) || (s.cca || [])[i] || {}) }; c.area = a; c.hours = clamp(Math.round(num(c.hours, 0)), 0, 999); return c; });
  o.vol = arr(s.vol, N.vol, eVol).map(v => ({ ...v, hours: clamp(Math.round(num(v.hours, 0)), 0, 999) }));
  o.subjects = arr(s.subjects, N.sub, eSub); o.career = arr(s.career, N.car, eCar); o.arts = arr(s.arts, N.art, eArt); o.reading = arr(s.reading, N.rd, eRd);
  return o;
}
function apply(S, o) {
  const got = []; const g = n => { if (!got.includes(n)) got.push(n); };
  ['school', 'name', 'sex', 'grade', 'cls', 'no', 'entered', 'bnote'].forEach(k => { if (o[k] != null && o[k] !== '') { S[k] = o[k]; g('인적사항'); } });
  const put = (key, n, mk, label) => { if (Array.isArray(o[key])) { S[key] = Array.from({ length: n }, (_, i) => mk(i)); o[key].slice(0, n).forEach((x, i) => { if (x && typeof x === 'object') S[key][i] = { ...mk(i), ...x }; }); g(label); } };
  put('att', 3, i => eAtt(i + 1), '출결'); put('awards', N.aw, eAw, '수상'); put('certs', N.ce, eCe, '자격증'); put('hope', 3, i => eHope(i + 1), '진로희망');
  if (Array.isArray(o.cca)) { o.cca.forEach(c => { if (!c) return; const i = AREA.findIndex(a => a[0] === String(c.area || '')[0]); if (i >= 0) S.cca[i] = { ...S.cca[i], ...c, area: AREA[i] }; }); g('창체'); }
  put('vol', N.vol, eVol, '봉사'); put('subjects', N.sub, eSub, '교과'); put('career', N.car, eCar, '진로 선택'); put('arts', N.art, eArt, '체육·예술'); put('reading', N.rd, eRd, '독서');
  if (o.violence != null) { S.violence = o.violence; }
  if (o.behavior) { S.behavior = o.behavior; g('행동특성'); }

    ${subs.length ? subs.map(x => `<tr><td class="c">${esc(x.sem)}</td><td class="c">${esc(x.area)}</td><td class="c">${esc(x.name)}</td><td class="c">${esc(x.unit)}</td><td class="c">${esc(x.score)}/${esc(x.avg)}</td><td class="c">${esc(x.ach)}</td><td class="c">${esc(x.rank)}</td><td></td></tr>`).join('') + `<tr><td class="c" colspan="3">이수단위 합계</td><td class="c">${unitSum}</td><td colspan="4"></td></tr>` : none(8)}</tbody></table>
    <h3>&lt;진로 선택 과목&gt;</h3>
    <table class="t"><colgroup><col style="width:6%"><col style="width:13%"><col style="width:14%"><col style="width:7%"><col style="width:16%"><col style="width:13%"><col></colgroup><thead>
    <tr><th>학기</th><th>교과</th><th>과목</th><th>단위수</th><th>원점수/과목평균</th><th>성취도<br>(수강자수)</th><th>성취도별 분포비율</th></tr></thead><tbody>
    ${cars.length ? cars.map(x => `<tr><td class="c">${esc(x.sem)}</td><td class="c">${esc(x.area)}</td><td class="c">${esc(x.name)}</td><td class="c">${esc(x.unit)}</td><td class="c">${esc(x.score)}/${esc(x.avg)}</td><td class="c">${esc(x.ach)}</td><td class="c">${esc(x.dist)}</td></tr>`).join('') : none(7)}</tbody></table>
    <h3>&lt;체육·예술&gt;</h3>
    <table class="t"><colgroup><col style="width:6%"><col style="width:15%"><col style="width:20%"><col style="width:9%"><col></colgroup><thead>
    <tr><th>학기</th><th>교과</th><th>과목</th><th>단위수</th><th>성취도</th></tr></thead><tbody>
    ${arts.length ? arts.map(x => `<tr><td class="c">${esc(x.sem)}</td><td class="c">${esc(x.area)}</td><td class="c">${esc(x.name)}</td><td class="c">${esc(x.unit)}</td><td class="c">${esc(x.ach)}</td></tr>`).join('') : none(5)}</tbody></table>
    <table class="t" style="margin-top:10px"><colgroup><col style="width:16%"><col></colgroup><thead><tr><th>과목</th><th>세부능력 및 특기사항</th></tr></thead><tbody>
    ${notes.length ? notes.map(x => `<tr><td class="c">${esc(x.name)}</td><td class="txt">${esc(x.note)}</td></tr>`).join('') : none(2)}</tbody></table>`));
  p.push(sec('독서활동상황', `<table class="t"><colgroup><col style="width:6%"><col style="width:16%"><col></colgroup><thead><tr><th>학년</th><th>과목 또는 영역</th><th>독서 활동 상황</th></tr></thead><tbody>
    ${rds.length ? rds.map((r, i) => `<tr>${i === 0 ? `<td class="c" rowspan="${rds.length}">${G}</td>` : ''}<td class="c">${esc(r.area)}</td><td class="txt">${esc(r.books)}</td></tr>`).join('') : none(3)}</tbody></table>`));
  p.push(sec('행동특성 및 종합의견', `<table class="t"><colgroup><col style="width:6%"><col></colgroup><thead><tr><th>학년</th><th>행동특성 및 종합의견</th></tr></thead><tbody>
    <tr><td class="c">${G}</td><td class="txt">${esc(S.behavior || '')}</td></tr></tbody></table>`));
  return `
  <div class="run"><span>${esc(school)}</span><span>학교생활기록부</span></div>
  <div class="doc-h"><span></span><h1>학교생활기록부<small>[ ${G}학년 ${S.cls}반 ${S.no}번 ${esc(S.name)} ]</small></h1><div class="photo" data-photo="a">${pic ? `<img src="${pic}" alt="${esc(S.name)} 사진">` : '<svg viewBox="0 0 70 80" aria-hidden="true"><circle cx="35" cy="30" r="15" fill="#cfcfcf"/><path d="M6 80c2-18 14-28 29-28s27 10 29 28z" fill="#cfcfcf"/></svg>'}</div></div>
  <table class="cls"><thead><tr><th>학년</th><th>학과</th><th>반</th><th>번호</th><th>담임성명</th></tr></thead><tbody>
    ${[1, 2, 3].map(g => `<tr><td>${g}</td><td>-</td><td>${g === G ? S.cls : ''}</td><td>${g === G ? S.no : ''}</td><td>${g <= G ? '(인)' : ''}</td></tr>`).join('')}</tbody></table>
  ${p.join('')}
  <div class="sign">${esc(school)}장<span class="seal${anim ? ' drop' : ''}" aria-label="학교장 직인">${sealSVG(school)}</span></div>
  <div class="doc-f"><span>출력일 ${stampDate}</span><b>- 1 -</b><span>${esc(school)}</span></div>`;
}
/* 학교장 직인: 붉은 네모 도장, 글자는 오른쪽 세로줄부터 위에서 아래로 */
function sealSVG(school) {
  const ch = [...(school.replace(/s/g, '') + '장인')].slice(0, 9), rows = 3, cols = Math.ceil(ch.length / rows), cw = 62 / cols, rh = 62 / rows;
  let t = '';
  ch.forEach((c, i) => { const col = Math.floor(i / rows), row = i % rows; t += `<text x="${74 - 6 - cw * col - cw / 2}" y="${6 + rh * row + rh * .78}" font-size="${Math.min(cw, rh) * .86}" text-anchor="middle">${esc(c)}</text>`; });
  return `<svg viewBox="0 0 74 74"><rect x="2" y="2" width="70" height="70" rx="3" fill="none" stroke="#c8102e" stroke-width="3.2"/><rect x="5.5" y="5.5" width="63" height="63" fill="none" stroke="#c8102e" stroke-width="1"/><g fill="#c8102e" font-family="Nanum Myeongjo, serif" font-weight="800">${t}</g></svg>`;
}
/* 화면이 좁으면 A4 한 장을 통째로 줄여서 보여 준다 (저장 이미지는 원래 크기) */
function fit() {
  const w = $('#wrap'), z = $('#zoomer'); if (!w || !z) return;
  const k = Math.min(1, (w.clientWidth - 16) / 794); z.style.zoom = k; const zm = $('#zm'); if (zm) zm.textContent = Math.round(k * 100) + '%';
}
window.addEventListener('resize', Core.debounce(fit, 120));
function render(S, { animate }) { $('#poster').innerHTML = posterHTML(S, animate); const f = $('#fname'); if (f) f.textContent = `생활기록부_${S.name || 'NPC'}.pdf`; fit(); }
Core.app({ key: '2inbun:record', what: '생활기록부', sample, blank, normalize, schema, prompts, apply, progress, render, fileName: S => `생활기록부_${S.name}` });
})();
</script>
</body>
</html>
