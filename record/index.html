function normalize(s) {
  const b = blank(); s = s && typeof s === 'object' ? s : {};
  const o = { ...b, ...s };
  ['grade', 'cls', 'no'].forEach(k => o[k] = clamp(Math.round(num(o[k], b[k])), 1, 99));
  o.att = [1, 2, 3].map((g, i) => { const a = { ...emptyAtt(g), ...((s.att || [])[i] || {}) }; ['days', 'ill', 'un', 'late', 'early'].forEach(k => a[k] = clamp(Math.round(num(a[k], 0)), 0, 400)); a.gr = g; return a; });
  o.awards = Array.from({ length: 4 }, (_, i) => ({ ...emptyAw(), ...((s.awards || [])[i] || {}) }));
  o.cca = AREA.map((a, i) => { const c = { area: a, hours: 0, text: '', ...((s.cca || [])[i] || {}) }; c.area = a; c.hours = clamp(Math.round(num(c.hours, 0)), 0, 999); return c; });
  o.subjects = Array.from({ length: 6 }, (_, i) => ({ ...emptySub(), ...((s.subjects || [])[i] || {}) }));
  return o;
}
function apply(S, o) {
  const got = [];
  ['school', 'name', 'sex', 'grade', 'cls', 'no', 'entered'].forEach(k => { if (o[k] != null && o[k] !== '') { S[k] = o[k]; if (!got.includes('인적사항')) got.push('인적사항'); } });
  if (Array.isArray(o.att)) { o.att.slice(0, 3).forEach((a, i) => { if (a && typeof a === 'object') S.att[i] = { ...S.att[i], ...a }; }); got.push('출결'); }
  if (Array.isArray(o.awards)) { S.awards = Array.from({ length: 4 }, emptyAw); o.awards.slice(0, 4).forEach((a, i) => { if (a) S.awards[i] = { ...emptyAw(), ...a }; }); got.push('수상'); }
  if (Array.isArray(o.cca)) { o.cca.forEach(c => { if (!c) return; const i = AREA.findIndex(a => a[0] === String(c.area || '')[0]); if (i >= 0) S.cca[i] = { ...S.cca[i], ...c, area: AREA[i] }; }); got.push('창체'); }

  return got;
}
const RULE = `▪ 문체: 실제 학교생활기록부 그대로. 교사가 관찰해 쓴 개조식 서술(“~함.”, “~을 보임.”, “~하는 모습이 돋보임.”), 주어 생략, 감탄·이모티콘·비유 없이 건조하게. 웃음 포인트는 RP 속 일을 이 공문서 말투로 진지하게 적는 데서 나온다.
▪ 다른 학생 이름은 쓰지 않는다. PC는 “같은 반 학생”, “짝”, “특정 급우”처럼만 적는다. 교사·친구 같은 다른 인물의 이름이나 대사도 쓰지 않는다.
▪ 근거: 설정과 RP에서 실제 있었던 일만. PC의 말·행동은 RP에 나온 것만 쓰고 지어내지 않는다. 여기서 만든 내용은 이후 RP의 사실로 삼지 않는다.

{"school":"","name":"","sex":"","grade":2,"cls":1,"no":1,"entered":"","att":[{"days":190,"ill":0,"un":0,"late":0,"early":0,"note":""}],"awards":[{"name":"","rank":"","date":"","org":"","who":""}],"cca":[{"area":"자율·자치활동","hours":0,"text":""}]}]*`;
