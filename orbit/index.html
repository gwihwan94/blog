<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두 행성</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2016%2016%27%20shape-rendering%3D%27crispEdges%27%3E%3Crect%20width%3D%2716%27%20height%3D%2716%27%20rx%3D%273%27%20fill%3D%27%230d1330%27%2F%3E%3Cpath%20d%3D%27M3%206h4v4H3z%27%20fill%3D%27%23ffb067%27%2F%3E%3Cpath%20d%3D%27M10%205h3v3h-3z%27%20fill%3D%27%238fd3ff%27%2F%3E%3Cpath%20d%3D%27M2%2012h12v1H2z%27%20fill%3D%27%23fff%27%20opacity%3D%27.35%27%2F%3E%3C%2Fsvg%3E">
<meta name="description" content="러스벌트의 투자 모델 점수로 두 사람을 두 행성으로 만들고, 실제 중력 계산으로 궤도를 돌려 결말을 정하는 메이커">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">

<style>
/* 레이아웃: 관측 기록지. 왼쪽 궤도 플롯(모눈 + 잉크 궤적) · 오른쪽 관측값과 사건 기록 · 아래 판정 카드 */
:root {
  --bg: #dfe4e8;
  --paper: #eef2f4;
  --ink: #18222e;
  --muted: #5d6b78;
  --grid: rgba(24, 34, 46, .08);
  --grid2: rgba(24, 34, 46, .16);
  --accent: #b8452f;
  --hair: rgba(24, 34, 46, .16);
}
.poster { width: min(1060px, 100%); background: var(--paper); color: var(--ink); border-radius: 4px; box-shadow: 0 1px 0 rgba(24,34,46,.1), 0 22px 50px -18px rgba(24,34,46,.35); overflow: hidden; }
.poster.capturing { border-radius: 0; box-shadow: none; }

/* 기록지 머리 */
.head { display: grid; grid-template-columns: 1fr auto; gap: 18px; padding: 26px 32px 18px; border-bottom: 1.5px solid var(--ink); }
.head .kick { font-size: 13px; font-weight: 700; color: var(--muted); }
.head h1 { margin: 6px 0 0; font-size: 32px; font-weight: 800; letter-spacing: -.045em; line-height: 1.2; word-break: keep-all; text-wrap: balance; }
.head p { margin: 8px 0 0; font-size: 14.5px; color: #3a4754; line-height: 1.65; max-width: 60ch; }
.stamp { align-self: start; text-align: right; font-family: var(--mono); font-size: 11px; line-height: 1.9; color: var(--muted); }
.stamp b { color: var(--ink); font-weight: 600; }

.body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.plot { position: relative; padding: 18px; border-right: 1px solid var(--hair); }
.plot canvas { display: block; width: 100%; aspect-ratio: 1; background: #05070d; border: 1px solid var(--ink); }
.plot .axis { position: absolute; left: 27px; top: 27px; font-family: "Galmuri9", var(--mono); font-size: 11.5px; color: #c9d3ef; background: rgba(5,7,13,.7); padding: 3px 6px; }
.side { padding: 20px 24px 22px; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.blk h3 { margin: 0 0 10px; font-size: 13px; font-weight: 800; color: var(--ink); }

/* 관측 대상: 투자 모델 세 값 */
.bodies { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.bd .nm { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; margin-bottom: 8px; }
.bd .nm i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1.5px var(--ink); }
.meter { display: grid; grid-template-columns: 52px 1fr 26px; gap: 8px; align-items: center; font-size: 12px; margin-top: 5px; }
.meter span:first-child { color: var(--muted); }
.meter .tr { height: 6px; background: var(--grid2); position: relative; }
.meter .tr i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); width: var(--w); }
.meter b { font-family: var(--mono); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.bd .note { margin: 8px 0 0; font-size: 12.5px; line-height: 1.6; color: #3a4754; }

/* 실시간 관측값 */
.live { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--ink); }
.live div { padding: 8px 10px; border-right: 1px solid var(--hair); }
.live div:last-child { border-right: 0; }
.live small { display: block; font-size: 12px; color: var(--muted); }
.live b { font-family: var(--mono); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* 사건 기록 */
.evs { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
.evs li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 13px; line-height: 1.5; transition: background .3s; }
.evs li .n { width: 22px; height: 22px; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 600; border: 1.5px solid var(--ink); transform: rotate(45deg); }
.evs li .n span { transform: rotate(-45deg); }
.evs li b { display: block; font-size: 13.5px; }
.evs li .k { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.evs li.hit { background: rgba(184,69,47,.08); }
.evs li.hit .n { background: var(--ink); color: var(--paper); }

.ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ctrl .play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper); display: grid; place-items: center; cursor: pointer; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 11px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--ink); min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.capturing .ctrl { display: none; }

/* 판정 */
.verdict { display: grid; grid-template-columns: auto 1fr auto; gap: 22px; align-items: center; padding: 22px 32px 26px; border-top: 1.5px solid var(--ink); }
.verdict .ty { width: 88px; height: 88px; border: 1.5px solid var(--ink); border-radius: 50%; display: grid; place-items: center; position: relative; }
.verdict .ty svg { width: 64px; height: 64px; }
.verdict small { font-size: 13px; font-weight: 700; color: var(--accent); }
.verdict h2 { margin: 4px 0 6px; font-size: 24px; font-weight: 800; letter-spacing: -.04em; text-wrap: balance; }
.verdict p { margin: 0; font-size: 14.5px; line-height: 1.75; max-width: 62ch; }
.commit { font-family: var(--mono); font-size: 12px; line-height: 2; text-align: right; color: var(--muted); white-space: nowrap; }
.commit b { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
.verdict.pending h2, .verdict.pending p { color: var(--muted); }
.foot { display: flex; justify-content: space-between; gap: 12px; padding: 12px 32px; border-top: 1px solid var(--hair); font-size: 11px; color: var(--muted); }

@media (max-width: 820px) {
  .head { grid-template-columns: 1fr; padding: 20px 18px 14px; }
  .head h1 { font-size: 25px; }
  .stamp { text-align: left; }
  .body { grid-template-columns: 1fr; }
  .plot { border-right: 0; border-bottom: 1px solid var(--hair); padding: 12px; }
  .side { padding: 16px 16px 18px; }
  .live { grid-template-columns: repeat(2, 1fr); }
  .live div:nth-child(2) { border-right: 0; }
  .live div:nth-child(-n+2) { border-bottom: 1px solid var(--hair); }
  .verdict { grid-template-columns: auto 1fr; padding: 18px; }
  .commit { grid-column: 1 / -1; text-align: left; }
  .foot { flex-direction: column; padding: 12px 18px; }
}

/* ───────── Y2K 우주 관측 프로그램: 은색 크롬 머리판 · 남색 우주 몸체 · 하늘·보라 그라데이션 계기판 · 도트 글씨 ───────── */
:root { --px: "Galmuri11", var(--ui-font); --px9: "Galmuri9", "Galmuri11", var(--ui-font); --neo: #8ff3ff; --neo2: #ff8de2; --sp: #0d1330;
  --chrome: linear-gradient(180deg, #ffffff 0%, #e6e8ee 40%, #c3c8d3 52%, #e9ebf1 78%, #f8f9fb 100%); }
.poster { border-radius: 0; border: 1px solid #000; box-shadow: 5px 5px 0 #000; background: linear-gradient(160deg, #11183d 0%, #0b0f26 55%, #1d1240 100%); color: #e8ecff; }
.poster.capturing { box-shadow: none; }
.head { background: var(--chrome); color: #11141d; border-bottom: 1px solid #000; }
.head .kick { font-family: var(--px9); font-weight: 400; color: #4a4e58; }
.head h1 { font-family: var(--px); font-weight: 400; letter-spacing: 0; }
.head p { color: #3c404a; }
.stamp { font-family: var(--px9); color: #4a4e58; } .stamp b { color: #11141d; font-weight: 400; }
.plot { border-right: 1px solid rgba(143,243,255,.25); }
.plot canvas { border: 1px solid rgba(143,243,255,.5); box-shadow: 0 0 0 1px #000, 0 0 24px rgba(120,160,255,.25); }
.side { color: #e8ecff; }
.blk h3 { font-family: var(--px); font-weight: 400; color: var(--neo); font-size: 13.5px; }
.bd .nm { font-family: var(--px); font-weight: 400; color: #fff; }
.bd .nm i { border-radius: 50%; box-shadow: 0 0 0 1.5px #fff, 0 0 10px var(--c); }
.meter span:first-child { color: #aab3d6; font-family: var(--px9); }
.meter .tr { background: rgba(255,255,255,.1); height: 7px; }
.meter .tr i { background: linear-gradient(90deg, var(--neo), #a58bff 60%, var(--neo2)); box-shadow: 0 0 6px rgba(143,243,255,.5); }
.meter b { color: #fff; font-family: var(--px9); font-weight: 400; }
.bd .note { color: #c3cae6; }
.live { border: 1px solid rgba(143,243,255,.6); background: #050817; box-shadow: inset 2px 2px 0 #000; }
.live div { border-right: 1px solid rgba(143,243,255,.2); }
.live small { color: #7fa3c9; font-family: var(--px9); }
.live b { color: #b6ffcf; font-family: var(--px); font-weight: 400; text-shadow: 0 0 6px rgba(140,255,180,.5); }
.evs { border-top: 1px solid rgba(143,243,255,.4); }
.evs li { border-bottom: 1px solid rgba(255,255,255,.1); color: #dfe4fa; }
.evs li b { font-family: var(--px); font-weight: 400; color: #fff; }
.evs li .n { border-color: var(--neo); color: var(--neo); font-family: var(--px9); }
.evs li .k { color: #8b94bb; font-family: var(--px9); }
.evs li.hit { background: linear-gradient(90deg, rgba(143,243,255,.14), rgba(255,141,226,.08)); }
.evs li.hit .n { background: var(--neo); color: #06102a; }
.ctrl .play { border-radius: 0; background: linear-gradient(180deg, #b9fbff, #57d6ef); color: #06102a; border: 1px solid #000; box-shadow: 2px 2px 0 #000; }
.seg { border-radius: 0; border: 1px solid rgba(143,243,255,.7); }
.seg button { color: #dfe4fa; font-family: var(--px9); font-weight: 400; }
.seg button[aria-pressed="true"] { background: var(--neo); color: #06102a; }
.verdict { border-top: 1px solid rgba(143,243,255,.4); background: linear-gradient(90deg, rgba(143,243,255,.08), rgba(165,139,255,.1) 50%, rgba(255,141,226,.08)); }
.verdict .ty { border-color: var(--neo); color: var(--neo); box-shadow: 0 0 18px rgba(143,243,255,.3); }
.verdict small { color: var(--neo2); font-family: var(--px9); font-weight: 400; }
.verdict h2 { font-family: var(--px); font-weight: 400; letter-spacing: 0; color: #fff; }
.verdict p { color: #d6dbf3; }
.commit { color: #8b94bb; font-family: var(--px9); } .commit b { color: var(--neo); font-family: var(--px); font-weight: 400; }
.verdict.pending h2, .verdict.pending p { color: #6f7898; }
.foot { border-top: 1px solid rgba(255,255,255,.12); color: #8b94bb; font-family: var(--px9); }

/* 지금 무슨 일인지: 궤도 화면 아래쪽 자막 */
.plot .say { position: absolute; left: 30px; right: 30px; top: 56px; padding: 10px 14px; background: rgba(5,8,20,.84); border: 1px solid rgba(143,243,255,.45); color: #e8ecff; font-size: 14px; line-height: 1.55; min-height: 48px; transition: border-color .3s; }
.plot .say b { display: block; font: 400 15px var(--px, sans-serif); color: var(--neo, #8ff3ff); margin-bottom: 2px; }
.plot .say small { display: block; margin-top: 4px; font-size: 12px; color: #aab3d6; }
.plot .say.pull { border-color: #8ff3ff; } .plot .say.push { border-color: #ff8de2; } .plot .say.push b { color: #ff8de2; } .plot .say.end b { color: #ffe08a; }
.plot .how { margin: 10px 2px 0; font-size: 12.5px; color: #aab3d6; line-height: 1.5; }
.capturing .plot .say { display: none; }
@media (max-width: 820px) { .plot .say { left: 20px; right: 20px; top: 46px; font-size: 13px; } }

/* 바깥: 깊은 우주 — 별 · 성운 · 어두운 유리 메뉴 줄 · 하늘색 네온 버튼 줄 */
body[data-mode="view"] { background: radial-gradient(circle at 20% 30%, rgba(165,139,255,.25), transparent 35%), radial-gradient(circle at 80% 70%, rgba(143,243,255,.18), transparent 40%), radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 1.3px) 0 0 / 53px 53px, radial-gradient(circle, rgba(255,255,255,.45) 1px, transparent 1.3px) 17px 29px / 37px 37px, linear-gradient(180deg, #050816, #0d1330 60%, #1a1240) fixed; }
body[data-mode] header.bar { background: linear-gradient(180deg, #1a2350, #0b1028); border-bottom: 1px solid #8ff3ff; color: #e8ecff; box-shadow: 0 0 12px rgba(143,243,255,.3); }
body[data-mode] .brand, body[data-mode] .bar-title { color: #e8ecff; }
body[data-mode] .brand::before { background: #8ff3ff; box-shadow: 0 0 6px #8ff3ff; }
body[data-mode] .tabs button { color: #aab3d6; }
body[data-mode] .tabs button[aria-selected="true"] { background: #8ff3ff; color: #06102a; }
body[data-mode] .actions { background: rgba(11,16,40,.92); border: 1px solid #8ff3ff; box-shadow: 0 0 16px rgba(143,243,255,.35), 4px 4px 0 #000; }
body[data-mode] .actions .btn { background: transparent; color: #e8ecff; border-color: rgba(143,243,255,.5); box-shadow: none; }
body[data-mode] .actions .btn.primary { background: linear-gradient(180deg, #b9fbff, #57d6ef); color: #06102a; }
body[data-mode] .shared-note { background: rgba(11,16,40,.92); color: #e8ecff; border: 1px solid #8ff3ff; box-shadow: 0 0 12px rgba(143,243,255,.3); }
body[data-mode] .stage .btn:not(.actions .btn) { background: transparent; color: #e8ecff; border: 1px solid rgba(143,243,255,.6); box-shadow: none; }

/* 바탕은 단색·그라데이션만 */
body[data-mode="view"] { background: linear-gradient(180deg, #050816 0%, #0d1330 60%, #1a1240 100%) fixed; }

/* 만들기 화면 툴 색 */
body { --e-main:#3b5bd9;--e-dark:#1d2f80;--e-ink:#0d1330;--e-win:#f6f8ff;--e-s1:#e3e9ff;--e-s2:#97a8e6;--e-bg1:#0d1330;--e-bg2:#1a1240; }
</style>
</head>
<body data-mode="view" data-noframe>
<header class="bar">
  <a class="brand" href="../">귀환의 블로그</a>
  <span class="bar-title">두 행성</span>
  <span class="bar-spacer"></span>
  <div class="tabs" role="tablist"><button data-mode="view" role="tab">보기</button><button data-mode="edit" role="tab">만들기</button></div>
</header>
<main class="stage only-view">
  <p class="shared-note" id="shared-note" hidden>공유받은 관측 기록이에요. 만들기에서 고치면 내 브라우저에만 저장돼요.</p>
  <article class="poster" id="poster"></article>
  <nav class="actions">
    <button class="btn primary" id="btn-png">이미지 저장</button>
    <button class="btn" id="btn-link">링크 복사</button>
    <button class="btn" id="btn-replay">다시 관측</button>
  </nav>
</main>
<main class="editor only-edit" id="editor"></main>

<script>
(() => {
const { esc, br, clamp, num, $, pad, initial, today } = Core;
const MAX_EV = 5;
const OUT = {
  circle:  { n: '원 궤도', d: '일정한 거리로 서로의 둘레를 도는 안정된 쌍성계' },
  ellipse: { n: '타원 궤도', d: '가까워졌다 멀어지기를 되풀이하는 긴 궤도' },
  collide: { n: '충돌', d: '거리를 버티지 못하고 하나로 합쳐짐' },
  escape:  { n: '이탈', d: '서로의 중력을 벗어나 각자의 궤도로 떠남' },
};

const emptyEv = () => ({ at: 50, kind: 'pull', power: 40, title: '', text: '' });
const blank = () => ({
  v: 1, title: '', sub: '', dist: 50,
  a: { name: 'NPC', color: '#d9822b', sat: 50, inv: 50, alt: 50, note: '' },
  b: { name: 'PC', color: '#3b6fb6', sat: 50, inv: 50, alt: 50, note: '' },
  events: Array.from({ length: MAX_EV }, emptyEv),
  endings: Object.fromEntries(Object.keys(OUT).map(k => [k, { title: '', text: '' }])),
});
const sample = () => ({
  v: 1,
  title: '두 사람의 궤도',
  sub: '서로에게 들인 시간은 많고, 다른 대안은 적다.',
  dist: 42,
  a: { name: 'NPC', color: '#c99a2e', sat: 64, inv: 82, alt: 18, note: '서고에 같은 시간에 들르는 데 이미 많은 마음을 썼다. 정략이라 묶인 게 아니라 떠날 생각이 없다.' },
  b: { name: 'PC', color: '#3b6fb6', sat: 86, inv: 58, alt: 34, note: '연회장에 들어서면 늘 황태자부터 찾는다. 청혼하는 사람은 많지만 기다리게 되는 사람은 하나다.' },
  events: [
    { at: 18, kind: 'pull', power: 62, title: '첫 춤', text: '무도회에서 의례상 청한 첫 춤이 한 곡 더 이어졌다.' },
    { at: 46, kind: 'push', power: 38, title: '부치지 않은 편지', text: '황태자가 쓴 편지를 부치지 않고 태웠다. 공녀는 그런 편지가 있었는지도 모른다.' },
    { at: 70, kind: 'pull', power: 45, title: '먼저 건넨 말', text: '황태자가 처음으로 먼저 정원을 같이 걷자고 했다.' },
    emptyEv(), emptyEv(),
  ],
  endings: {
    circle: { title: '서로를 중심에 둔 궤도', text: '누가 먼저 다가갔는지는 기록되지 않는다. 두 사람은 같은 거리에서 같은 속도로 계속 돈다.' },
    ellipse: { title: '가까워졌다 멀어졌다', text: '공무가 많은 시기엔 멀어지고 한가해지면 다시 가까워진다. 그래도 궤도는 매번 같은 자리로 돌아온다.' },
    collide: { title: '하나가 된 궤도', text: '태운 편지 내용까지 전부 말하고 나면 더는 따로 셀 수 없게 된다.' },
    escape: { title: '각자의 궤도', text: '서로가 아니어도 돌아가는 하루가 더 무거워지는 순간, 두 사람은 조용히 멀어진다.' },
  },
});

  return `
  <header class="head">
    <div><span class="kick">투자 모델 궤도 관측</span><h1>${br(S.title || '이름 없는 쌍성계')}</h1>${S.sub ? `<p>${br(S.sub)}</p>` : ''}</div>
    <div class="stamp">관측일 <b>${today()}</b><br>대상 <b>${esc(S.a.name)} · ${esc(S.b.name)}</b><br>계산 <b>${STEPS.toLocaleString()} 단계</b></div>
  </header>
  <div class="body">
    <div class="plot"><canvas id="cv" aria-label="두 행성의 궤도"></canvas><span class="axis">점선 원 = 처음 거리의 0.5 · 1 · 1.5배</span><div class="say" id="say" aria-live="polite"></div><p class="how">두 행성이 가까워질수록 관계도 가까워요. 궤도 위 ◇는 롤플에서 실제 있었던 사건이에요.</p></div>
    <div class="side">
      <div class="blk"><h3>관측 대상</h3><div class="bodies">${body(S.a, sim.mA)}${body(S.b, sim.mB)}</div></div>
      <div class="blk"><h3>실시간 관측값</h3><div class="live">
        <div><small>경과</small><b id="lv-t">0%</b></div><div><small>거리</small><b id="lv-r">${Math.round(sim.r0)}</b></div>
        <div><small>가장 가까움</small><b id="lv-min">${Math.round(sim.minR)}</b></div><div><small>이심률</small><b id="lv-e">-</b></div></div></div>
      <div class="ctrl"><button class="play" id="o-play" aria-label="관측 시작"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11L13.5 8z"/></svg></button>
        <span class="seg" id="o-speed"><button data-s="1" aria-pressed="true">1배</button><button data-s="2">2배</button><button data-s="4">4배</button></span></div>
      ${evs.length ? `<div class="blk"><h3>사건 기록</h3><ol class="evs">${evs.map((e, j) => `<li data-ev="${j}"><span class="n"><span>${j + 1}</span></span><span><b>${esc(e.title)}</b>${esc(e.text)}</span><span class="k">${e.kind === 'pull' ? '끌어당김' : '밀어냄'} ${e.power}</span></li>`).join('')}</ol></div>` : ''}
    </div>
  </div>
  <section class="verdict pending" id="verdict">
    <span class="ty">${outIcon(sim.out)}</span>
    <div><small>판정 · ${OUT[sim.out].n}</small><h2>${br(end.title || OUT[sim.out].d)}</h2><p>${br(end.text || OUT[sim.out].d)}</p></div>
    <div class="commit">헌신도 ${esc(S.a.name)} <b>${commit(S.a)}</b><br>헌신도 ${esc(S.b.name)} <b>${commit(S.b)}</b></div>
  </section>
  <footer class="foot"><span>러스벌트(Rusbult)의 투자 모델(만족도 · 투자 크기 · 대안의 질)을 중력 계산에 옮긴 놀이용 기록이에요. 실제 심리 진단이 아니에요.</span><span>두 행성</span></footer>`;
}

let raf = 0, speed = 1, cur = null;
function render(S, { animate }) {
  cancelAnimationFrame(raf);
  const sim = simulate(S); cur = { S, sim };
  const el = $('#poster'); el.innerHTML = posterHTML(S, sim);
  const cv = $('#cv'); const N = sim.path.length;
  const lvT = $('#lv-t'), lvR = $('#lv-r'), lvE = $('#lv-e'), vd = $('#verdict');
  const evRows = [...el.querySelectorAll('[data-ev]')];
  /* 지금 무슨 일인지 글로: 사건이 일어나면 그 사건, 아니면 가까워지는지 멀어지는지 */
  const say = n => { const box = $('#say'); if (!box) return; const evs = S.events.map((e, i) => ({ ...e, i })).filter(e => e.title).sort((p, q) => p.at - q.at);
    let hit = null; sim.hits.forEach((h, j) => { if (h.s <= n && n - h.s < 650) hit = { e: evs[j], j }; });
    if (n >= N) { box.innerHTML = '<b>관측 끝</b>' + esc(OUT[sim.out].n) + ' · ' + esc(OUT[sim.out].d); box.className = 'say end'; return; }
    if (hit && hit.e) { box.innerHTML = '<b>' + (hit.j + 1) + ' · ' + esc(hit.e.title) + '</b>' + esc(hit.e.text || '') + '<small>' + (hit.e.kind === 'pull' ? '끌어당김: 둘 사이가 가까워져요' : '밀어냄: 둘 사이가 멀어져요') + '</small>'; box.className = 'say ' + (hit.e.kind === 'pull' ? 'pull' : 'push'); return; }
    const i1 = Math.max(0, Math.min(N - 1, (n | 0) - 30)), i2 = Math.max(0, Math.min(N - 1, n | 0)), a = sim.path[i1], b = sim.path[i2]; if (!a || !b) return; const ra = Math.hypot(a[0], a[1]), rb = Math.hypot(b[0], b[1]);
    box.innerHTML = rb < ra - .05 ? '<b>가까워지는 중</b>두 행성이 서로를 끌어당기고 있어요' : rb > ra + .05 ? '<b>멀어지는 중</b>두 행성 사이가 벌어지고 있어요' : '<b>나란히 도는 중</b>거리가 거의 그대로예요'; box.className = 'say'; };
  const update = n => {
    const { r } = drawPlot(cv, S, sim, n);
    lvT.textContent = Math.round(n / N * 100) + '%'; lvR.textContent = Math.round(r);
    sim.hits.forEach((h, j) => evRows[j]?.classList.toggle('hit', h.s <= n));
    say(n);
    if (n >= N) { lvE.textContent = sim.ecc >= 1 ? '≥ 1' : sim.ecc.toFixed(2); vd.classList.remove('pending'); }
  };
  const playFrom = start => {
    cancelAnimationFrame(raf); vd.classList.add('pending'); lvE.textContent = '-';
    let n = start, last = performance.now();
    const tick = now => { const dt = Math.min(64, now - last); last = now; n = Math.min(N, n + dt * 0.12 * speed); update(Math.floor(n)); if (n < N) raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    /* 탭이 가려져도 결과는 그려지게 */
    setTimeout(() => { if (cur && cur.sim === sim && n < N) { n = N; update(N); } }, (N / 0.12 / speed) + 800);
  };
  $('#o-play').onclick = () => playFrom(0);
  el.querySelectorAll('#o-speed [data-s]').forEach(b => { b.setAttribute('aria-pressed', String(Number(b.dataset.s) === speed)); b.onclick = () => { speed = Number(b.dataset.s); el.querySelectorAll('#o-speed [data-s]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }; });
  requestAnimationFrame(() => playFrom(0));
}
window.addEventListener('resize', Core.debounce(() => { if (cur && document.body.dataset.mode === 'view') drawPlot($('#cv'), cur.S, cur.sim, cur.sim.path.length); }, 150));

Core.app({
  key: '2inbun:orbit', what: '관측 기록', sample, blank, normalize, schema, prompts, apply, progress, render,
  fileName: S => `두행성_${S.a.name}_${S.b.name}`,
});
})();
</script>
</body>
</html>
